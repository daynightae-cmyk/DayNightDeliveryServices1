name: DayNightRoleApps
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 8
    MARKETING_VERSION: 1.2.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    SWIFT_STRICT_CONCURRENCY: targeted
    GENERATE_INFOPLIST_FILE: false

targets:
  DayNightDriver:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daynightae.driver
        PRODUCT_NAME: "DAY NIGHT Driver"
        INFOPLIST_FILE: Config/Driver-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: DriverAppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DRIVER"
    scheme:
      gatherCoverageData: false
      testTargets: []

  DayNightMerchant:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daynightae.merchant
        PRODUCT_NAME: "DAY NIGHT Merchant"
        INFOPLIST_FILE: Config/Merchant-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: MerchantAppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MERCHANT"
    scheme:
      gatherCoverageData: false
      testTargets: []
