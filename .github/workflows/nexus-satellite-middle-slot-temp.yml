name: NEXUS Satellite Middle Slot Temp

on:
  push:
    branches:
      - feature/nexus-earth-live-3d-20260816
    paths:
      - .github/workflows/nexus-satellite-middle-slot-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nexus-earth-live-3d-20260816
          fetch-depth: 0

      - name: Move satellite raster behind 3D objects but above base fills
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''                paint: {\n                  "raster-opacity": 0.94,\n                  "raster-saturation": 0.06,\n                  "raster-contrast": 0.05,\n                  "raster-brightness-max": 0.98,\n                },\n                slot: "bottom",'''
          new = '''                paint: {\n                  "raster-opacity": 0.88,\n                  "raster-saturation": 0.06,\n                  "raster-contrast": 0.05,\n                  "raster-brightness-max": 0.98,\n                },\n                // Standard middle slot keeps authored 3D buildings/landmarks above imagery.\n                slot: "middle",'''
          if old not in s:
              raise SystemExit('satellite bottom-slot contract not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'slot: "middle"' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          git diff --check

      - name: Commit satellite layer ordering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DAY NIGHT NEXUS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          git diff --cached --check
          git commit -m 'fix(nexus): surface satellite imagery beneath 3D buildings'
          git push origin HEAD:feature/nexus-earth-live-3d-20260816
