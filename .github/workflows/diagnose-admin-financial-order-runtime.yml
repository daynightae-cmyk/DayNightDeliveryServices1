name: Diagnose Admin Financial Order Runtime

on:
  push:
    branches:
      - fix/admin-financial-order-runtime-20260803
    paths:
      - ".github/workflows/diagnose-admin-financial-order-runtime.yml"

permissions:
  contents: read

jobs:
  reproduce-production-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Reproduce exact admin order payload and expose raw database error
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const required = [
            'VITE_SUPABASE_URL',
            'VITE_SUPABASE_ANON_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'RUNTIME_ADMIN_EMAIL',
            'RUNTIME_ADMIN_PASSWORD',
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing secret ${name}`);
          }

          const base = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const anon = process.env.VITE_SUPABASE_ANON_KEY;
          const service = process.env.SUPABASE_SERVICE_ROLE_KEY;

          async function jsonRequest(path, { method = 'GET', token = anon, key = anon, body, prefer } = {}) {
            const response = await fetch(`${base}${path}`, {
              method,
              headers: {
                apikey: key,
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(prefer ? { Prefer: prefer } : {}),
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            let value = text;
            try { value = text ? JSON.parse(text) : null; } catch {}
            return { ok: response.ok, status: response.status, value };
          }

          const login = await jsonRequest('/auth/v1/token?grant_type=password', {
            method: 'POST',
            body: {
              email: process.env.RUNTIME_ADMIN_EMAIL,
              password: process.env.RUNTIME_ADMIN_PASSWORD,
            },
          });
          if (!login.ok || !login.value?.access_token) {
            throw new Error(`Admin login failed: ${JSON.stringify(login.value)}`);
          }
          const access = login.value.access_token;

          const merchantsResponse = await jsonRequest(
            '/rest/v1/merchants?select=id,trade_name,owner_name,merchant_code,phone,emirate,city,address,pickup_address,status&limit=1000',
            { token: access },
          );
          if (!merchantsResponse.ok || !Array.isArray(merchantsResponse.value)) {
            throw new Error(`Merchant read failed: ${JSON.stringify(merchantsResponse.value)}`);
          }

          const normalize = (value) => String(value ?? '')
            .normalize('NFKD')
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/[أإآ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/[^\p{L}\p{N}]+/gu, '')
            .toLowerCase();

          const tokens = ['موزه', 'موزة', 'لين', 'اكواب', 'أكواب', 'رسي40', 'rsi40', 'rsky40'];
          const scored = merchantsResponse.value.map((merchant) => {
            const haystack = normalize([
              merchant.owner_name,
              merchant.trade_name,
              merchant.merchant_code,
            ].join(' '));
            const score = tokens.reduce((total, token) => total + (haystack.includes(normalize(token)) ? 1 : 0), 0);
            return { merchant, score };
          }).sort((a, b) => b.score - a.score);

          const selected = scored[0]?.merchant;
          console.log('TOP_MERCHANT_CANDIDATES', JSON.stringify(scored.slice(0, 8).map(({ merchant, score }) => ({
            score,
            id: merchant.id,
            owner_name: merchant.owner_name,
            trade_name: merchant.trade_name,
            merchant_code: merchant.merchant_code,
            status: merchant.status,
          })), null, 2));
          if (!selected || scored[0].score < 2) {
            throw new Error('Could not identify the merchant shown in the screenshot with sufficient confidence.');
          }

          const conflict = await jsonRequest('/rest/v1/rpc/admin_find_coupon_conflict', {
            method: 'POST',
            token: access,
            body: { p_coupon: '009050', p_exclude_order_id: null },
          });
          console.log('COUPON_009050_CONFLICT', JSON.stringify({ status: conflict.status, value: conflict.value }, null, 2));

          const resolution = await jsonRequest('/rest/v1/rpc/admin_resolve_order_merchant', {
            method: 'POST',
            token: access,
            body: { p_merchant_id: selected.id },
          });
          console.log('MERCHANT_RESOLUTION', JSON.stringify({ status: resolution.status, value: resolution.value }, null, 2));
          if (!resolution.ok) process.exitCode = 2;

          const now = new Date().toISOString();
          const suffix = Date.now().toString(36).toUpperCase();
          const tracking = `DN-DIAG-${suffix}`;
          const coupon = `DIAG-009050-${suffix}`;
          const senderCity = String(selected.emirate || 'Abu Dhabi').trim();
          const senderAddress = [selected.city, selected.pickup_address || selected.address || senderCity]
            .map((value) => String(value || '').trim())
            .filter(Boolean)
            .join(' - ');

          const payload = {
            tracking_number: tracking,
            tracking_code: tracking,
            invoice_number: tracking,
            coupon_number: coupon,
            merchant_id: selected.id,
            merchant_name: selected.trade_name,
            merchant_code: selected.merchant_code || '',
            order_count: 1,
            shipping_scope: 'international',
            destination_country: 'KW',
            source_channel: 'admin_financial_order',
            source_domain: 'daynightae.com',
            sender_name: selected.trade_name,
            sender_phone: String(selected.phone || '971568757331').trim(),
            sender_city: senderCity,
            sender_address: senderAddress,
            receiver_name: 'عميل',
            receiver_phone: '96562221989',
            receiver_city: 'KW',
            receiver_address: 'العدان',
            package_type: 'Shipment',
            package_description: 'Shipment',
            weight: 1,
            pieces: 1,
            service_type: 'international',
            payment_method: 'cod',
            cod_amount: 95,
            goods_value: 0,
            delivery_fee: 95,
            discount_amount: 0,
            delivery_fee_mode: 'customer_pays',
            customer_total: 95,
            merchant_due: 0,
            company_revenue: 95,
            collected_amount: 0,
            financial_version: 2,
            delivery_price: 95,
            base_price: 95,
            subtotal: 95,
            total: 95,
            total_price: 95,
            amount: 95,
            price: 95,
            manual_delivery_price: null,
            price_source: 'system',
            currency: 'AED',
            notes: 'Runtime diagnostic matching user screenshot',
            status: 'pending',
            status_history: [{ status: 'pending', date: now, created_at: now, note: 'Runtime diagnostic' }],
            created_at: now,
            updated_at: now,
          };

          const created = await jsonRequest('/rest/v1/rpc/admin_create_canonical_merchant_order', {
            method: 'POST',
            token: access,
            body: { p_order: payload },
          });
          console.log('CREATE_RESULT_RAW', JSON.stringify({ status: created.status, value: created.value }, null, 2));

          if (!created.ok) {
            throw new Error(`Exact production save failed: ${JSON.stringify(created.value)}`);
          }

          const row = Array.isArray(created.value) ? created.value[0] : created.value;
          const orderId = row?.id;
          if (!orderId) throw new Error('Save returned no order id.');

          for (const table of ['order_status_history']) {
            const cleanup = await jsonRequest(`/rest/v1/${table}?order_id=eq.${encodeURIComponent(orderId)}`, {
              method: 'DELETE',
              token: service,
              key: service,
              prefer: 'return=minimal',
            });
            console.log(`CLEANUP_${table}`, cleanup.status, JSON.stringify(cleanup.value));
          }
          const cleanupOrder = await jsonRequest(`/rest/v1/orders?id=eq.${encodeURIComponent(orderId)}`, {
            method: 'DELETE',
            token: service,
            key: service,
            prefer: 'return=minimal',
          });
          console.log('CLEANUP_ORDER', cleanupOrder.status, JSON.stringify(cleanupOrder.value));
          if (!cleanupOrder.ok) throw new Error(`Diagnostic order cleanup failed: ${JSON.stringify(cleanupOrder.value)}`);

          console.log('DIAGNOSTIC_SAVE_PASS_AND_CLEANED', orderId);
          NODE