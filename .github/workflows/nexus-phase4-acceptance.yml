name: NEXUS Phase 4 Launch Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nexus-phase4-acceptance.yml"
      - ".github/scripts/nexus-phase4-browser-acceptance.mjs"
      - "artifacts/day-night-delivery/src/components/admin/AdminNexusPhase4ServiceAssurance.tsx"
      - "artifacts/day-night-delivery/src/components/admin/AdminNexusEntry.tsx"
      - "artifacts/day-night-delivery/src/lib/nexusPhase4Engine.ts"
      - "artifacts/day-night-delivery/src/styles/dn-nexus-phase4.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-acceptance:
    name: NEXUS Phase 4 production and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-runtime-tests
    env:
      TEST_BASE_URL: http://127.0.0.1:4173
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify protected Admin runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript and exact production build
        shell: bash
        run: |
          set -euo pipefail
          pnpm run web:typecheck
          pnpm run web:build
          test -s artifacts/day-night-delivery/dist/public/index.html
          mkdir -p nexus-phase4-evidence
          nohup pnpm --dir artifacts/day-night-delivery exec vite preview --host 127.0.0.1 --port 4173 --strictPort > nexus-phase4-evidence/local-web.log 2>&1 &
          echo $! > nexus-phase4-evidence/local-web.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$TEST_BASE_URL/auth?nosplash=1" | grep -F 'id="root"' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat nexus-phase4-evidence/local-web.log >&2
          exit 1
      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          playwright_dir="$RUNNER_TEMP/daynight-nexus4-playwright"
          mkdir -p "$playwright_dir"
          cd "$playwright_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          echo "PLAYWRIGHT_NODE_PATH=$playwright_dir/node_modules" >> "$GITHUB_ENV"
      - name: Open NEXUS Phase 4 with protected Admin and verify real surfaces
        run: node .github/scripts/nexus-phase4-browser-acceptance.mjs
      - name: Stop local app
        if: always()
        shell: bash
        run: |
          if [ -f nexus-phase4-evidence/local-web.pid ]; then
            kill "$(cat nexus-phase4-evidence/local-web.pid)" 2>/dev/null || true
          fi
      - name: Upload NEXUS Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-NEXUS-Phase4-Evidence
          path: nexus-phase4-evidence/
          if-no-files-found: warn
          retention-days: 30