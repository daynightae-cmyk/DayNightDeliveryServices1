name: NEXUS Explicit 3D Buildings Temp

on:
  push:
    branches:
      - feature/nexus-earth-live-3d-20260816
    paths:
      - .github/workflows/nexus-explicit-3d-buildings-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nexus-earth-live-3d-20260816
          fetch-depth: 0

      - name: Add explicit real building-height extrusion over satellite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx')
          s = p.read_text(encoding='utf-8')
          anchor = '''          try {\n            localMap.addSource("dn-nexus-terrain", {\n              type: "raster-dem",\n              url: "mapbox://mapbox.mapbox-terrain-dem-v1",\n              tileSize: 512,\n              maxzoom: 14,\n            });\n            localMap.setTerrain({ source: "dn-nexus-terrain", exaggeration: 1.15 });\n          } catch {\n            // Terrain is visual only.\n          }\n\n          const topSlot = { slot: "top" } as any;'''
          replacement = '''          try {\n            localMap.addSource("dn-nexus-terrain", {\n              type: "raster-dem",\n              url: "mapbox://mapbox.mapbox-terrain-dem-v1",\n              tileSize: 512,\n              maxzoom: 14,\n            });\n            localMap.setTerrain({ source: "dn-nexus-terrain", exaggeration: 1.15 });\n          } catch {\n            // Terrain is visual only.\n          }\n\n          // Explicit real building-height geometry guarantees visible street-level volume\n          // over Standard Satellite even where the basemap's authored 3D treatment is subtle.\n          try {\n            localMap.addSource("dn-nexus-real-buildings", {\n              type: "vector",\n              url: "mapbox://mapbox.mapbox-streets-v8",\n            });\n            localMap.addLayer({\n              id: "dn-nexus-real-building-extrusions",\n              source: "dn-nexus-real-buildings",\n              "source-layer": "building",\n              type: "fill-extrusion",\n              minzoom: 14.25,\n              filter: ["==", ["get", "extrude"], "true"],\n              paint: {\n                "fill-extrusion-color": [\n                  "interpolate", ["linear"], ["coalesce", ["to-number", ["get", "height"]], 0],\n                  0, "#dbe5ed",\n                  80, "#cbd8e5",\n                  220, "#f0dca4",\n                ],\n                "fill-extrusion-height": [\n                  "interpolate", ["linear"], ["zoom"],\n                  14.25, 0,\n                  15.15, ["coalesce", ["to-number", ["get", "height"]], 8],\n                ],\n                "fill-extrusion-base": [\n                  "interpolate", ["linear"], ["zoom"],\n                  14.25, 0,\n                  15.15, ["coalesce", ["to-number", ["get", "min_height"]], 0],\n                ],\n                "fill-extrusion-opacity": 0.62,\n                "fill-extrusion-vertical-gradient": true,\n              },\n              slot: "middle",\n            } as any);\n          } catch (cause) {\n            console.warn("NEXUS explicit 3D building layer unavailable; Standard 3D remains active.", cause);\n          }\n\n          const topSlot = { slot: "top" } as any;'''
          if anchor not in s:
              raise SystemExit('terrain insertion anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'dn-nexus-real-building-extrusions' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q 'mapbox://mapbox.mapbox-streets-v8' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q '"fill-extrusion-height"' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          git diff --check

      - name: Commit 3D building layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DAY NIGHT NEXUS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          git diff --cached --check
          git commit -m 'feat(nexus): extrude real building heights over satellite'
          git push origin HEAD:feature/nexus-earth-live-3d-20260816
