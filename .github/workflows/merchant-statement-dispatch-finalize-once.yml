name: Merchant Statement Dispatch Finalize Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/merchant-statement-dispatch-finalize-once.yml"

permissions:
  contents: write

concurrency:
  group: merchant-statement-dispatch-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'daynightae-cmyk/DayNightDeliveryServices1' &&
      github.event.pull_request.head.ref == 'feat/merchant-statement-dispatch-tracking-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact WhatsApp handoff correction and remove one-time workflows
        shell: python
        run: |
          from pathlib import Path

          component_path = Path("artifacts/day-night-delivery/src/components/admin/AdminMerchantStatementsCenter.tsx")
          source = component_path.read_text(encoding="utf-8")

          old = '''    const message = merchantWhatsAppMessage(targetOrders);
              const opened = window.open(
                `https://wa.me/${merchantPhone}?text=${encodeURIComponent(message)}`,
                "_blank",
                "noopener,noreferrer",
              );
              if (!opened) {'''

          new = '''    const whatsappUrl = `https://wa.me/${merchantPhone}?text=${encodeURIComponent(merchantWhatsAppMessage(targetOrders))}`;
              const opened = window.open(whatsappUrl, "_blank");
              if (!opened) {'''

          if old not in source:
              raise SystemExit("Exact WhatsApp handoff source block was not found; refusing broad edit")

          source = source.replace(old, new, 1)

          old_tail = '''      return;
              }
              setPendingTransfer({ orders: targetOrders, resend, whatsappOpened: true });'''
          new_tail = '''      return;
              }
              try {
                opened.opener = null;
              } catch {
                // Cross-origin WindowProxy restrictions are harmless here.
              }
              setPendingTransfer({ orders: targetOrders, resend, whatsappOpened: true });'''

          if old_tail not in source:
              raise SystemExit("Exact WhatsApp success block was not found; refusing broad edit")

          source = source.replace(old_tail, new_tail, 1)
          component_path.write_text(source, encoding="utf-8")

          for workflow in (
              Path(".github/workflows/merchant-statement-dispatch-schema-once.yml"),
              Path(".github/workflows/merchant-statement-dispatch-finalize-once.yml"),
          ):
              if workflow.exists():
                  workflow.unlink()

      - name: Verify exact correction
        shell: bash
        run: |
          set -euo pipefail
          target="artifacts/day-night-delivery/src/components/admin/AdminMerchantStatementsCenter.tsx"
          grep -F 'const whatsappUrl = `https://wa.me/${merchantPhone}?text=${encodeURIComponent(merchantWhatsAppMessage(targetOrders))}`;' "$target" >/dev/null
          grep -F 'const opened = window.open(whatsappUrl, "_blank");' "$target" >/dev/null
          grep -F 'opened.opener = null;' "$target" >/dev/null
          ! grep -F '"noopener,noreferrer"' "$target" >/dev/null
          test ! -e .github/workflows/merchant-statement-dispatch-schema-once.yml
          test ! -e .github/workflows/merchant-statement-dispatch-finalize-once.yml

      - name: Commit finalized branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/day-night-delivery/src/components/admin/AdminMerchantStatementsCenter.tsx .github/workflows
          git diff --cached --check
          git commit -m "fix(admin): finalize protected merchant WhatsApp transfer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
