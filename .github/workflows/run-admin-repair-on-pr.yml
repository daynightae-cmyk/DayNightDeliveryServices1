name: Run protected admin repair from pull request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute protected repair script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-admin-native-route-repair.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          strict = """    if count != 1:\n        raise SystemExit(f'{label}: expected exactly one regex match, found {count}')\n    return next_text"""
          tolerant = """    if count != 1:\n        if label == 'remove command navigation injection' and count == 0:\n            return text\n        raise SystemExit(f'{label}: expected exactly one regex match, found {count}')\n    return next_text"""
          if strict not in script:
              raise SystemExit('Unable to patch repair strictness guard')
          script = script.replace(strict, tolerant, 1)
          Path('/tmp/day-night-repair.py').write_text(script, encoding='utf-8')
          PY

          set +e
          python3 /tmp/day-night-repair.py > /tmp/day-night-repair.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            cat /tmp/day-night-repair.log
            cp /tmp/day-night-repair.log repair-error.txt
            git config user.name "DAY NIGHT Production Repair"
            git config user.email "daynight.ae@gmail.com"
            git add repair-error.txt
            git commit -m "Record protected repair failure"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('artifacts/day-night-delivery/src/components/admin/AdminCustomerExperienceLauncher.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''
            document.querySelectorAll<HTMLElement>(".dncc-navigation").forEach((root, index) => {
              const host = ensureCommandTarget(root, index);
              targets.push({ element: host, surface: "command" });
            });
          '''
          if old in text:
              text = text.replace(old, '\n', 1)
          elif 'querySelectorAll<HTMLElement>(".dncc-navigation")' in text:
              raise SystemExit('Unexpected command navigation injection markup')
          path.write_text(text, encoding='utf-8')
          PY

          rm -f repair-error.txt
          rm -f .github/workflows/apply-admin-native-route-repair.yml
          rm -f .github/workflows/run-admin-repair-on-pr.yml
          git config user.name "DAY NIGHT Production Repair"
          git config user.email "daynight.ae@gmail.com"
          git add -A
          git commit -m "Fix admin routes, native Message Center, and driver action templates"
          git push origin HEAD:${{ github.head_ref }}
