name: Final Arabic Money Direction

on:
  push:
    branches:
      - final/admin-order-lifecycle-ux-20260804
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: final-arabic-money-direction-20260804
  cancel-in-progress: true

jobs:
  polish-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/admin-order-lifecycle-ux-20260804
          fetch-depth: 0

      - name: Apply final Arabic currency polish
        run: python .github/scripts/apply-arabic-money-direction-final.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Arabic currency presentation
        shell: bash
        run: |
          set -euo pipefail
          panel="artifacts/day-night-delivery/src/components/AdminPanelLuxury.tsx"
          new_order="artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx"
          editor="artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx"
          bulk="artifacts/day-night-delivery/src/components/admin/AdminOrderBulkOperations.tsx"
          grep -F 'bodyAr: `يوجد تحصيل معلق بقيمة ${money(Number(financeSummary.cod_pending || 0), true)}.`' "$panel"
          grep -F 'dir={isArabic ? "rtl" : "ltr"}' "$new_order"
          grep -F 'dir={isArabic ? "rtl" : "ltr"}' "$editor"
          grep -F '<td dir="${isArabic ? "rtl" : "ltr"}">${escapeHtml(formatAdminMoney(order.cod_amount, isArabic))}</td>' "$bulk"
          echo "Arabic currency presentation contract passed."

      - name: Final order lifecycle gate
        run: pnpm --dir artifacts/day-night-delivery run admin-order-lifecycle:gate

      - name: Typecheck application
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Build production application
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Commit verified implementation only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-arabic-money-direction-final.py
          rm -f .github/workflows/final-arabic-money-direction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes produced." >&2; exit 1; }
          git commit -m "fix(admin): polish Arabic currency direction and labels"
          git push origin HEAD:final/admin-order-lifecycle-ux-20260804
