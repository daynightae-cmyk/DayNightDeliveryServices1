name: Destination Address Area Fix

on:
  push:
    branches:
      - fix/destination-location-display
    paths:
      - .github/workflows/destination-address-area-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/destination-location-display
          fetch-depth: 0

      - name: Patch address-only legacy orders into the central formatter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          export_path = Path('artifacts/day-night-delivery/src/lib/exportLocalization.ts')
          content = export_path.read_text(encoding='utf-8')

          old_import = 'import { areEquivalentLocations, formatDestinationLocation, inferDestinationEmirate } from "./destinationLocation";'
          new_import = 'import { areEquivalentLocations, extractDestinationAreaFromAddress, formatDestinationLocation, inferDestinationEmirate } from "./destinationLocation";'
          if content.count(old_import) != 1:
              raise SystemExit(f'export import expected once, found {content.count(old_import)}')
          content = content.replace(old_import, new_import, 1)

          old_function = '''export function localizedOrderDestinationArea(order: Order, language: ExportDocumentLanguage) {
            const record = order as FlexibleOrder;
            const explicitArea = optionalLocalizedPart(
              record,
              language,
              ["receiver_area_ar", "delivery_area_ar"],
              ["receiver_area", "delivery_area"],
            );
            if (explicitArea) return explicitArea;

            const city = optionalLocalizedPart(
              record,
              language,
              ["receiver_city_ar", "delivery_city_ar"],
              ["receiver_city", "delivery_city"],
            );
            const emirate = localizedOrderDestinationEmirate(order, language);
            return city && !areEquivalentLocations(city, emirate) ? city : "";
          }
          '''
          new_function = '''export function localizedOrderDestinationArea(order: Order, language: ExportDocumentLanguage) {
            const record = order as FlexibleOrder;
            const explicitArea = optionalLocalizedPart(
              record,
              language,
              ["receiver_area_ar", "delivery_area_ar"],
              ["receiver_area", "delivery_area"],
            );
            if (explicitArea) return explicitArea;

            const city = optionalLocalizedPart(
              record,
              language,
              ["receiver_city_ar", "delivery_city_ar"],
              ["receiver_city", "delivery_city"],
            );
            const emirate = localizedOrderDestinationEmirate(order, language);
            const address = optionalLocalizedPart(
              record,
              language,
              ["receiver_address_ar", "delivery_address_ar"],
              ["receiver_address", "delivery_address"],
            );
            const addressArea = extractDestinationAreaFromAddress(address, emirate, city);
            if (addressArea) return language === "ar" ? localizeExportText(addressArea, language) : addressArea;
            return city && !areEquivalentLocations(city, emirate) ? city : "";
          }
          '''
          if content.count(old_function) != 1:
              raise SystemExit(f'destination area function expected once, found {content.count(old_function)}')
          export_path.write_text(content.replace(old_function, new_function, 1), encoding='utf-8')

          test_path = Path('artifacts/day-night-delivery/scripts/destination-location-tests.mjs')
          tests = test_path.read_text(encoding='utf-8')
          old_destructure = '''    areEquivalentLocations,
              formatDestinationLocation,
              inferDestinationEmirate,
          } = await import'''
          new_destructure = '''    areEquivalentLocations,
              extractDestinationAreaFromAddress,
              formatDestinationLocation,
              inferDestinationEmirate,
          } = await import'''
          if tests.count(old_destructure) != 1:
              raise SystemExit(f'test destructure expected once, found {tests.count(old_destructure)}')
          tests = tests.replace(old_destructure, new_destructure, 1)

          old_assertions = '''  assert.equal(inferDestinationEmirate("Al Ain", "ar"), "أبوظبي");
            assert.equal(inferDestinationEmirate("Al Barsha", "en"), "Dubai");

            console.log(`PASS destination location formatter (${cases.length + 4} assertions)`);'''
          new_assertions = '''  assert.equal(inferDestinationEmirate("Al Ain", "ar"), "أبوظبي");
            assert.equal(inferDestinationEmirate("Al Barsha", "en"), "Dubai");
            assert.equal(
              extractDestinationAreaFromAddress(
                "Al Shahama - Street 7 - Abu Dhabi",
                "Abu Dhabi",
                "Abu Dhabi",
              ),
              "Al Shahama",
            );
            assert.equal(
              extractDestinationAreaFromAddress("الشامخة، شارع 7، أبوظبي", "أبوظبي", "أبوظبي"),
              "الشامخة",
            );

            console.log(`PASS destination location formatter (${cases.length + 6} assertions)`);'''
          if tests.count(old_assertions) != 1:
              raise SystemExit(f'test assertions expected once, found {tests.count(old_assertions)}')
          test_path.write_text(tests.replace(old_assertions, new_assertions, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run destination formatter tests
        working-directory: artifacts/day-night-delivery
        run: pnpm destination-location:test

      - name: TypeScript check
        working-directory: artifacts/day-night-delivery
        run: pnpm typecheck

      - name: Export language policy gate
        working-directory: artifacts/day-night-delivery
        run: pnpm export-language:gate

      - name: Complete production gate
        working-directory: artifacts/day-night-delivery
        run: pnpm production:gate

      - name: Production build
        working-directory: artifacts/day-night-delivery
        run: pnpm build

      - name: Remove temporary workflow and generated assets
        shell: bash
        run: |
          rm -f .github/workflows/destination-address-area-fix.yml
          rm -f \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/admin-dashboard-reference.png \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/admin-map.png \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/intro-gateway.png \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/khalifa-card-reference.png \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/loading-command-center.png \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/login-extra-reference.png \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/login-reference.png \
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/logo-glass.png \
            artifacts/day-night-delivery/public/assets/daynight/merchant-statement-logo.png

      - name: Publish validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(i18n): recover destination areas from stored addresses"
          git push origin HEAD:fix/destination-location-display
