name: One-time Customer E2E Coupon Patch

on:
  push:
    branches: [fix/global-order-merchant-restoration-20260802-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add required coupon to runtime order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/day-night-delivery/scripts/customer-experience-runtime-e2e.mjs')
          s = p.read_text()
          marker = '      coupon_number: runId,\n      merchant_reference: runId,'
          if marker not in s:
              old = '      merchant_reference: runId,'
              if s.count(old) != 1:
                  raise SystemExit(f'expected one marker, found {s.count(old)}')
              s = s.replace(old, marker)
              p.write_text(s)
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo 'Coupon patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/day-night-delivery/scripts/customer-experience-runtime-e2e.mjs
          git commit -m 'test(cx): provide required coupon for runtime order'
          git push origin HEAD:${GITHUB_REF_NAME}
