name: Production Gate

on:
  push:
    branches:
      - main
      - fix/order-save-bulk-export-personal-orders
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-repair:
    name: Apply order controls and personal orders repair
    if: github.event_name == 'push' && github.ref_name == 'fix/order-save-bulk-export-personal-orders' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/order-save-bulk-export-personal-orders
          fetch-depth: 0

      - name: Execute protected repair and push real files
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/apply-personal-orders-admin-repair.yml
          if [ ! -f "$workflow" ]; then
            echo "Repair source already consumed."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-personal-orders-admin-repair.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/day-night-personal-orders-repair.py').write_text(script, encoding='utf-8')
          PY

          python3 /tmp/day-night-personal-orders-repair.py
          rm -f artifacts/day-night-delivery/public/personal-orders-repair-trigger.txt
          git checkout origin/main -- .github/workflows/production-gate.yml
          git config user.name "DAY NIGHT Production Repair"
          git config user.email "daynight.ae@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "Fix order editing, bulk export, and personal orders"
          git push origin HEAD:fix/order-save-bulk-export-personal-orders

  day-night-web:
    name: DAY NIGHT web validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee pnpm-install.log

      - name: Upload pnpm install diagnostics
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-diagnostic
          path: pnpm-install.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when dependency installation failed
        if: steps.install.outcome == 'failure'
        shell: bash
        run: |
          echo "pnpm installation failed. Last 140 log lines:"
          tail -n 140 pnpm-install.log
          exit 1

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run web:typecheck 2>&1 | tee typescript-check.log

      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-check-diagnostic
          path: typescript-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when TypeScript validation failed
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: |
          echo "TypeScript validation failed. Last 180 log lines:"
          tail -n 180 typescript-check.log
          exit 1

      - name: Production hardening gate
        id: production_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run web:gate 2>&1 | tee production-gate.log

      - name: Upload production gate diagnostics
        if: steps.production_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-diagnostic
          path: production-gate.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when production gate failed
        if: steps.production_gate.outcome == 'failure'
        shell: bash
        run: |
          echo "Production gate failed. Last 220 log lines:"
          tail -n 220 production-gate.log
          exit 1

      - name: Build production app
        run: pnpm run web:build
