name: Production Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: production-gate-vite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-repair:
    name: Align Vite order editor transform
    if: github.head_ref == 'fix/order-save-bulk-export-personal-orders' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch Vite transform and prepaid edit support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          vite_path = Path('artifacts/day-night-delivery/vite.config.ts')
          text = vite_path.read_text(encoding='utf-8')

          old_price = "        code = replaceRequired(\n          code,\n          '    price_mode: manual ? \"manual\" : \"system\",',\n          '    price_mode: manual && !(finance.goodsValue === 0 && currentPrice <= 0) ? \"manual\" : \"system\",',\n          \"edit form rejects zero manual delivery pricing\",\n        );"
          new_price = "        if (code.includes('    price_mode: personal ? \"system\" : manual ? \"manual\" : \"system\",')) {\n          code = replaceRequired(\n            code,\n            '    price_mode: personal ? \"system\" : manual ? \"manual\" : \"system\",',\n            '    price_mode: personal ? \"system\" : manual && !(finance.goodsValue === 0 && currentPrice <= 0) ? \"manual\" : \"system\",',\n            \"edit personal order form rejects zero manual delivery pricing\",\n          );\n        } else {\n          code = replaceRequired(\n            code,\n            '    price_mode: manual ? \"manual\" : \"system\",',\n            '    price_mode: manual && !(finance.goodsValue === 0 && currentPrice <= 0) ? \"manual\" : \"system\",',\n            \"edit form rejects zero manual delivery pricing\",\n          );\n        }"
          if old_price not in text:
              raise SystemExit('Vite price transform contract not found')
          text = text.replace(old_price, new_price, 1)

          old_ar = "        code = replaceRequired(\n          code,\n          '                    ? \"تحديث الطلب الآن\"',\n          '                    ? \"حفظ التحديث الآن\"',\n          \"Arabic update button label\",\n        );"
          new_ar = "        if (!code.includes('? \"حفظ التعديلات الآن\"')) {\n          code = replaceRequired(\n            code,\n            '                    ? \"تحديث الطلب الآن\"',\n            '                    ? \"حفظ التحديث الآن\"',\n            \"Arabic update button label\",\n          );\n        }"
          if old_ar not in text:
              raise SystemExit('Vite Arabic button transform contract not found')
          text = text.replace(old_ar, new_ar, 1)

          old_en = "        code = replaceRequired(\n          code,\n          '                    : \"Update order now\"}',\n          '                    : \"Save order updates\"}',\n          \"English update button label\",\n        );"
          new_en = "        if (!code.includes(': \"Save changes now\"}')) {\n          code = replaceRequired(\n            code,\n            '                    : \"Update order now\"}',\n            '                    : \"Save order updates\"}',\n            \"English update button label\",\n          );\n        }"
          if old_en not in text:
              raise SystemExit('Vite English button transform contract not found')
          text = text.replace(old_en, new_en, 1)
          vite_path.write_text(text, encoding='utf-8')

          persistence_path = Path('artifacts/day-night-delivery/src/lib/adminOrderEditPersistence.ts')
          persistence = persistence_path.read_text(encoding='utf-8')
          old_payment = '  if (["sender_pays", "receiver_pays", "cod"].includes(normalized)) return normalized;'
          new_payment = '  if (["sender_pays", "receiver_pays", "cod", "prepaid"].includes(normalized)) return normalized;'
          if old_payment not in persistence:
              raise SystemExit('Edit persistence payment normalization contract not found')
          persistence_path.write_text(persistence.replace(old_payment, new_payment, 1), encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/production-gate.yml
          git config user.name "DAY NIGHT Production Repair"
          git config user.email "daynight.ae@gmail.com"
          git add -A
          git commit -m "Align Vite order editor transform with personal orders"
          git push origin HEAD:${{ github.head_ref }}
