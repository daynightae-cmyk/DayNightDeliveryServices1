name: Finalize Admin Order CRUD v3

on:
  push:
    branches:
      - fix/admin-order-crud-v3-nonblocking-20260804
    paths:
      - ".github/scripts/finalize-admin-order-crud-v3.mjs"
      - ".github/scripts/patch-admin-order-crud-finalizer.mjs"
      - ".github/scripts/finalize-admin-order-create-v3.mjs"
      - ".github/scripts/finalize-admin-order-create-v3-ui.mjs"
      - ".github/scripts/patch-admin-order-create-v3-ui.mjs"
      - ".github/workflows/diagnose-admin-order-crud-v3.yml"
      - "supabase/migrations/20260804211500_admin_order_crud_v3_nonblocking.sql"
      - "artifacts/day-night-delivery/scripts/merchant-statement-order-edit-gate.mjs"
      - "artifacts/day-night-delivery/scripts/personal-orders-admin-gate.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/finalize-admin-order-crud-v3.mjs"
      - ".github/scripts/patch-admin-order-crud-finalizer.mjs"
      - ".github/scripts/finalize-admin-order-create-v3.mjs"
      - ".github/scripts/finalize-admin-order-create-v3-ui.mjs"
      - ".github/scripts/patch-admin-order-create-v3-ui.mjs"
      - ".github/workflows/diagnose-admin-order-crud-v3.yml"
      - "supabase/migrations/20260804211500_admin_order_crud_v3_nonblocking.sql"
      - "artifacts/day-night-delivery/scripts/merchant-statement-order-edit-gate.mjs"
      - "artifacts/day-night-delivery/scripts/personal-orders-admin-gate.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-admin-order-crud-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-order-crud-v3-nonblocking-20260804
          fetch-depth: 0

      - name: Patch generated update finalizer
        run: node .github/scripts/patch-admin-order-crud-finalizer.mjs

      - name: Apply canonical update CRUD v3
        run: node .github/scripts/finalize-admin-order-crud-v3.mjs

      - name: Apply canonical create CRUD v3 backend
        run: node .github/scripts/finalize-admin-order-create-v3.mjs

      - name: Patch canonical create UI finalizer
        run: node .github/scripts/patch-admin-order-create-v3-ui.mjs

      - name: Apply canonical create CRUD v3 UI and gates
        run: node .github/scripts/finalize-admin-order-create-v3-ui.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonical Admin update CRUD v3 gate
        working-directory: artifacts/day-night-delivery
        run: pnpm run test:admin-order-crud-v3

      - name: Canonical Admin create CRUD v3 gate
        working-directory: artifacts/day-night-delivery
        run: pnpm run test:admin-order-create-v3

      - name: Final order lifecycle gate
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-order-lifecycle-final-gate.mjs

      - name: Complete order editor gate
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-complete-order-edit-gate.mjs

      - name: Operations order-control gate
        working-directory: artifacts/day-night-delivery
        run: node scripts/operations-order-control-gate.mjs

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run web:typecheck > /tmp/typecheck.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "=== TYPECHECK FAILURE SUMMARY ==="
              grep -nE "error TS|Error:|ERR_|failed" /tmp/typecheck.log | tail -n 250 || true
              echo "=== TYPECHECK LOG TAIL ==="
              tail -n 300 /tmp/typecheck.log
            } > .github/admin-order-crud-v3-typecheck-summary.log
          fi
          cat /tmp/typecheck.log
          exit "$status"

      - name: Preserve focused TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/admin-order-crud-v3-typecheck-summary.log
          git commit -m "ci(admin): capture CRUD v3 typecheck diagnostics"
          git push origin HEAD:fix/admin-order-crud-v3-nonblocking-20260804
          exit 1

      - name: Full production gate
        id: production_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run web:gate > /tmp/production-gate.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "=== PRODUCTION GATE FAILURE SUMMARY ==="
              grep -nE "FAIL|failed|Error:|ERR_|gate_failed|assert" /tmp/production-gate.log | tail -n 300 || true
              echo "=== PRODUCTION GATE LOG TAIL ==="
              tail -n 350 /tmp/production-gate.log
            } > .github/admin-order-crud-v3-production-gate-summary.log
          fi
          cat /tmp/production-gate.log
          exit "$status"

      - name: Preserve focused production-gate diagnostics
        if: steps.production_gate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/admin-order-crud-v3-production-gate-summary.log
          git commit -m "ci(admin): capture CRUD v3 production-gate diagnostics"
          git push origin HEAD:fix/admin-order-crud-v3-nonblocking-20260804
          exit 1

      - name: Production build
        run: pnpm run web:build

      - name: Commit verified implementation and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT CI"
          git config user.email "actions@users.noreply.github.com"

          git rm .github/scripts/finalize-admin-order-crud-v3.mjs
          git rm .github/scripts/patch-admin-order-crud-finalizer.mjs
          git rm .github/scripts/finalize-admin-order-create-v3.mjs
          git rm .github/scripts/finalize-admin-order-create-v3-ui.mjs
          git rm .github/scripts/patch-admin-order-create-v3-ui.mjs
          git rm .github/workflows/diagnose-admin-order-crud-v3.yml
          git rm -f .github/admin-order-crud-v3-typecheck-summary.log || true
          git rm -f .github/admin-order-crud-v3-production-gate-summary.log || true

          git add \
            supabase/migrations/20260804211500_admin_order_crud_v3_nonblocking.sql \
            artifacts/day-night-delivery/package.json \
            artifacts/day-night-delivery/scripts/admin-order-crud-v3-gate.mjs \
            artifacts/day-night-delivery/scripts/admin-order-create-v3-gate.mjs \
            artifacts/day-night-delivery/scripts/admin-order-save-localization-gate.mjs \
            artifacts/day-night-delivery/scripts/admin-order-lifecycle-final-gate.mjs \
            artifacts/day-night-delivery/scripts/admin-complete-order-edit-gate.mjs \
            artifacts/day-night-delivery/scripts/operations-order-control-gate.mjs \
            artifacts/day-night-delivery/scripts/merchant-statement-order-edit-gate.mjs \
            artifacts/day-night-delivery/scripts/personal-orders-admin-gate.mjs \
            artifacts/day-night-delivery/scripts/production-core-rescue-gate.mjs \
            artifacts/day-night-delivery/src/lib/adminOrderMutations.ts \
            artifacts/day-night-delivery/src/lib/adminOrderEditPersistence.ts \
            artifacts/day-night-delivery/src/lib/adminOrderDeleteData.ts \
            artifacts/day-night-delivery/src/lib/adminOperationsData.ts \
            artifacts/day-night-delivery/src/lib/orderFinancialOperations.ts \
            artifacts/day-night-delivery/src/lib/personalOrderOperations.ts \
            artifacts/day-night-delivery/src/supabaseAdminOps.ts \
            artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx \
            artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx \
            artifacts/day-night-delivery/src/components/admin/AdminNewOrderFlexible.tsx \
            artifacts/day-night-delivery/src/components/admin/AdminPersonalOrderForm.tsx

          git diff --cached --check
          git commit -m "fix(admin): make canonical order CRUD non-blocking"
          git push origin HEAD:fix/admin-order-crud-v3-nonblocking-20260804
