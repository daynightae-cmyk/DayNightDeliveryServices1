name: Polish Order Edit Card

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: polish-order-edit-card-20260804-pr
  cancel-in-progress: true

jobs:
  polish-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delivered-order-core-save-20260804
          fetch-depth: 0

      - name: Apply polished editor and diagnostics
        run: python .github/scripts/apply-order-edit-card-diagnostics.py

      - name: Repair complete-order gate compatibility
        run: python .github/scripts/apply-admin-complete-order-gate-v2-fix.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify professional editor contract
        shell: bash
        run: |
          set -euo pipefail
          modal="artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx"
          gate="artifacts/day-night-delivery/scripts/admin-complete-order-edit-gate.mjs"
          grep -F 'data-admin-order-error-card="true"' "$modal"
          grep -F 'data-admin-error-reference="true"' "$modal"
          grep -F 'safeEditDiagnostic' "$modal"
          grep -F 'editErrorReference' "$modal"
          grep -F '23514|check constraint' "$modal"
          grep -F '40001|40p01' "$modal"
          grep -F 'عرض السبب التشخيصي الدقيق' "$modal"
          grep -F 'rounded-[2rem]' "$modal"
          grep -F 'admin_update_order_complete_verified(?:_v2)?' "$gate"
          echo "Professional order editor contract passed."

      - name: Verify complete-order contract
        run: pnpm --dir artifacts/day-night-delivery exec node scripts/admin-complete-order-edit-gate.mjs

      - name: Typecheck application
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Build production application
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Commit verified implementation only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/order-editor-finalizer-trigger.txt
          rm -f .github/scripts/apply-order-edit-card-diagnostics.py
          rm -f .github/scripts/apply-admin-complete-order-gate-v2-fix.py
          rm -f .github/workflows/polish-order-edit-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes produced." >&2; exit 1; }
          git commit -m "feat(admin): polish order editor and expose exact save diagnostics"
          git push origin HEAD:fix/delivered-order-core-save-20260804
