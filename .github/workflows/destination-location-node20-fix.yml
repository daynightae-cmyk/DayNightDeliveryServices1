name: Destination Location Node 20 Fix

on:
  push:
    branches:
      - fix/destination-location-display
    paths:
      - .github/workflows/destination-location-node20-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/destination-location-display
          fetch-depth: 0

      - name: Use Node 20 compatible destination tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/day-night-delivery/package.json')
          content = path.read_text(encoding='utf-8')
          old = 'node --experimental-strip-types scripts/destination-location-tests.ts'
          count = content.count(old)
          if count != 2:
              raise SystemExit(f'expected two old test commands, found {count}')
          path.write_text(content.replace(old, 'node scripts/destination-location-tests.mjs'), encoding='utf-8')
          PY
          rm -f .github/workflows/destination-location-node20-fix.yml

      - name: Commit Node 20 compatible tests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): run destination tests on Node 20"
          git push origin HEAD:fix/destination-location-display
