name: Admin Order History Compatibility Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-order-history-compat-production.yml"
      - "supabase/migrations/20260804213500_order_status_history_v3_compat.sql"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: admin-order-history-compat-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply exact history compatibility migration
        shell: bash
        run: |
          set -euo pipefail
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"
          target="20260804213500_order_status_history_v3_compat.sql"
          release_dir="$RUNNER_TEMP/daynight-order-history-compat"
          mkdir -p "$release_dir/supabase/migrations"
          cp supabase/config.toml "$release_dir/supabase/config.toml"
          supabase --workdir "$release_dir" link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$release_dir" migration fetch --linked
          if [ ! -f "$release_dir/supabase/migrations/$target" ]; then
            cp "supabase/migrations/$target" "$release_dir/supabase/migrations/$target"
            supabase --workdir "$release_dir" db push --dry-run
            supabase --workdir "$release_dir" db push --yes
          fi
          supabase --workdir "$release_dir" migration list --linked | grep -F "20260804213500"
      - name: Publish deployment result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/344/comments" -f body="### ✅ Production order history compatibility deployed\n\nMigration \`20260804213500\` is recorded on production. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Publish deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/344/comments" -f body="### ❌ Production order history compatibility deployment failed\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
