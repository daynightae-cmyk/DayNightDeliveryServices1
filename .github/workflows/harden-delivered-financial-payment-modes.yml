name: Harden Delivered Financial Payment Modes

on:
  push:
    branches:
      - fix/audited-delivered-order-financial-edit
    paths:
      - .github/workflows/harden-delivered-financial-payment-modes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audited-delivered-order-financial-edit
          fetch-depth: 0
      - name: Align payment modes with production orders contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing {label} in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched: {label}")

          service = "artifacts/day-night-delivery/src/lib/adminDeliveredFinancialAdjustment.ts"
          replace(
              service,
              '''  if (raw === "merchant_pays") return "sender_pays";\n  if (["cod", "receiver_pays", "sender_pays", "prepaid", "cash", "card", "bank_transfer"].includes(raw)) {\n    return raw;\n  }''',
              '''  if (raw === "merchant_pays") return "sender_pays";\n  if (raw === "cash") return "cod";\n  if (raw === "card" || raw === "bank_transfer") return "prepaid";\n  if (["cod", "receiver_pays", "sender_pays", "prepaid"].includes(raw)) {\n    return raw;\n  }''',
              "frontend payment normalization",
          )

          panel = "artifacts/day-night-delivery/src/components/admin/AdminDeliveredFinancialAdjustment.tsx"
          replace(
              panel,
              '''                <option value="merchant_pays">{isArabic ? "على حساب التاجر" : "Merchant account"}</option>\n                <option value="bank_transfer">{isArabic ? "تحويل بنكي" : "Bank transfer"}</option>\n                <option value="card">{isArabic ? "بطاقة" : "Card"}</option>''',
              '''                <option value="merchant_pays">{isArabic ? "على حساب التاجر" : "Merchant account"}</option>\n                <option value="prepaid">{isArabic ? "مدفوع مسبقًا" : "Prepaid"}</option>''',
              "supported payment choices",
          )

          migration = "supabase/migrations/20260728233000_admin_delivered_financial_adjustment.sql"
          replace(
              migration,
              '''  if v_payment = 'merchant_pays' then\n    v_payment := 'sender_pays';\n  end if;\n  if v_payment not in ('cod', 'receiver_pays', 'sender_pays', 'prepaid', 'cash', 'card', 'bank_transfer') then\n    raise exception 'invalid_payment_method: %', v_payment;\n  end if;''',
              '''  if v_payment = 'merchant_pays' then\n    v_payment := 'sender_pays';\n  elsif v_payment = 'cash' then\n    v_payment := 'cod';\n  elsif v_payment in ('card', 'bank_transfer') then\n    v_payment := 'prepaid';\n  end if;\n  if v_payment not in ('cod', 'receiver_pays', 'sender_pays', 'prepaid') then\n    raise exception 'invalid_payment_method: %', v_payment;\n  end if;''',
              "database payment normalization",
          )
          replace(
              migration,
              '''  v_cod_amount := case when v_payment in ('cod', 'cash') then v_customer_total else 0 end;''',
              '''  v_cod_amount := case when v_payment = 'cod' then v_customer_total else 0 end;''',
              "COD calculation",
          )

          Path(".github/workflows/harden-delivered-financial-payment-modes.yml").unlink()
          PY
      - name: Commit hardened payment contract
        shell: bash
        run: |
          git config user.name "DAY NIGHT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align audited adjustment payment modes with production"
          git push origin HEAD:fix/audited-delivered-order-financial-edit
