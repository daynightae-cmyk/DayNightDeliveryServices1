name: Repair Admin All Orders Complete Dataset

on:
  push:
    branches:
      - fix/admin-all-orders-complete-dataset-20260806
    paths:
      - scripts/repair-admin-all-orders-complete-dataset.mjs
      - .github/workflows/repair-admin-all-orders-complete-dataset.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-admin-all-orders-complete-dataset
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-all-orders-complete-dataset-20260806
          fetch-depth: 0

      - name: Configure Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact source repair
        run: node scripts/repair-admin-all-orders-complete-dataset.mjs

      - name: Validate TypeScript
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Build production application
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspace.tsx artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspaceCompleteLegacy.tsx; then
            echo "Source already repaired; no commit required."
            exit 0
          fi
          git config user.name "day-night-ci"
          git config user.email "day-night-ci@users.noreply.github.com"
          git add artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspace.tsx
          git add artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspaceCompleteLegacy.tsx
          git commit -m "fix(admin): show complete All Orders dataset totals"
          git push origin HEAD:fix/admin-all-orders-complete-dataset-20260806
