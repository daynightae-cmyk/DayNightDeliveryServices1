name: Fix Admin Order Runtime Classification

on:
  push:
    branches:
      - fix/admin-order-edit-error-classification-20260804

permissions:
  contents: write

concurrency:
  group: fix-admin-order-runtime-classification-20260804
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-order-edit-error-classification-20260804
          fetch-depth: 0

      - name: Apply precise classification repair
        run: python .github/scripts/apply-admin-order-error-classification-fix.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate classification contract
        shell: bash
        run: |
          set -euo pipefail
          target="artifacts/day-night-delivery/src/lib/adminOrderEditPersistence.ts"
          editor="artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx"
          grep -F 'function isMissingRpcRuntime' "$target"
          grep -F 'code === "PGRST202" || code === "42883"' "$target"
          grep -F 'detail.includes(`could not find the function ${bare}`)' "$target"
          ! grep -F 'return /admin_update_order_complete_verified|pgrst202' "$target"
          ! grep -F '/pgrst202|schema cache|could not find the function|runtime_missing|does not exist/' "$editor"
          echo "Precise runtime classification contract passed."

      - name: Typecheck application
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Build production application
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Verify real production edits with rollback
        run: node .github/scripts/admin-complete-order-real-edit-production-probe.mjs

      - name: Commit verified implementation only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-admin-order-error-classification-fix.py
          rm -f .github/workflows/fix-admin-order-runtime-classification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes produced." >&2; exit 1; }
          git commit -m "fix(admin): stop misreporting order save failures as missing migrations"
          git push origin HEAD:fix/admin-order-edit-error-classification-20260804
