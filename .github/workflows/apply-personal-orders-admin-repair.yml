name: Apply personal orders and admin order controls repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact production changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          app = root / 'artifacts/day-night-delivery'

          def read(rel):
              return (root / rel).read_text(encoding='utf-8')

          def write(rel, content):
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=0):
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return next_text

          # Order model and input contract.
          path = 'artifacts/day-night-delivery/src/types.ts'
          text = read(path)
          text = replace_once(
              text,
              '  source_channel?: string;\n  sender_name: string;',
              '  source_channel?: string;\n  source_domain?: string;\n  order_type?: string;\n  order_kind?: string;\n  sender_name: string;',
              'extend order personal markers',
          )
          write(path, text)

          path = 'artifacts/day-night-delivery/src/lib/adminOperationsData.ts'
          text = read(path)
          text = replace_once(
              text,
              '  merchant_code?: string;\n  coupon_number?: string;',
              '  merchant_code?: string;\n  sender_name?: string;\n  sender_phone?: string;\n  coupon_number?: string;',
              'extend admin order sender fields',
          )
          write(path, text)

          # Personal order detection and section filtering.
          path = 'artifacts/day-night-delivery/src/lib/adminOrderLogic.ts'
          text = read(path)
          text = replace_once(
              text,
              '  | "all_orders"\n  | "cancelled"',
              '  | "all_orders"\n  | "personal_orders"\n  | "cancelled"',
              'personal order bucket type',
          )
          marker = 'export function isInternationalAdminOrder(order: Order) {'
          helper = r'''export function isPersonalAdminOrder(order: Order) {
  const o = order as OrderLike;
  const source = normalizeAdminKey(o.source_channel);
  const orderType = normalizeAdminKey(o.order_type || o.order_kind);
  return (
    source === "admin_personal_order" ||
    source === "personal_order" ||
    orderType === "personal" ||
    orderType === "personal_order"
  );
}

'''
          text = replace_once(text, marker, helper + marker, 'insert personal order detector')
          text = replace_once(
              text,
              '  if (["all_orders", "reports", "print"].includes(sectionId)) return true;\n  const status = normalizeOrderStatus(order);',
              '  if (["all_orders", "reports", "print"].includes(sectionId)) return true;\n  if (sectionId === "personal_orders") return isPersonalAdminOrder(order);\n  const status = normalizeOrderStatus(order);',
              'filter personal order section',
          )
          text = replace_once(
              text,
              '    all_orders: orders.length,\n    cancelled:',
              '    all_orders: orders.length,\n    personal_orders: orders.filter((order) => isPersonalAdminOrder(order)).length,\n    cancelled:',
              'personal order stats',
          )
          write(path, text)

          # Registry and both admin navigation layers.
          path = 'artifacts/day-night-delivery/src/components/admin/AdminSectionRegistry.ts'
          text = read(path)
          text = replace_once(
              text,
              '| "dashboard" | "live_drivers" | "new_order" | "new_merchant" | "merchants" | "all_orders"',
              '| "dashboard" | "live_drivers" | "new_order" | "personal_orders" | "new_merchant" | "merchants" | "all_orders"',
              'registry personal section type',
          )
          personal_cfg = '  cfg("personal_orders","الطلبيات الشخصية","Personal Orders","طلبات مباشرة لعملاء أفراد بدون تاجر، بسعر توصيل ثابت 25 درهم.","Direct customer orders without a merchant, with a fixed 25 AED delivery fee.","PackagePlus","orders","orders where source_channel=admin_personal_order",["personalOrders","pendingPersonal","personalCOD","personalRevenue"],["search","status","dateRange","city","driver"],["senderName","senderPhone","pickupAddress","receiverName","receiverPhone","deliveryAddress","goodsValue","paymentMethod","notes"],["createPersonalOrder","view","edit","assignDriver","exportSelected","exportAllPdf"],"personal orders statement","direct customer orders, fixed 25 AED delivery, no merchant ledger"),\n'
          text = sub_once(
              text,
              r'(  cfg\("new_order"[^\n]+\),\n)',
              r'\1' + personal_cfg,
              'insert registry personal section',
          )
          write(path, text)

          path = 'artifacts/day-night-delivery/src/components/admin/command-center/AdminPanelCommandCenter.tsx'
          text = read(path)
          text = replace_once(
              text,
              '  { id: "new_order", ar: "إضافة طلب جديد", en: "New Order", groupAr: "العمليات", groupEn: "Operations", Icon: PackagePlus },\n',
              '  { id: "new_order", ar: "إضافة طلب جديد", en: "New Order", groupAr: "العمليات", groupEn: "Operations", Icon: PackagePlus },\n  { id: "personal_orders", ar: "الطلبيات الشخصية", en: "Personal Orders", groupAr: "الطلبات", groupEn: "Orders", Icon: PackagePlus },\n',
              'command center personal section',
          )
          write(path, text)

          path = 'artifacts/day-night-delivery/src/components/AdminPanelLuxury.tsx'
          text = read(path)
          text = sub_once(
              text,
              r'(  \{\n    id: "new_order",[\s\S]*?\n  \},\n)',
              r'''\1  {
    id: "personal_orders",
    ar: "الطلبيات الشخصية",
    en: "Personal Orders",
    groupAr: "الطلبات",
    groupEn: "Orders",
    Icon: PackagePlus,
  },
''',
              'legacy admin personal menu',
          )
          write(path, text)

          # Personal operations runtime.
          write('artifacts/day-night-delivery/src/lib/personalOrderOperations.ts', r'''import { supabase } from "../supabase";
import type { Order } from "../types";
import { opsErrorDetail, type OpsCreateResult } from "./adminOperationsData";
import { createDayNightInvoiceNumber } from "./printableDocuments";

export const PERSONAL_ORDER_DELIVERY_FEE = 25;

export type PersonalOrderInput = {
  reference?: string;
  sender_name: string;
  sender_phone: string;
  pickup_city: string;
  pickup_area?: string;
  pickup_street: string;
  receiver_name: string;
  receiver_phone: string;
  delivery_city: string;
  delivery_area?: string;
  delivery_street: string;
  package_type: string;
  goods_value: number | string;
  discount_amount?: number | string;
  payment_method: string;
  notes?: string;
};

const clean = (value: unknown) => String(value ?? "").trim();
const numberValue = (value: unknown, fallback = 0) => {
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : fallback;
};

function address(parts: unknown[]) {
  const seen = new Set<string>();
  return parts
    .map(clean)
    .filter((part) => {
      const key = part.toLowerCase();
      if (!part || seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .join(" - ");
}

function normalizedPaymentMethod(value: unknown) {
  const method = clean(value || "cod").toLowerCase().replace(/[\s-]+/g, "_");
  if (["cod", "receiver_pays", "prepaid"].includes(method)) return method;
  return "cod";
}

export function calculatePersonalOrderFinancials(input: {
  goodsValue: unknown;
  discountAmount?: unknown;
  deliveryFee?: unknown;
}) {
  const goodsValue = Math.max(0, numberValue(input.goodsValue));
  const deliveryFee = Math.max(0, numberValue(input.deliveryFee, PERSONAL_ORDER_DELIVERY_FEE));
  const discountAmount = Math.max(0, numberValue(input.discountAmount));
  const beforeDiscount = goodsValue + deliveryFee;
  if (discountAmount > beforeDiscount) throw new Error("discount_exceeds_personal_order_total");
  return {
    goodsValue,
    deliveryFee,
    discountAmount,
    deliveryFeeMode: "customer_pays" as const,
    customerTotal: beforeDiscount - discountAmount,
    merchantDue: 0,
    companyRevenue: deliveryFee,
  };
}

function isMissingPersonalRuntime(error: unknown) {
  return /admin_create_personal_order|pgrst202|schema cache|could not find the function|function .* does not exist/i.test(
    opsErrorDetail(error),
  );
}

export async function createPersonalOpsOrder(
  input: PersonalOrderInput,
): Promise<OpsCreateResult<Order>> {
  if (!supabase) throw new Error("Supabase is not configured.");
  const senderName = clean(input.sender_name);
  const senderPhone = clean(input.sender_phone);
  const receiverName = clean(input.receiver_name);
  const receiverPhone = clean(input.receiver_phone);
  if (!senderName || !senderPhone || !receiverName || !receiverPhone) {
    throw new Error("personal_order_contact_fields_required");
  }

  const financials = calculatePersonalOrderFinancials({
    goodsValue: input.goods_value,
    discountAmount: input.discount_amount,
  });
  const now = new Date();
  const createdAt = now.toISOString();
  const seed = clean(input.reference) || `PERSONAL-${Date.now().toString(36)}`;
  const trackingNumber = createDayNightInvoiceNumber(seed, now);
  const paymentMethod = normalizedPaymentMethod(input.payment_method);
  const packageValue = clean(input.package_type) || "Personal shipment";
  const payload = {
    tracking_number: trackingNumber,
    tracking_code: trackingNumber,
    invoice_number: trackingNumber,
    coupon_number: clean(input.reference) || null,
    merchant_id: null,
    merchant_name: null,
    merchant_code: null,
    source_channel: "admin_personal_order",
    source_domain: "daynightae.com",
    sender_name: senderName,
    sender_phone: senderPhone,
    sender_city: clean(input.pickup_city || "Abu Dhabi"),
    sender_address: address([input.pickup_area, input.pickup_street, input.pickup_city]),
    receiver_name: receiverName,
    receiver_phone: receiverPhone,
    receiver_city: clean(input.delivery_city || "Abu Dhabi"),
    receiver_address: address([input.delivery_area, input.delivery_street, input.delivery_city]),
    package_type: packageValue,
    package_description: packageValue,
    weight: 1,
    pieces: 1,
    order_count: 1,
    shipping_scope: "local",
    service_type: "standard",
    payment_method: paymentMethod,
    cod_amount: paymentMethod === "cod" ? financials.customerTotal : 0,
    goods_value: financials.goodsValue,
    delivery_fee: PERSONAL_ORDER_DELIVERY_FEE,
    discount_amount: financials.discountAmount,
    delivery_fee_mode: "customer_pays",
    customer_total: financials.customerTotal,
    merchant_due: 0,
    company_revenue: PERSONAL_ORDER_DELIVERY_FEE,
    delivery_price: PERSONAL_ORDER_DELIVERY_FEE,
    base_price: PERSONAL_ORDER_DELIVERY_FEE,
    subtotal: financials.customerTotal,
    total: financials.customerTotal,
    total_price: financials.customerTotal,
    amount: financials.customerTotal,
    price: financials.customerTotal,
    manual_delivery_price: null,
    price_source: "system",
    currency: "AED",
    notes: [clean(input.notes), "PERSONAL_ORDER · Fixed delivery 25 AED"].filter(Boolean).join(" | "),
    status: "pending",
    status_history: [{ status: "pending", date: createdAt, created_at: createdAt, note: "Created by admin as a personal order without merchant" }],
    created_at: createdAt,
    updated_at: createdAt,
  };

  const rpc = await supabase.rpc("admin_create_personal_order", { p_order: payload });
  if (!rpc.error) {
    const row = (Array.isArray(rpc.data) ? rpc.data[0] : rpc.data) as Order | null;
    if (row?.id) return { row, source: "rpc" };
    throw new Error("personal_order_creation_returned_no_row");
  }
  if (!isMissingPersonalRuntime(rpc.error)) {
    throw new Error(opsErrorDetail(rpc.error) || "personal_order_creation_failed");
  }

  const fallback = await supabase.from("orders").insert(payload).select("*").single();
  if (fallback.error || !fallback.data?.id) {
    throw new Error(
      [opsErrorDetail(rpc.error), opsErrorDetail(fallback.error), "Apply the personal-orders migration."].filter(Boolean).join(" | "),
    );
  }
  return { row: fallback.data as Order, source: "db" };
}
''')

          # Personal order entry form.
          write('artifacts/day-night-delivery/src/components/admin/AdminPersonalOrderForm.tsx', r'''import { useMemo, useState, type FormEvent } from "react";
import { AlertTriangle, CheckCircle2, Loader2, PackagePlus, Save, UserRound } from "lucide-react";
import { UAE_LOCATIONS, getAreasForEmirate, getDefaultAreaForEmirate } from "../../data/uaeLocations";
import { opsErrorDetail } from "../../lib/adminOperationsData";
import {
  PERSONAL_ORDER_DELIVERY_FEE,
  calculatePersonalOrderFinancials,
  createPersonalOpsOrder,
  type PersonalOrderInput,
} from "../../lib/personalOrderOperations";
import type { Order } from "../../types";

const emptyForm: PersonalOrderInput = {
  reference: "",
  sender_name: "",
  sender_phone: "",
  pickup_city: "Abu Dhabi",
  pickup_area: "Mussafah",
  pickup_street: "",
  receiver_name: "",
  receiver_phone: "",
  delivery_city: "Abu Dhabi",
  delivery_area: "Al Shahama",
  delivery_street: "",
  package_type: "",
  goods_value: "",
  discount_amount: "",
  payment_method: "cod",
  notes: "",
};

const inputClass = "w-full rounded-2xl border border-brand-sky/20 bg-[#06172c] px-4 py-3 text-sm font-bold text-white outline-none placeholder:text-white/35 focus:border-brand-gold/65";

export default function AdminPersonalOrderForm({
  isArabic,
  onSaved,
}: {
  isArabic: boolean;
  onSaved?: (order: Order) => Promise<void> | void;
}) {
  const [form, setForm] = useState<PersonalOrderInput>(emptyForm);
  const [saving, setSaving] = useState(false);
  const [message, setMessage] = useState("");
  const [error, setError] = useState("");
  const pickupAreas = useMemo(() => getAreasForEmirate(form.pickup_city), [form.pickup_city]);
  const deliveryAreas = useMemo(() => getAreasForEmirate(form.delivery_city), [form.delivery_city]);
  const financials = useMemo(() => {
    try {
      return calculatePersonalOrderFinancials({ goodsValue: form.goods_value, discountAmount: form.discount_amount });
    } catch {
      return null;
    }
  }, [form.discount_amount, form.goods_value]);

  function field<K extends keyof PersonalOrderInput>(key: K, value: PersonalOrderInput[K]) {
    setForm((current) => ({ ...current, [key]: value }));
    setMessage("");
    setError("");
  }

  async function submit(event: FormEvent<HTMLFormElement>) {
    event.preventDefault();
    setMessage("");
    setError("");
    const missing = [
      !form.sender_name.trim() ? (isArabic ? "اسم المرسل" : "sender name") : "",
      !form.sender_phone.trim() ? (isArabic ? "هاتف المرسل" : "sender phone") : "",
      !form.receiver_name.trim() ? (isArabic ? "اسم المستلم" : "recipient name") : "",
      !form.receiver_phone.trim() ? (isArabic ? "هاتف المستلم" : "recipient phone") : "",
      !form.pickup_street.trim() ? (isArabic ? "عنوان الاستلام" : "pickup address") : "",
      !form.delivery_street.trim() ? (isArabic ? "عنوان التسليم" : "delivery address") : "",
      form.goods_value === "" ? (isArabic ? "قيمة البضاعة" : "goods value") : "",
    ].filter(Boolean);
    if (missing.length) {
      setError(isArabic ? `الحقول المطلوبة: ${missing.join("، ")}` : `Required fields: ${missing.join(", ")}`);
      return;
    }
    if (!financials) {
      setError(isArabic ? "الخصم لا يمكن أن يتجاوز قيمة البضاعة والتوصيل." : "Discount cannot exceed goods plus delivery.");
      return;
    }

    setSaving(true);
    try {
      const result = await createPersonalOpsOrder(form);
      const ref = result.row.tracking_number || result.row.invoice_number || result.row.id;
      setMessage(
        isArabic
          ? `تم إنشاء الطلب الشخصي ${ref} بدون تاجر. التوصيل ثابت ${PERSONAL_ORDER_DELIVERY_FEE.toFixed(2)} درهم، والمطلوب من العميل ${financials.customerTotal.toFixed(2)} درهم.`
          : `Personal order ${ref} was created without a merchant. Delivery is fixed at ${PERSONAL_ORDER_DELIVERY_FEE.toFixed(2)} AED and customer total is ${financials.customerTotal.toFixed(2)} AED.`,
      );
      setForm(emptyForm);
      window.dispatchEvent(new CustomEvent("dn-admin-orders-updated", { detail: { order: result.row, source: result.source } }));
      await onSaved?.(result.row);
    } catch (cause) {
      const detail = opsErrorDetail(cause);
      setError(
        isArabic
          ? `تعذر إنشاء الطلب الشخصي الحقيقي.${detail ? ` السبب: ${detail}` : ""}`
          : `The personal order could not be created.${detail ? ` Reason: ${detail}` : ""}`,
      );
    } finally {
      setSaving(false);
    }
  }

  return (
    <form onSubmit={submit} className="dn-personal-order-form rounded-[28px] border border-brand-gold/30 bg-gradient-to-br from-[#07172c] to-[#0b3155] p-5 shadow-2xl" dir={isArabic ? "rtl" : "ltr"}>
      <header className="mb-5 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div className="flex items-start gap-3">
          <span className="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-gold text-[#07172c]"><UserRound className="h-6 w-6" /></span>
          <div>
            <h2 className="text-xl font-black text-white">{isArabic ? "إنشاء طلب شخصي بدون تاجر" : "Create a personal order without merchant"}</h2>
            <p className="mt-1 text-xs font-bold leading-6 text-white/60">{isArabic ? "طلب مباشر بين مرسل ومستلم. لا يُنشأ حساب تاجر، ورسوم التوصيل ثابتة 25 درهم." : "Direct sender-to-recipient order. No merchant ledger is created and delivery is fixed at 25 AED."}</p>
          </div>
        </div>
        <div className="rounded-2xl border border-brand-gold/30 bg-brand-gold/10 px-5 py-3 text-center">
          <small className="block text-[10px] font-black text-white/55">{isArabic ? "سعر التوصيل الثابت" : "Fixed delivery fee"}</small>
          <strong className="text-2xl font-black text-brand-gold" dir="ltr">25.00 AED</strong>
        </div>
      </header>

      {error && <p className="mb-4 flex gap-2 rounded-2xl border border-rose-400/30 bg-rose-400/10 p-4 text-xs font-bold text-rose-100"><AlertTriangle className="h-4 w-4 shrink-0" />{error}</p>}
      {message && <p className="mb-4 flex gap-2 rounded-2xl border border-emerald-400/30 bg-emerald-400/10 p-4 text-xs font-bold text-emerald-100"><CheckCircle2 className="h-4 w-4 shrink-0" />{message}</p>}

      <div className="grid gap-4 xl:grid-cols-2">
        <section className="space-y-3 rounded-3xl border border-white/10 bg-black/10 p-4">
          <h3 className="font-black text-brand-gold">{isArabic ? "بيانات المرسل والاستلام" : "Sender and pickup"}</h3>
          <div className="grid gap-3 sm:grid-cols-2">
            <input value={form.sender_name} onChange={(e) => field("sender_name", e.target.value)} className={inputClass} placeholder={isArabic ? "اسم المرسل *" : "Sender name *"} />
            <input value={form.sender_phone} onChange={(e) => field("sender_phone", e.target.value)} className={inputClass} placeholder={isArabic ? "هاتف المرسل *" : "Sender phone *"} dir="ltr" />
          </div>
          <div className="grid gap-3 sm:grid-cols-2">
            <select value={form.pickup_city} onChange={(e) => setForm((current) => ({ ...current, pickup_city: e.target.value, pickup_area: getDefaultAreaForEmirate(e.target.value) }))} className={inputClass}>{UAE_LOCATIONS.map((item) => <option key={item.value} value={item.value}>{isArabic ? item.ar : item.en}</option>)}</select>
            <select value={form.pickup_area || ""} onChange={(e) => field("pickup_area", e.target.value)} className={inputClass}>{pickupAreas.map((item) => <option key={item.value} value={item.value}>{isArabic ? item.ar : item.en}</option>)}</select>
          </div>
          <textarea rows={3} value={form.pickup_street} onChange={(e) => field("pickup_street", e.target.value)} className={inputClass} placeholder={isArabic ? "عنوان الاستلام التفصيلي *" : "Detailed pickup address *"} />
        </section>

        <section className="space-y-3 rounded-3xl border border-white/10 bg-black/10 p-4">
          <h3 className="font-black text-brand-gold">{isArabic ? "بيانات المستلم والتسليم" : "Recipient and delivery"}</h3>
          <div className="grid gap-3 sm:grid-cols-2">
            <input value={form.receiver_name} onChange={(e) => field("receiver_name", e.target.value)} className={inputClass} placeholder={isArabic ? "اسم المستلم *" : "Recipient name *"} />
            <input value={form.receiver_phone} onChange={(e) => field("receiver_phone", e.target.value)} className={inputClass} placeholder={isArabic ? "هاتف المستلم *" : "Recipient phone *"} dir="ltr" />
          </div>
          <div className="grid gap-3 sm:grid-cols-2">
            <select value={form.delivery_city} onChange={(e) => setForm((current) => ({ ...current, delivery_city: e.target.value, delivery_area: getDefaultAreaForEmirate(e.target.value) }))} className={inputClass}>{UAE_LOCATIONS.map((item) => <option key={item.value} value={item.value}>{isArabic ? item.ar : item.en}</option>)}</select>
            <select value={form.delivery_area || ""} onChange={(e) => field("delivery_area", e.target.value)} className={inputClass}>{deliveryAreas.map((item) => <option key={item.value} value={item.value}>{isArabic ? item.ar : item.en}</option>)}</select>
          </div>
          <textarea rows={3} value={form.delivery_street} onChange={(e) => field("delivery_street", e.target.value)} className={inputClass} placeholder={isArabic ? "عنوان التسليم التفصيلي *" : "Detailed delivery address *"} />
        </section>
      </div>

      <section className="mt-4 grid gap-3 rounded-3xl border border-white/10 bg-black/10 p-4 md:grid-cols-2 xl:grid-cols-4">
        <input value={form.reference || ""} onChange={(e) => field("reference", e.target.value)} className={inputClass} placeholder={isArabic ? "مرجع اختياري — يُولد تلقائيًا" : "Optional reference — auto generated"} dir="ltr" />
        <input value={form.package_type} onChange={(e) => field("package_type", e.target.value)} className={inputClass} placeholder={isArabic ? "محتوى الشحنة" : "Package content"} />
        <input type="number" min={0} step="0.01" value={form.goods_value} onChange={(e) => field("goods_value", e.target.value)} className={inputClass} placeholder={isArabic ? "قيمة البضاعة *" : "Goods value *"} />
        <input type="number" min={0} step="0.01" value={form.discount_amount || ""} onChange={(e) => field("discount_amount", e.target.value)} className={inputClass} placeholder={isArabic ? "خصم اختياري" : "Optional discount"} />
        <select value={form.payment_method} onChange={(e) => field("payment_method", e.target.value)} className={inputClass}>
