name: P1 Main Runtime Dispatcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-main-runtime-dispatch.yml
      - .github/workflows/p1-runtime-evidence.yml
      - artifacts/day-night-delivery/scripts/p1-runtime-health.mjs
      - artifacts/day-night-delivery/scripts/customer-experience-runtime-e2e.mjs
      - artifacts/day-night-delivery/scripts/p1-production-hardening-gate.mjs
      - supabase/migrations/**
      - supabase/functions/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p1-main-runtime-dispatch.yml
      - .github/workflows/p1-runtime-evidence.yml
      - artifacts/day-night-delivery/scripts/p1-runtime-health.mjs
      - artifacts/day-night-delivery/scripts/customer-experience-runtime-e2e.mjs
      - artifacts/day-night-delivery/scripts/p1-production-hardening-gate.mjs
      - supabase/migrations/**
      - supabase/functions/**
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: p1-main-runtime-dispatch
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected runtime dispatcher
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate target workflow contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/p1-runtime-evidence.yml'
          test -f "$workflow"
          grep -Fq 'workflow_dispatch:' "$workflow"
          grep -Fq 'environment: production-runtime-tests' "$workflow"
          grep -Fq 'Run protected P1 runtime health' "$workflow"
          grep -Fq 'Run protected Customer Experience lifecycle' "$workflow"
          echo 'P1 main dispatcher contract: PASS'

  dispatch:
    name: Dispatch protected P1 evidence on main
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch P1 production runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run p1-runtime-evidence.yml --ref main
          echo 'Protected P1 production runtime evidence dispatched on main.'
