name: Admin Order CRUD v3 Production Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-order-crud-v3-production-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: admin-order-crud-v3-production-verification
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}
      TARGET_ORDER_ID: bbf1c55c-941c-41c1-857a-54c0c3b897a1
    steps:
      - name: Verify exact order with independent sessions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=String(process.env.VITE_SUPABASE_URL||'').replace(/\/$/,'');
          const anon=String(process.env.VITE_SUPABASE_ANON_KEY||'');
          const service=String(process.env.SUPABASE_SERVICE_ROLE_KEY||'');
          const email=String(process.env.RUNTIME_ADMIN_EMAIL||'').trim().toLowerCase();
          const password=String(process.env.RUNTIME_ADMIN_PASSWORD||'');
          const orderId=String(process.env.TARGET_ORDER_ID||'');
          for(const [key,value] of Object.entries({root,anon,service,email,password,orderId}))if(!value)throw new Error(`missing_${key}`);
          const project=new URL(root).hostname.split('.')[0];
          if(project!=='ngdwybpgacauorygoedi')throw new Error(`wrong_project_${project}`);
          const norm=(value)=>{const raw=String(value??'').trim().toLowerCase().replace(/[\s-]+/g,'_');return ({waiting:'pending',order_pending:'pending',accepted:'confirmed',approved:'confirmed',driver_assigned:'assigned',pickup:'picked_up',collected:'picked_up',out_for_delivery:'in_transit',on_the_way:'in_transit',complete:'delivered',completed:'delivered',return:'returned',canceled:'cancelled',failed:'cancelled'})[raw]||raw};
          const headers=(key,token=key)=>({apikey:key,Authorization:`Bearer ${token}`,'Content-Type':'application/json','Cache-Control':'no-cache, no-store, max-age=0',Pragma:'no-cache'});
          const parse=async(responseOrPromise,label)=>{const response=await responseOrPromise;const payload=await response.json().catch(()=>null);if(!response.ok)throw new Error(`${label}_${response.status}_${JSON.stringify(payload)}`);return payload};
          const login=(label)=>parse(fetch(`${root}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:anon,'Content-Type':'application/json','Cache-Control':'no-store'},body:JSON.stringify({email,password}),cache:'no-store'}),label);
          const readOrder=async(token,label)=>{const query=new URLSearchParams({select:'id,status,updated_at,status_history',id:`eq.${orderId}`,limit:'1'});const list=await parse(fetch(`${root}/rest/v1/orders?${query}`,{headers:headers(anon,token),cache:'no-store'}),label);if(!Array.isArray(list)||list.length!==1)throw new Error(`${label}_missing`);return list[0]};
          const serviceRows=(table,filters,label)=>parse(fetch(`${root}/rest/v1/${table}?${new URLSearchParams(filters)}`,{headers:headers(service),cache:'no-store'}),label);
          const mutate=async(token,payload,label)=>{const result=await parse(fetch(`${root}/rest/v1/rpc/admin_update_order_complete_v3`,{method:'POST',headers:headers(anon,token),body:JSON.stringify({p_payload:payload}),cache:'no-store'}),label);if(result?.ok!==true||result?.success!==true||result?.order?.id!==orderId)throw new Error(`${label}_bad_response_${JSON.stringify(result)}`);return result};
          const findHistory=async(status,reason,label)=>{const list=await serviceRows('order_status_history',{select:'id,order_id,status,note,created_at',order_id:`eq.${orderId}`,status:`eq.${status}`,note:`eq.${reason}`,order:'created_at.desc',limit:'5'},label);const row=Array.isArray(list)?list.find(item=>item.order_id===orderId&&norm(item.status)===status&&item.note===reason):null;if(!row)throw new Error(`${label}_missing`);return row};
          const findAudit=async(requestId,oldStatus,newStatus,label)=>{const list=await serviceRows('admin_order_mutation_audit_v3',{select:'id,order_id,operation,request_id,old_status,new_status,changed_fields,created_at',order_id:`eq.${orderId}`,operation:'eq.status',request_id:`eq.${requestId}`,order:'created_at.desc',limit:'5'},label);const row=Array.isArray(list)?list.find(item=>item.order_id===orderId&&item.request_id===requestId):null;if(!row)throw new Error(`${label}_missing`);if(norm(row.old_status)!==oldStatus||norm(row.new_status)!==newStatus)throw new Error(`${label}_status_mismatch`);if(!Array.isArray(row.changed_fields)||!row.changed_fields.includes('status'))throw new Error(`${label}_status_not_audited`);return row};
          const session=await login('admin_login');if(!session?.access_token)throw new Error('admin_session_missing');
          const before=await readOrder(session.access_token,'initial_read');const original=norm(before.status);if(!original)throw new Error('original_status_missing');const temporary=original==='confirmed'?'pending':'confirmed';
          const token=`${process.env.GITHUB_SHA||'manual'}-${Date.now()}`;const forwardRequest=`crud-v3-forward-${token}`;const restoreRequest=`crud-v3-restore-${token}`;const forwardReason=`Production persistence verification ${forwardRequest}`;const restoreReason=`Production status restoration ${restoreRequest}`;
          let changed=false;let captured=null;let evidence={};
          try{
            const forward=await mutate(session.access_token,{order_id:orderId,operation:'status',status:temporary,reason:forwardReason,note:forwardReason,source_page:'github_production_proof',request_id:forwardRequest},'forward_mutation');changed=true;if(norm(forward.order.status)!==temporary)throw new Error('forward_readback_mismatch');
            const freshSession=await login('fresh_login');const refreshed=await readOrder(freshSession.access_token,'fresh_read');if(norm(refreshed.status)!==temporary)throw new Error(`status_not_persisted_${refreshed.status}`);
            const history=await findHistory(temporary,forwardReason,'forward_history');const audit=await findAudit(forwardRequest,original,temporary,'forward_audit');
            evidence={order_id:orderId,original_status:original,verified_status:temporary,persisted_after_fresh_session:true,order_status_history_id:history.id,admin_order_mutation_audit_v3_id:audit.id};
          }catch(error){captured=error}finally{
            if(changed){const restoreSession=await login('restore_login');const restored=await mutate(restoreSession.access_token,{order_id:orderId,operation:'status',status:original,reason:restoreReason,note:restoreReason,source_page:'github_production_proof',request_id:restoreRequest},'restore_mutation');if(norm(restored.order.status)!==original)throw new Error('restore_readback_mismatch');const finalSession=await login('final_login');const finalRead=await readOrder(finalSession.access_token,'final_read');if(norm(finalRead.status)!==original)throw new Error(`original_not_restored_${finalRead.status}`);const audit=await findAudit(restoreRequest,temporary,original,'restore_audit');evidence={...evidence,restored_after_fresh_session:true,restored_status:original,restore_audit_id:audit.id}}
          }
          if(captured)throw captured;
          const output={result:'PASS',production_project:project,...evidence};fs.writeFileSync('/tmp/crud-v3-production-proof.json',JSON.stringify(output,null,2));console.log(JSON.stringify(output,null,2));
          NODE

      - name: Publish production proof to PR 344
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(cat /tmp/crud-v3-production-proof.json)"
          body=$(cat <<EOF
          ### ✅ Admin Order CRUD v3 — Final Production Proof

          \`\`\`json
          $evidence
          \`\`\`

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/344/comments" -f body="$body"

      - name: Publish proof failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/344/comments" -f body="### ❌ Admin Order CRUD v3 final production proof failed\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
