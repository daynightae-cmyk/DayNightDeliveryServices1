name: P1 Migration Constraint Debug

on:
  push:
    branches: [runtime/issue-266-evidence]
    paths:
      - .github/workflows/p1-migration-debug.yml
      - supabase/migrations/20260730130000_p1_direct_finance_backfill.sql
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p1-migration-debug.yml
      - supabase/migrations/20260730130000_p1_direct_finance_backfill.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-production-runtime-evidence
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose direct finance backfill
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-runtime-tests
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build isolated migration workdir
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL); process.stdout.write(u.hostname.split('.')[0])")"
          workdir="$RUNNER_TEMP/p1-migration-debug"
          mkdir -p "$workdir/supabase/migrations" artifacts/day-night-delivery/p1-runtime-evidence
          cp supabase/config.toml "$workdir/supabase/config.toml"
          supabase --workdir "$workdir" link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$workdir" migration fetch --linked
          cp supabase/migrations/20260730130000_p1_direct_finance_backfill.sql "$workdir/supabase/migrations/"
          echo "P1_DEBUG_WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: Execute isolated migration with debug diagnostics
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          supabase --workdir "$P1_DEBUG_WORKDIR" db push --yes --debug 2>&1 \
            | tee artifacts/day-night-delivery/p1-runtime-evidence/migration-debug.log

      - name: Upload sanitized diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-P1-Migration-Debug
          path: artifacts/day-night-delivery/p1-runtime-evidence/migration-debug.log
          if-no-files-found: warn
          retention-days: 1
