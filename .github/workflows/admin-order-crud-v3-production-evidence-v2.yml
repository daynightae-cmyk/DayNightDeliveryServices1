name: Admin Order CRUD v3 Production Evidence v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-order-crud-v3-production-evidence-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: admin-order-crud-v3-production-verification
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}
      TARGET_ORDER_ID: bbf1c55c-941c-41c1-857a-54c0c3b897a1
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare schema-compatible release migration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'supabase/migrations/20260804211500_admin_order_crud_v3_nonblocking.sql';
          let sql = fs.readFileSync(file, 'utf8');
          const specs = [
            ['trg_orders_canonical_merchant_link', 'dn_enforce_canonical_order_merchant_link'],
            ['trg_admin_enforce_order_coupon_policy', 'admin_enforce_order_coupon_policy'],
            ['trg_daynight_normalize_financial_order', 'daynight_normalize_financial_order'],
            ['dn_guard_admin_order_required_fields', 'dn_guard_admin_order_required_fields'],
            ['trg_daynight_post_delivered_financials', 'daynight_post_delivered_financials'],
            ['trg_dn_project_delivered_order_dependencies', 'dn_project_delivered_order_dependencies'],
            ['merchant_order_notification_sync', 'merchant_order_notification_trigger'],
            ['trg_portal_notify_order_lifecycle', 'portal_notify_order_lifecycle'],
          ];
          for (let index = 0; index < specs.length; index += 1) {
            const [trigger, fn] = specs[index];
            const expression = new RegExp(`drop trigger if exists ${trigger} on public\\.orders;\\n(create trigger ${trigger}\\n[\\s\\S]*?execute function public\\.${fn}\\(\\);)`);
            const match = sql.match(expression);
            if (!match) throw new Error(`trigger_block_missing_${trigger}`);
            const ddl = match[1];
            sql = sql.replace(expression, `do $dn_trigger_${index}$\nbegin\n  if to_regprocedure('public.${fn}()') is not null then\n    execute 'drop trigger if exists ${trigger} on public.orders';\n    execute $dn_ddl_${index}$\n${ddl}\n$dn_ddl_${index}$;\n  end if;\nend;\n$dn_trigger_${index}$;`);
          }
          fs.writeFileSync('/tmp/20260804211500_admin_order_crud_v3_nonblocking.sql', sql);
          NODE

      - name: Apply canonical CRUD v3 migration idempotently
        shell: bash
        run: |
          set -euo pipefail
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"
          target="20260804211500_admin_order_crud_v3_nonblocking.sql"
          release_dir="$RUNNER_TEMP/daynight-admin-order-crud-v3-v2"
          mkdir -p "$release_dir/supabase/migrations"
          cp supabase/config.toml "$release_dir/supabase/config.toml"
          supabase --workdir "$release_dir" link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$release_dir" migration fetch --linked
          schema_pending=false
          if [ ! -f "$release_dir/supabase/migrations/$target" ]; then
            cp "/tmp/$target" "$release_dir/supabase/migrations/$target"
            schema_pending=true
          fi
          supabase --workdir "$release_dir" db push --dry-run
          if [ "$schema_pending" = "true" ]; then
            supabase --workdir "$release_dir" db push --yes
          fi
          supabase --workdir "$release_dir" migration list --linked | grep -F "20260804211500"

      - name: Verify persistence, timeline, audit and restoration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=String(process.env.VITE_SUPABASE_URL||'').replace(/\/$/,'');
          const anon=String(process.env.VITE_SUPABASE_ANON_KEY||'');
          const service=String(process.env.SUPABASE_SERVICE_ROLE_KEY||'');
          const email=String(process.env.RUNTIME_ADMIN_EMAIL||'').trim().toLowerCase();
          const password=String(process.env.RUNTIME_ADMIN_PASSWORD||'');
          const orderId=String(process.env.TARGET_ORDER_ID||'');
          for(const [key,value] of Object.entries({root,anon,service,email,password,orderId}))if(!value)throw new Error(`missing_${key}`);
          const project=new URL(root).hostname.split('.')[0];
          if(project!=='ngdwybpgacauorygoedi')throw new Error(`wrong_project_${project}`);
          const norm=(value)=>{const raw=String(value??'').trim().toLowerCase().replace(/[\s-]+/g,'_');return ({waiting:'pending',order_pending:'pending',accepted:'confirmed',approved:'confirmed',driver_assigned:'assigned',pickup:'picked_up',collected:'picked_up',out_for_delivery:'in_transit',on_the_way:'in_transit',complete:'delivered',completed:'delivered',return:'returned',canceled:'cancelled',failed:'cancelled'})[raw]||raw};
          const headers=(key,token=key)=>({apikey:key,Authorization:`Bearer ${token}`,'Content-Type':'application/json','Cache-Control':'no-cache, no-store, max-age=0',Pragma:'no-cache'});
          const parse=async(response,label)=>{const payload=await response.json().catch(()=>null);if(!response.ok)throw new Error(`${label}_${response.status}_${JSON.stringify(payload)}`);return payload};
          const login=(label)=>parse(fetch(`${root}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:anon,'Content-Type':'application/json','Cache-Control':'no-store'},body:JSON.stringify({email,password}),cache:'no-store'}),label);
          const readOrder=async(token,label)=>{const query=new URLSearchParams({select:'id,status,updated_at,status_history',id:`eq.${orderId}`,limit:'1'});const list=await parse(fetch(`${root}/rest/v1/orders?${query}`,{headers:headers(anon,token),cache:'no-store'}),label);if(!Array.isArray(list)||list.length!==1)throw new Error(`${label}_missing`);return list[0]};
          const serviceRows=(table,filters,label)=>parse(fetch(`${root}/rest/v1/${table}?${new URLSearchParams(filters)}`,{headers:headers(service),cache:'no-store'}),label);
          const mutate=async(token,payload,label)=>{const result=await parse(fetch(`${root}/rest/v1/rpc/admin_update_order_complete_v3`,{method:'POST',headers:headers(anon,token),body:JSON.stringify({p_payload:payload}),cache:'no-store'}),label);if(result?.ok!==true||result?.success!==true||result?.order?.id!==orderId)throw new Error(`${label}_bad_response_${JSON.stringify(result)}`);return result};
          const findHistory=async(status,reason,label)=>{const list=await serviceRows('order_status_history',{select:'id,order_id,status,note,created_at',order_id:`eq.${orderId}`,status:`eq.${status}`,note:`eq.${reason}`,order:'created_at.desc',limit:'5'},label);const row=Array.isArray(list)?list.find(item=>item.order_id===orderId&&norm(item.status)===status&&item.note===reason):null;if(!row)throw new Error(`${label}_missing`);return row};
          const findAudit=async(requestId,oldStatus,newStatus,label)=>{const list=await serviceRows('admin_order_mutation_audit_v3',{select:'id,order_id,operation,request_id,old_status,new_status,changed_fields,created_at',order_id:`eq.${orderId}`,operation:'eq.status',request_id:`eq.${requestId}`,order:'created_at.desc',limit:'5'},label);const row=Array.isArray(list)?list.find(item=>item.order_id===orderId&&item.request_id===requestId):null;if(!row)throw new Error(`${label}_missing`);if(norm(row.old_status)!==oldStatus||norm(row.new_status)!==newStatus)throw new Error(`${label}_status_mismatch`);if(!Array.isArray(row.changed_fields)||!row.changed_fields.includes('status'))throw new Error(`${label}_status_not_audited`);return row};
          const session=await login('admin_login');if(!session?.access_token)throw new Error('admin_session_missing');
          const before=await readOrder(session.access_token,'initial_read');const original=norm(before.status);if(!original)throw new Error('original_status_missing');const temporary=original==='confirmed'?'pending':'confirmed';
          const token=`${process.env.GITHUB_SHA||'manual'}-${Date.now()}`;const forwardRequest=`crud-v3-forward-${token}`;const restoreRequest=`crud-v3-restore-${token}`;const forwardReason=`Production persistence verification ${forwardRequest}`;const restoreReason=`Production status restoration ${restoreRequest}`;
          let changed=false;let captured=null;let evidence={};
          try{
            const forward=await mutate(session.access_token,{order_id:orderId,operation:'status',status:temporary,reason:forwardReason,note:forwardReason,source_page:'github_production_evidence_v2',request_id:forwardRequest},'forward_mutation');changed=true;if(norm(forward.order.status)!==temporary)throw new Error('forward_readback_mismatch');
            const freshSession=await login('fresh_login');const refreshed=await readOrder(freshSession.access_token,'fresh_read');if(norm(refreshed.status)!==temporary)throw new Error(`status_not_persisted_${refreshed.status}`);
            const history=await findHistory(temporary,forwardReason,'forward_history');const audit=await findAudit(forwardRequest,original,temporary,'forward_audit');
            evidence={order_id:orderId,original_status:original,verified_status:temporary,persisted_after_fresh_session:true,order_status_history_id:history.id,admin_order_mutation_audit_v3_id:audit.id};
          }catch(error){captured=error}finally{
            if(changed){const restoreSession=await login('restore_login');const restored=await mutate(restoreSession.access_token,{order_id:orderId,operation:'status',status:original,reason:restoreReason,note:restoreReason,source_page:'github_production_evidence_v2',request_id:restoreRequest},'restore_mutation');if(norm(restored.order.status)!==original)throw new Error('restore_readback_mismatch');const finalSession=await login('final_login');const finalRead=await readOrder(finalSession.access_token,'final_read');if(norm(finalRead.status)!==original)throw new Error(`original_not_restored_${finalRead.status}`);const history=await findHistory(original,restoreReason,'restore_history');const audit=await findAudit(restoreRequest,temporary,original,'restore_audit');evidence={...evidence,restored_after_fresh_session:true,restored_status:original,restore_history_id:history.id,restore_audit_id:audit.id}}
          }
          if(captured)throw captured;
          const output={result:'PASS',production_project:project,...evidence};fs.writeFileSync('/tmp/crud-v3-evidence.json',JSON.stringify(output,null,2));console.log(JSON.stringify(output,null,2));
          NODE

      - name: Publish sanitized success evidence to PR 344
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(cat /tmp/crud-v3-evidence.json)"
          body=$(cat <<EOF
          ### ✅ Admin Order CRUD v3 — Production Evidence v2

          The schema-compatible production migration and exact-order verification passed.

          \`\`\`json
          $evidence
          \`\`\`

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/344/comments" -f body="$body"

      - name: Publish protected failure pointer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/344/comments" -f body="### ❌ Admin Order CRUD v3 production verification v2 failed\n\nProtected run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
