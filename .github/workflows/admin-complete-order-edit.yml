name: Admin Complete Order Edit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-complete-order-edit.yml"
      - ".github/scripts/admin-complete-order-editor-browser.mjs"
      - "artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx"
      - "artifacts/day-night-delivery/src/lib/adminOrderEditPersistence.ts"
      - "artifacts/day-night-delivery/src/lib/orderFinancialOperations.ts"
      - "artifacts/day-night-delivery/scripts/admin-complete-order-edit-gate.mjs"
      - "supabase/migrations/20260802084500_admin_complete_order_edit.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-complete-order-edit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-order-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-runtime-tests
    env:
      TEST_BASE_URL: http://127.0.0.1:4173
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify protected browser credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify complete order edit contract
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-complete-order-edit-gate.mjs

      - name: TypeScript
        run: pnpm run web:typecheck

      - name: Production gate
        run: pnpm run web:gate

      - name: Production build
        run: pnpm run web:build

      - name: Serve exact branch-head build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p admin-complete-order-editor-evidence
          nohup pnpm --dir artifacts/day-night-delivery exec vite preview --host 127.0.0.1 --port 4173 --strictPort > admin-complete-order-editor-evidence/local-web.log 2>&1 &
          echo $! > admin-complete-order-editor-evidence/local-web.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$TEST_BASE_URL/auth?nosplash=1" | grep -F 'id="root"' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat admin-complete-order-editor-evidence/local-web.log >&2
          exit 1

      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          playwright_dir="$RUNNER_TEMP/daynight-editor-playwright"
          rm -rf "$playwright_dir"
          mkdir -p "$playwright_dir"
          cd "$playwright_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_NODE_PATH=$playwright_dir/node_modules" >> "$GITHUB_ENV"

      - name: Verify merchant editing on desktop and phone without saving
        run: node .github/scripts/admin-complete-order-editor-browser.mjs

      - name: Stop local application
        if: always()
        shell: bash
        run: |
          if [ -f admin-complete-order-editor-evidence/local-web.pid ]; then
            kill "$(cat admin-complete-order-editor-evidence/local-web.pid)" 2>/dev/null || true
          fi

      - name: Upload complete editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-Admin-Complete-Order-Editor-Evidence
          path: admin-complete-order-editor-evidence/
          if-no-files-found: warn
          retention-days: 30
