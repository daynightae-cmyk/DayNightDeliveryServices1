name: NEXUS Phase 1 Launch Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nexus-phase1-acceptance.yml"
      - ".github/scripts/nexus-phase1-browser-acceptance.mjs"
      - "artifacts/day-night-delivery/.env.example"
      - "artifacts/day-night-delivery/package.json"
      - "pnpm-lock.yaml"
      - "artifacts/day-night-delivery/src/components/admin/AdminNexusControlTower.tsx"
      - "artifacts/day-night-delivery/src/components/admin/AdminNexusLiveCommandMap.tsx"
      - "artifacts/day-night-delivery/src/components/admin/AdminNexusEntry.tsx"
      - "artifacts/day-night-delivery/src/components/admin/AdminNexusRouteBridge.tsx"
      - "artifacts/day-night-delivery/src/lib/nexusMapbox.ts"
      - "artifacts/day-night-delivery/src/lib/nexusRiskEngine.ts"
      - "artifacts/day-night-delivery/src/styles/dn-nexus-live-command-map.css"
      - "artifacts/day-night-delivery/src/styles/dn-nexus-control-tower.css"
      - "artifacts/day-night-delivery/src/styles/dn-nexus-command-launcher.css"
      - "artifacts/day-night-delivery/src/main.tsx"
      - "artifacts/day-night-delivery/scripts/nexus-phase1-production-gate.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-acceptance:
    name: NEXUS Phase 1 production and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-runtime-tests
    env:
      TEST_BASE_URL: http://127.0.0.1:4173
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}
      VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN || vars.VITE_MAPBOX_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify protected Admin runtime and Mapbox configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD VITE_MAPBOX_ACCESS_TOKEN; do
            test -n "${!name:-}" || { echo "Missing required NEXUS environment value: $name" >&2; exit 2; }
          done
          case "$VITE_MAPBOX_ACCESS_TOKEN" in
            pk.*) ;;
            *) echo "VITE_MAPBOX_ACCESS_TOKEN must be a public Mapbox pk token" >&2; exit 2 ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: NEXUS static production contract
        working-directory: artifacts/day-night-delivery
        run: node scripts/nexus-phase1-production-gate.mjs

      - name: TypeScript and exact production build
        shell: bash
        run: |
          set -euo pipefail
          pnpm run web:typecheck
          pnpm run web:build
          test -s artifacts/day-night-delivery/dist/public/index.html
          test -s artifacts/day-night-delivery/dist/public/version.json
          mkdir -p nexus-phase1-evidence
          cp artifacts/day-night-delivery/dist/public/version.json nexus-phase1-evidence/version.json
          find artifacts/day-night-delivery/dist/public/assets -maxdepth 1 -type f -printf '%f\n' | sort > nexus-phase1-evidence/asset-manifest.txt
          grep -Ei 'mapbox|AdminNexusLiveCommandMap|AdminNexus' nexus-phase1-evidence/asset-manifest.txt > nexus-phase1-evidence/nexus-mapbox-chunks.txt || true
          nohup pnpm --dir artifacts/day-night-delivery exec vite preview --host 127.0.0.1 --port 4173 --strictPort > nexus-phase1-evidence/local-web.log 2>&1 &
          echo $! > nexus-phase1-evidence/local-web.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$TEST_BASE_URL/auth?nosplash=1" | grep -F 'id="root"' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat nexus-phase1-evidence/local-web.log >&2
          exit 1

      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          playwright_dir="$RUNNER_TEMP/daynight-nexus-playwright"
          rm -rf "$playwright_dir"
          mkdir -p "$playwright_dir"
          cd "$playwright_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          echo "PLAYWRIGHT_NODE_PATH=$playwright_dir/node_modules" >> "$GITHUB_ENV"

      - name: Open NEXUS with protected Admin and verify real Mapbox surfaces
        run: node .github/scripts/nexus-phase1-browser-acceptance.mjs

      - name: Stop local app
        if: always()
        shell: bash
        run: |
          if [ -f nexus-phase1-evidence/local-web.pid ]; then
            kill "$(cat nexus-phase1-evidence/local-web.pid)" 2>/dev/null || true
          fi

      - name: Upload NEXUS Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-NEXUS-Live-Command-Center-Evidence
          path: nexus-phase1-evidence/
          if-no-files-found: warn
          retention-days: 30
