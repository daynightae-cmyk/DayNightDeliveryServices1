name: Global Merchant Ownership Production Audit

on:
  workflow_dispatch:

permissions:
  contents: read

environment: production

jobs:
  trusted-production-dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production dry-run audit only
        working-directory: artifacts/day-night-delivery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MERCHANT_OWNERSHIP_REPORT_PATH: global-merchant-ownership-runtime-report.json
        run: node scripts/global-merchant-ownership-runtime-audit.mjs

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-merchant-ownership-production-audit
          path: artifacts/day-night-delivery/global-merchant-ownership-runtime-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm no backfill was executed
        if: always()
        run: |
          echo "This workflow never calls admin_apply_global_merchant_ownership_repair."
          echo "Production backfill requires reviewed evidence and a separate explicit human action."
