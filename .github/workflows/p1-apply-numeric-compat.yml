name: Apply P1 Numeric Compatibility Patch

on:
  push:
    branches: [runtime/issue-266-evidence]
    paths: [.github/workflows/p1-apply-numeric-compat.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/issue-266-evidence
          fetch-depth: 0

      - name: Apply verified compatibility replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260730130000_p1_direct_finance_backfill.sql')
          text = migration.read_text(encoding='utf-8')
          old = "greatest(public.dn_safe_numeric(to_jsonb(o)->>'driver_earning', 0), 0)"
          new = "greatest(coalesce(public.admin_safe_numeric(to_jsonb(o)->>'driver_earning'), 0), 0)"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly two dn_safe_numeric calls, found {count}')
          migration.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/p1-migration-debug.yml').unlink(missing_ok=True)
          Path('.github/workflows/p1-apply-numeric-compat.yml').unlink(missing_ok=True)
          PY

          grep -F "admin_safe_numeric(to_jsonb(o)->>'driver_earning')" \
            supabase/migrations/20260730130000_p1_direct_finance_backfill.sql
          if grep -Fq 'dn_safe_numeric' supabase/migrations/20260730130000_p1_direct_finance_backfill.sql; then
            echo 'Legacy numeric helper remains in direct backfill.' >&2
            exit 1
          fi

      - name: Commit clean production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daynightae-cmyk'
          git config user.email 'daynightae-cmyk@users.noreply.github.com'
          git add -A
          git commit -m 'fix(finance): use live numeric compatibility helper'
          git push origin HEAD:runtime/issue-266-evidence
