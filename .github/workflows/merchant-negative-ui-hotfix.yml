name: Merchant Negative Settlement UI Hotfix

on:
  push:
    branches: [fix/merchant-negative-ui-20260805]
    paths:
      - .github/workflows/merchant-negative-ui-hotfix.yml

permissions:
  contents: write

concurrency:
  group: merchant-negative-ui-hotfix
  cancel-in-progress: false

jobs:
  patch-build-commit:
    name: Patch, verify and commit signed merchant totals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/merchant-negative-ui-20260805
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply exact UI and statement corrections
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after, label) {
            const source = fs.readFileSync(file, 'utf8');
            const matches = source.split(before).length - 1;
            if (matches !== 1) {
              throw new Error(`${label}: expected exactly one match in ${file}, found ${matches}`);
            }
            fs.writeFileSync(file, source.replace(before, after));
          }

          const newOrder = 'artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx';
          replaceOnce(
            newOrder,
            `import {\n  calculateFinancialOpsOrder,\n  createFinancialOpsOrder,\n  type FinancialOpsOrderInput,\n} from "../../lib/orderFinancialOperations";\nimport { calculateOrderFinancials, orderFinancialValidation } from "../../lib/orderFinancials";`,
            `import {\n  calculateFinancialOpsOrder,\n  createFinancialOpsOrder,\n  effectiveDeliveryFeeMode,\n  type FinancialOpsOrderInput,\n} from "../../lib/orderFinancialOperations";\nimport { orderFinancialValidation } from "../../lib/orderFinancials";`,
            'central financial import',
          );
          replaceOnce(
            newOrder,
            `function merchantSettlement(value: number, isArabic: boolean) {\n  if (value < 0) {\n    return {\n      label: isArabic ? "مستحق على التاجر" : "Due from merchant",\n      amount: Math.abs(value),\n    };\n  }\n  return {\n    label: isArabic ? "مستحق للتاجر" : "Due to merchant",\n    amount: value,\n  };\n}`,
            `function merchantSettlement(value: number, isArabic: boolean) {\n  return value < 0\n    ? {\n        label: isArabic ? "على التاجر" : "Merchant debit",\n        amount: value,\n      }\n    : {\n        label: isArabic ? "للتاجر" : "Due to merchant",\n        amount: value,\n      };\n}`,
            'signed merchant settlement',
          );
          replaceOnce(
            newOrder,
            `  const authoritativeDeliveryFeeMode =\n    form.payment_method === "merchant_pays" || form.payment_method === "sender_pays"\n      ? "deduct_from_merchant"\n      : form.delivery_fee_mode;\n  const financials = useMemo(() => {\n    try {\n      return calculateOrderFinancials({\n        goodsValue: form.goods_value,\n        deliveryFee: pricing.total,\n        discountAmount: form.discount_amount,\n        deliveryFeeMode: authoritativeDeliveryFeeMode,\n      });\n    } catch {\n      return null;\n    }\n  }, [form.goods_value, form.discount_amount, authoritativeDeliveryFeeMode, pricing.total]);`,
            `  const authoritativeDeliveryFeeMode = effectiveDeliveryFeeMode({\n    ...form,\n    merchant: selectedMerchant,\n  });\n  const financials = useMemo(() => {\n    try {\n      return calculateFinancialOpsOrder({\n        ...form,\n        merchant: selectedMerchant,\n      });\n    } catch {\n      return null;\n    }\n  }, [form, selectedMerchant]);`,
            'live calculation matches save path',
          );
          replaceOnce(
            newOrder,
            `<form data-admin-new-order-form="merchant" onSubmit={submit} className="rounded-[2rem] border border-brand-sky/20 bg-white/[0.045] p-5 shadow-2xl shadow-black/20" dir={isArabic ? "rtl" : "ltr"}>`,
            `<form data-admin-new-order-form="merchant" autoComplete="off" onSubmit={submit} className="rounded-[2rem] border border-brand-sky/20 bg-white/[0.045] p-5 shadow-2xl shadow-black/20" dir={isArabic ? "rtl" : "ltr"}>`,
            'disable form autocomplete',
          );
          replaceOnce(
            newOrder,
            `<input type="number" min={0} step="0.01" value={form.goods_value} onChange={(event) => setField("goods_value", event.target.value)} placeholder="100.00" className={inputClass()} required />`,
            `<input type="number" min={0} step="0.01" name={\`dn_goods_value_${intakeKey}\`} autoComplete="off" aria-autocomplete="none" inputMode="decimal" data-form-type="other" value={form.goods_value} onChange={(event) => setField("goods_value", event.target.value)} placeholder="100.00" className={inputClass()} required />`,
            'disable goods history suggestions',
          );
          replaceOnce(
            newOrder,
            `{financials && <div className="mt-4 rounded-2xl border border-white/10 bg-black/10 p-4"><span className="block text-white/45">{isArabic ? "الإجمالي النهائي المطلوب" : "Final customer total"}</span><strong className="mt-1 block text-3xl font-black text-brand-gold" dir="ltr">{financials.customerTotal.toFixed(2)} AED</strong></div>}`,
            `{financials && (\n              <div className="mt-4 rounded-2xl border border-white/10 bg-black/10 p-4">\n                <span className="block text-white/45">\n                  {financials.merchantDue < 0\n                    ? isArabic\n                      ? "الإجمالي على التاجر"\n                      : "Merchant account total"\n                    : isArabic\n                      ? "الإجمالي النهائي المطلوب من العميل"\n                      : "Final customer total"}\n                </span>\n                <strong className="mt-1 block text-3xl font-black text-brand-gold" dir="ltr">\n                  {formatAdminMoney(\n                    financials.merchantDue < 0 ? financials.merchantDue : financials.customerTotal,\n                    isArabic,\n                  )}\n                </strong>\n                {financials.merchantDue < 0 && (\n                  <small className="mt-2 block leading-6 text-white/50">\n                    {isArabic\n                      ? \`المطلوب من العميل ${formatAdminMoney(financials.customerTotal, true)} — رسوم التوصيل ${formatAdminMoney(financials.deliveryFee, true)} على التاجر\`\n                      : \`Customer total ${formatAdminMoney(financials.customerTotal, false)} — delivery ${formatAdminMoney(financials.deliveryFee, false)} charged to merchant\`}\n                  </small>\n                )}\n              </div>\n            )}`,
            'signed final total',
          );

          const accounts = 'artifacts/day-night-delivery/src/components/admin/AdminMerchantAccountsCenter.tsx';
          replaceOnce(
            accounts,
            `<p className="mt-3 rounded-xl bg-white/5 px-3 py-2 text-[10px] font-black text-white/55">{due < 0 ? (isArabic ? "مستحق على التاجر" : "Due from merchant") : (isArabic ? "مستحق للتاجر" : "Due to merchant")}: <b className="text-brand-gold" dir="ltr">{money(Math.abs(due), isArabic)}</b></p>`,
            `<p className="mt-3 rounded-xl bg-white/5 px-3 py-2 text-[10px] font-black text-white/55">{due < 0 ? (isArabic ? "على التاجر" : "Merchant debit") : (isArabic ? "للتاجر" : "Due to merchant")}: <b className="text-brand-gold" dir="ltr">{money(due, isArabic)}</b></p>`,
            'merchant directory signed balance',
          );
          replaceOnce(
            accounts,
            `<article className="rounded-2xl border border-brand-gold/25 bg-brand-gold/[0.07] p-4"><span className="text-[10px] font-black text-brand-gold/70">{merchantDue < 0 ? (isArabic ? "مستحق على التاجر" : "Due from merchant") : (isArabic ? "مستحق للتاجر" : "Due to merchant")}</span><strong className="mt-2 block text-sm text-brand-gold" dir="ltr">{money(Math.abs(merchantDue), isArabic)}</strong></article>`,
            `<article className="rounded-2xl border border-brand-gold/25 bg-brand-gold/[0.07] p-4"><span className="text-[10px] font-black text-brand-gold/70">{merchantDue < 0 ? (isArabic ? "على التاجر" : "Merchant debit") : (isArabic ? "للتاجر" : "Due to merchant")}</span><strong className="mt-2 block text-sm text-brand-gold" dir="ltr">{money(merchantDue, isArabic)}</strong></article>`,
            'merchant account signed balance',
          );

          const statement = 'artifacts/day-night-delivery/src/lib/merchantStatementExport.ts';
          replaceOnce(
            statement,
            `function merchantSettlement(value: number, language: MerchantStatementLanguage) {\n  if (value < 0) {\n    return language === "ar"\n      ? \`على التاجر ${money(Math.abs(value), language)}\`\n      : \`Due from merchant ${money(Math.abs(value), language)}\`;\n  }\n  return language === "ar"\n    ? \`للتاجر ${money(value, language)}\`\n    : \`Due to merchant ${money(value, language)}\`;\n}`,
            `function merchantSettlement(value: number, language: MerchantStatementLanguage) {\n  if (value < 0) {\n    return language === "ar"\n      ? \`على التاجر ${money(value, language)}\`\n      : \`Merchant debit ${money(value, language)}\`;\n  }\n  return language === "ar"\n    ? \`للتاجر ${money(value, language)}\`\n    : \`Due to merchant ${money(value, language)}\`;\n}`,
            'statement preserves negative sign',
          );

          const delivered = 'artifacts/day-night-delivery/src/components/admin/AdminDeliveredFinancialAdjustment.tsx';
          replaceOnce(
            delivered,
            `<b className="mt-1 block text-base" dir="ltr">{Math.abs(value).toFixed(2)} AED</b>`,
            `<b className="mt-1 block text-base" dir="ltr">{value.toFixed(2)} AED</b>`,
            'delivered adjustment signed metric',
          );
          replaceOnce(
            delivered,
            `<input type="number" min={0} step="0.01" value={goodsValue} onChange={(event) => setGoodsValue(event.target.value)} className={inputClass} dir="ltr" />`,
            `<input type="number" min={0} step="0.01" name="dn_delivered_goods_value" autoComplete="off" aria-autocomplete="none" inputMode="decimal" data-form-type="other" value={goodsValue} onChange={(event) => setGoodsValue(event.target.value)} className={inputClass} dir="ltr" />`,
            'delivered goods autocomplete',
          );
          replaceOnce(
            delivered,
            `<MoneyMetric label={preview.merchantDue < 0 ? (isArabic ? "مستحق على التاجر" : "Due from merchant") : (isArabic ? "مستحق للتاجر" : "Due to merchant")} value={preview.merchantDue} />`,
            `<MoneyMetric label={preview.merchantDue < 0 ? (isArabic ? "على التاجر" : "Merchant debit") : (isArabic ? "للتاجر" : "Due to merchant")} value={preview.merchantDue} />`,
            'delivered settlement label',
          );

          const operations = 'artifacts/day-night-delivery/src/lib/orderFinancialOperations.ts';
          replaceOnce(
            operations,
            `  const settlementLine =\n    financials.merchantDue <= 0\n      ? \`Due from merchant ${Math.abs(financials.merchantDue).toFixed(2)} AED\`\n      : \`Merchant net ${financials.merchantDue.toFixed(2)} AED\`;`,
            `  const settlementLine =\n    financials.merchantDue < 0\n      ? \`Merchant debit ${financials.merchantDue.toFixed(2)} AED\`\n      : \`Merchant net ${financials.merchantDue.toFixed(2)} AED\`;`,
            'finance note signed settlement',
          );

          const gate = `import fs from "node:fs";\n\nconst read = (path) => fs.readFileSync(path, "utf8");\nconst newOrder = read("artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx");\nconst accounts = read("artifacts/day-night-delivery/src/components/admin/AdminMerchantAccountsCenter.tsx");\nconst statement = read("artifacts/day-night-delivery/src/lib/merchantStatementExport.ts");\nconst delivered = read("artifacts/day-night-delivery/src/components/admin/AdminDeliveredFinancialAdjustment.tsx");\n\nconst checks = [\n  [newOrder.includes("effectiveDeliveryFeeMode"), "new order uses canonical fee owner"],\n  [newOrder.includes("return calculateFinancialOpsOrder"), "live preview uses save calculator"],\n  [newOrder.includes('label: isArabic ? "على التاجر"'), "new order merchant label"],\n  [newOrder.includes("amount: value"), "new order keeps signed value"],\n  [newOrder.includes('autoComplete="off"'), "financial autocomplete disabled"],\n  [newOrder.includes('financials.merchantDue < 0 ? financials.merchantDue : financials.customerTotal'), "final total shows merchant debit"],\n  [!accounts.includes("money(Math.abs(due)"), "directory no longer hides sign"],\n  [!accounts.includes("money(Math.abs(merchantDue)"), "account summary no longer hides sign"],\n  [!statement.includes("money(Math.abs(value), language)"), "statement no longer hides sign"],\n  [!delivered.includes("Math.abs(value).toFixed"), "delivered adjustment no longer hides sign"],\n];\n\nfor (const [ok, label] of checks) {\n  if (!ok) throw new Error(\`merchant-negative-ui gate failed: ${label}\`);\n}\n\nconsole.log("merchant-negative-ui gate: PASS");\nconsole.log("goods=0, delivery=25, merchant pays => customer=0, merchant=-25, company=25");\n`;
          fs.writeFileSync('artifacts/day-night-delivery/scripts/merchant-negative-ui-gate.mjs', gate);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify signed UI gate
        run: node artifacts/day-night-delivery/scripts/merchant-negative-ui-gate.mjs

      - name: Build Admin application
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT Automation"
          git config user.email "actions@daynightae.com"
          git add \
            artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx \
            artifacts/day-night-delivery/src/components/admin/AdminMerchantAccountsCenter.tsx \
            artifacts/day-night-delivery/src/components/admin/AdminDeliveredFinancialAdjustment.tsx \
            artifacts/day-night-delivery/src/lib/merchantStatementExport.ts \
            artifacts/day-night-delivery/src/lib/orderFinancialOperations.ts \
            artifacts/day-night-delivery/scripts/merchant-negative-ui-gate.mjs
          git diff --cached --check
          git commit -m "fix(admin): show signed merchant debit and disable goods autofill"
          git push origin HEAD:fix/merchant-negative-ui-20260805
