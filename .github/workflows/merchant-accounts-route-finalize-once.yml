name: Merchant Accounts Route Finalize Once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/merchant-accounts-route-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-statement-dispatch-tracking-20260802
          fetch-depth: 0

      - name: Connect exact merchant accounts route
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          complete_path = Path('artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspaceComplete.tsx')
          complete = complete_path.read_text(encoding='utf-8')

          import_anchor = 'import AdminFinanceOperationsCenter from "./AdminFinanceOperationsCenter";\n'
          route_import = 'import AdminMerchantAccountsRoute from "./AdminMerchantAccountsRoute";\n'
          assert import_anchor in complete
          if route_import not in complete:
              complete = complete.replace(import_anchor, import_anchor + route_import, 1)

          finance_anchor = '''  if (financeSections.has(id)) {
    return (
      <AdminFinanceOperationsCenter
'''
          accounts_route = '''  if (id === "accounts") {
    return (
      <AdminMerchantAccountsRoute
        isArabic={isArabic}
        orders={liveOrders}
        merchants={merchants}
        onRefresh={refresh}
        onNavigate={(target) => onNavigate?.(target as AdminSectionId)}
      />
    );
  }

'''
          assert finance_anchor in complete
          if accounts_route not in complete:
              complete = complete.replace(finance_anchor, accounts_route + finance_anchor, 1)
          complete_path.write_text(complete, encoding='utf-8')

          layer_path = Path('artifacts/day-night-delivery/src/components/admin/AdminOperationsLayer.tsx')
          layer = layer_path.read_text(encoding='utf-8')

          layer_import_anchor = 'import AdminFinanceOperationsCenter from "./AdminFinanceOperationsCenter";\n'
          assert layer_import_anchor in layer
          if route_import not in layer:
              layer = layer.replace(layer_import_anchor, layer_import_anchor + route_import, 1)

          layer_finance_anchor = '  if (isFinanceSection(id)) return <AdminFinanceOperationsCenter'
          layer_accounts_route = '  if (id === "accounts") return <AdminMerchantAccountsRoute isArabic={isArabic} orders={orders} merchants={merchants} onRefresh={onRefresh} onNavigate={(target) => { if (isFinanceSection(target)) setFinanceSection(target); }} />;\n'
          assert layer_finance_anchor in layer
          if layer_accounts_route not in layer:
              layer = layer.replace(layer_finance_anchor, layer_accounts_route + layer_finance_anchor, 1)
          layer_path.write_text(layer, encoding='utf-8')
          PY

      - name: Verify isolated routing
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'if (id === "accounts")' artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspaceComplete.tsx
          grep -F 'AdminMerchantAccountsRoute' artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspaceComplete.tsx
          grep -F 'if (id === "accounts") return <AdminMerchantAccountsRoute' artifacts/day-night-delivery/src/components/admin/AdminOperationsLayer.tsx

      - name: Remove one-time workflow and push final route
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/merchant-accounts-route-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/day-night-delivery/src/components/admin/AdminSectionWorkspaceComplete.tsx \
                  artifacts/day-night-delivery/src/components/admin/AdminOperationsLayer.tsx \
                  .github/workflows/merchant-accounts-route-finalize-once.yml
          git commit -m "feat(finance): route accounts into isolated merchant files"
          git push origin HEAD:feat/merchant-statement-dispatch-tracking-20260802
