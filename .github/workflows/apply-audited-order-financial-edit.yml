name: Apply Audited Order Financial Edit

on:
  push:
    branches:
      - fix/audited-delivered-order-financial-edit
    paths:
      - .github/workflows/apply-audited-order-financial-edit.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audited-delivered-order-financial-edit
          fetch-depth: 0

      - name: Patch live editor and production gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing expected block for {label} in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched: {label}")

          modal = "artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx"
          replace(
              modal,
              'import { PERSONAL_ORDER_DELIVERY_FEE, calculatePersonalOrderFinancials } from "../../lib/personalOrderOperations";\n',
              'import { PERSONAL_ORDER_DELIVERY_FEE, calculatePersonalOrderFinancials } from "../../lib/personalOrderOperations";\nimport AdminDeliveredFinancialAdjustment from "./AdminDeliveredFinancialAdjustment";\n',
              "delivered financial adjustment import",
          )
          replace(
              modal,
              '          <div className="grid gap-4 lg:grid-cols-2">',
              '          {financialLocked && (\n            <AdminDeliveredFinancialAdjustment\n              order={currentOrder}\n              isArabic={isArabic}\n              onSaved={onSaved}\n            />\n          )}\n\n          <div className="grid gap-4 lg:grid-cols-2">',
              "delivered financial adjustment panel",
          )

          package = "artifacts/day-night-delivery/package.json"
          replace(
              package,
              '    "biometric-security:gate": "node scripts/biometric-security-gate.mjs",\n',
              '    "biometric-security:gate": "node scripts/biometric-security-gate.mjs",\n    "delivered-financial-adjustment:gate": "node scripts/delivered-financial-adjustment-gate.mjs",\n',
              "financial adjustment script",
          )
          replace(
              package,
              'node scripts/multi-party-ratings-production-gate.mjs && node scripts/personal-orders-admin-gate.mjs',
              'node scripts/multi-party-ratings-production-gate.mjs && node scripts/delivered-financial-adjustment-gate.mjs && node scripts/personal-orders-admin-gate.mjs',
              "financial adjustment production gate",
          )

          Path(".github/workflows/apply-audited-order-financial-edit.yml").unlink()
          PY

      - name: Commit integrated repair
        shell: bash
        run: |
          git config user.name "DAY NIGHT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mount audited delivered-order financial correction"
          git push origin HEAD:fix/audited-delivered-order-financial-edit
