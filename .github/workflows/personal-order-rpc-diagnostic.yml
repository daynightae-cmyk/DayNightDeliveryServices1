name: Personal Order RPC Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/personal-order-rpc-diagnostic.mjs"
      - ".github/workflows/personal-order-rpc-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-order-rpc-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-rpc:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate protected production target
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"

      - name: Install Supabase client
        run: pnpm install --frozen-lockfile

      - name: Diagnose real authenticated personal-order RPC and clean test data
        run: node .github/scripts/personal-order-rpc-diagnostic.mjs
