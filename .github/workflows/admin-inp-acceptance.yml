name: Phase 4 Admin INP Acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-inp-acceptance.yml
      - artifacts/day-night-delivery/scripts/admin-performance-acceptance.mjs
      - artifacts/day-night-delivery/scripts/admin-performance-geometry-diagnostic.mjs
      - artifacts/day-night-delivery/scripts/wait-for-admin-performance-deployment.mjs
      - artifacts/day-night-delivery/src/main.tsx
      - artifacts/day-night-delivery/src/components/AdminPanelLuxury.tsx
      - artifacts/day-night-delivery/src/components/admin/**
      - artifacts/day-night-delivery/src/hooks/useAdminInteractionPerformanceBudget.ts
      - artifacts/day-night-delivery/src/hooks/useAdminFormKeyboardNavigation.ts
      - artifacts/day-night-delivery/src/styles/dn-admin-**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/admin-inp-acceptance.yml
      - artifacts/day-night-delivery/scripts/admin-performance-acceptance.mjs
      - artifacts/day-night-delivery/scripts/admin-performance-geometry-diagnostic.mjs
      - artifacts/day-night-delivery/scripts/wait-for-admin-performance-deployment.mjs
      - artifacts/day-night-delivery/src/main.tsx
      - artifacts/day-night-delivery/src/components/AdminPanelLuxury.tsx
      - artifacts/day-night-delivery/src/components/admin/**
      - artifacts/day-night-delivery/src/hooks/useAdminInteractionPerformanceBudget.ts
      - artifacts/day-night-delivery/src/hooks/useAdminFormKeyboardNavigation.ts
      - artifacts/day-night-delivery/src/styles/dn-admin-**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: phase-4-admin-inp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-harness:
    name: Validate Chrome acceptance harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate acceptance scripts
        run: |
          node --check artifacts/day-night-delivery/scripts/admin-performance-acceptance.mjs
          node --check artifacts/day-night-delivery/scripts/admin-performance-geometry-diagnostic.mjs
          node --check artifacts/day-night-delivery/scripts/wait-for-admin-performance-deployment.mjs

      - name: Verify static admin performance guardrails
        run: |
          set -euo pipefail
          grep -Fq 'ADMIN_INP_BUDGET_MS = 200' artifacts/day-night-delivery/src/hooks/useAdminInteractionPerformanceBudget.ts
          grep -Fq 'dn-admin-inp-sample' artifacts/day-night-delivery/src/hooks/useAdminInteractionPerformanceBudget.ts
          grep -Fq '.dn-admin-fullscreen' artifacts/day-night-delivery/src/hooks/useAdminFormKeyboardNavigation.ts
          ! grep -Eq 'observe\(document\.(body|documentElement)' artifacts/day-night-delivery/src/hooks/useAdminManagerIdentity.ts
          grep -Fq 'phase4-20260730-3' artifacts/day-night-delivery/src/styles/dn-admin-inp-acceptance.css
          grep -Fq 'dn-admin-inp-acceptance.css' artifacts/day-night-delivery/src/main.tsx
          grep -Fq 'admin-performance-geometry-diagnostic.mjs' .github/workflows/admin-inp-acceptance.yml
          grep -Fq 'issues: write' .github/workflows/admin-inp-acceptance.yml

  production-profile:
    name: Production desktop and Android INP evidence
    needs: validate-harness
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-runtime-tests
    env:
      ADMIN_PERFORMANCE_BASE_URL: https://daynightae.com
      ADMIN_PERFORMANCE_OUTPUT_DIR: artifacts/day-night-delivery/admin-performance-evidence
      ADMIN_PERFORMANCE_DEPLOYMENT_MARKER: phase4-20260730-3
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify protected acceptance inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing protected performance inputs: %s\n' "${missing[*]}" >&2
            exit 2
          fi

      - name: Wait for verified Vercel production release
        run: node artifacts/day-night-delivery/scripts/wait-for-admin-performance-deployment.mjs

      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/day-night-playwright"
          mkdir -p "$runner"
          cd "$runner"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_RUNNER_DIR=$runner" >> "$GITHUB_ENV"

      - name: Capture protected admin geometry
        id: geometry
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/day-night-delivery/admin-performance-evidence
          node artifacts/day-night-delivery/scripts/admin-performance-geometry-diagnostic.mjs 2>&1 \
            | tee artifacts/day-night-delivery/admin-performance-evidence/geometry.log

      - name: Record production admin Chrome traces
        id: performance
        shell: bash
        run: |
          set -o pipefail
          node artifacts/day-night-delivery/scripts/admin-performance-acceptance.mjs 2>&1 \
            | tee artifacts/day-night-delivery/admin-performance-evidence/workflow.log

      - name: Upload sanitized performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-Admin-INP-Acceptance
          path: artifacts/day-night-delivery/admin-performance-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Publish acceptance summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/day-night-delivery/admin-performance-evidence/admin-performance-summary.md ]; then
            cat artifacts/day-night-delivery/admin-performance-evidence/admin-performance-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Admin performance summary was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/day-night-delivery/admin-performance-evidence/admin-performance-geometry.json ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Geometry diagnostic was captured in the protected artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report protected acceptance to Issue 268
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GEOMETRY_OUTCOME: ${{ steps.geometry.outcome }}
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/issue-268-performance-report.md"
          {
            echo '## Phase 4 production Chrome acceptance run'
            echo
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Protected geometry stage: **${GEOMETRY_OUTCOME:-not-run}**"
            echo "- Protected Chrome stage: **${PERFORMANCE_OUTCOME:-not-run}**"
            echo '- Evidence artifact: `DAY-NIGHT-Admin-INP-Acceptance` (30-day retention)'
            echo '- Secrets, authentication sessions, customer PII, and raw production payloads are excluded.'
            echo
            if [ -f artifacts/day-night-delivery/admin-performance-evidence/admin-performance-summary.md ]; then
              cat artifacts/day-night-delivery/admin-performance-evidence/admin-performance-summary.md
            elif [ -f artifacts/day-night-delivery/admin-performance-evidence/admin-performance-geometry.json ]; then
              node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const payload = JSON.parse(fs.readFileSync('artifacts/day-night-delivery/admin-performance-evidence/admin-performance-geometry.json', 'utf8'));
              const before = payload.beforeScrollIntoView || {};
              const after = payload.afterScrollIntoView || {};
              const item = before.ancestors?.[0] || {};
              const itemAfter = after.ancestors?.[0] || {};
              console.log('### Geometry diagnostic');
              console.log(`- Viewport: \`${before.viewport?.innerWidth || 0}×${before.viewport?.innerHeight || 0}\``);
              console.log(`- Before rect: \`${JSON.stringify(item.rect || {})}\``);
              console.log(`- After scroll rect: \`${JSON.stringify(itemAfter.rect || {})}\``);
              console.log(`- Before intersection: \`${JSON.stringify(before.insideViewport || {})}\``);
              console.log(`- After intersection: \`${JSON.stringify(after.insideViewport || {})}\``);
              console.log('- Full ancestor geometry and redacted screenshot are stored in the protected artifact.');
              NODE
            else
              echo 'Neither a structured performance summary nor geometry diagnostic was produced; inspect the linked workflow.'
            fi
          } > "$report"
          gh issue comment 268 --repo "$GITHUB_REPOSITORY" --body-file "$report"
