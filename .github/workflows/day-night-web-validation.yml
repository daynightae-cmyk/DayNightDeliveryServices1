name: DAY NIGHT Web Validation

on:
  push:
    branches: [main]
    paths:
      - "artifacts/day-night-delivery/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/day-night-web-validation.yml"
  workflow_dispatch:

concurrency:
  group: day-night-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm run web:typecheck

      - name: Production gates
        run: pnpm run web:gate

      - name: Production build
        run: pnpm run web:build
