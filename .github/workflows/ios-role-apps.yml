name: iOS Role Apps v1.2.0

on:
  push:
    branches: [main]
    paths:
      - "ios-role-shell/**"
      - "android-role-shell/app/src/driver/res/drawable-nodpi/app_icon.png"
      - "android-role-shell/app/src/merchant/res/drawable-nodpi/app_icon.png"
      - "artifacts/day-night-delivery/**"
      - ".github/workflows/ios-role-apps.yml"
  pull_request:
    paths:
      - "ios-role-shell/**"
      - "android-role-shell/app/src/driver/res/drawable-nodpi/app_icon.png"
      - "android-role-shell/app/src/merchant/res/drawable-nodpi/app_icon.png"
      - "artifacts/day-night-delivery/**"
      - ".github/workflows/ios-role-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-role-apps-v120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-role-apps:
    name: Build Driver and Merchant iOS v1.2.0
    runs-on: macos-15
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and icon tooling
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 -m venv ios-role-shell/.venv
          ios-role-shell/.venv/bin/pip install --disable-pip-version-check "pillow>=10,<13"
          ios-role-shell/.venv/bin/python ios-role-shell/scripts/prepare_icons.py

      - name: Validate iOS source contract
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ios-role-shell/Config/Driver-Info.plist
          plutil -lint ios-role-shell/Config/Merchant-Info.plist
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER: com.daynightae.driver' ios-role-shell/project.yml
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER: com.daynightae.merchant' ios-role-shell/project.yml
          grep -F 'daynight_driver_biometric_session_v1' ios-role-shell/Sources/DayNightApp.swift
          grep -F 'daynight_merchant_biometric_session_v1' ios-role-shell/Sources/DayNightApp.swift
          grep -F 'kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly' ios-role-shell/Sources/SecureBiometricStore.swift
          grep -F '.userPresence' ios-role-shell/Sources/SecureBiometricStore.swift
          grep -F 'window.DAYNIGHT_BIOMETRIC' ios-role-shell/Sources/RoleWebViewController.swift
          if grep -R -E 'print\(|NSLog\(' ios-role-shell/Sources; then
            echo 'Native iOS security code must not log session material.'
            exit 1
          fi

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec ios-role-shell/project.yml
          test -d ios-role-shell/DayNightRoleApps.xcodeproj
          xcodebuild -project ios-role-shell/DayNightRoleApps.xcodeproj -list

      - name: Build Driver for iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-role-shell/DayNightRoleApps.xcodeproj \
            -scheme DayNightDriver \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-role-shell/build/driver-simulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee ios-role-shell/driver-simulator-build.log

      - name: Build Merchant for iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-role-shell/DayNightRoleApps.xcodeproj \
            -scheme DayNightMerchant \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-role-shell/build/merchant-simulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee ios-role-shell/merchant-simulator-build.log

      - name: Build unsigned Driver for physical iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-role-shell/DayNightRoleApps.xcodeproj \
            -scheme DayNightDriver \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-role-shell/build/driver-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build | tee ios-role-shell/driver-device-build.log

      - name: Build unsigned Merchant for physical iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-role-shell/DayNightRoleApps.xcodeproj \
            -scheme DayNightMerchant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-role-shell/build/merchant-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build | tee ios-role-shell/merchant-device-build.log

      - name: Verify and package simulator applications and unsigned IPA files
        shell: bash
        run: |
          set -euo pipefail
          DIST="ios-role-shell/dist-v120"
          mkdir -p "$DIST"

          DRIVER_SIM_APP="$(find ios-role-shell/build/driver-simulator/Build/Products -type d -name 'DAY NIGHT Driver.app' | head -n 1)"
          MERCHANT_SIM_APP="$(find ios-role-shell/build/merchant-simulator/Build/Products -type d -name 'DAY NIGHT Merchant.app' | head -n 1)"
          DRIVER_DEVICE_APP="$(find ios-role-shell/build/driver-device/Build/Products -type d -name 'DAY NIGHT Driver.app' | head -n 1)"
          MERCHANT_DEVICE_APP="$(find ios-role-shell/build/merchant-device/Build/Products -type d -name 'DAY NIGHT Merchant.app' | head -n 1)"

          test -d "$DRIVER_SIM_APP"
          test -d "$MERCHANT_SIM_APP"
          test -d "$DRIVER_DEVICE_APP"
          test -d "$MERCHANT_DEVICE_APP"

          test "$(plutil -extract CFBundleIdentifier raw "$DRIVER_DEVICE_APP/Info.plist")" = "com.daynightae.driver"
          test "$(plutil -extract CFBundleIdentifier raw "$MERCHANT_DEVICE_APP/Info.plist")" = "com.daynightae.merchant"
          test "$(plutil -extract CFBundleShortVersionString raw "$DRIVER_DEVICE_APP/Info.plist")" = "1.2.0"
          test "$(plutil -extract CFBundleShortVersionString raw "$MERCHANT_DEVICE_APP/Info.plist")" = "1.2.0"

          DRIVER_EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$DRIVER_DEVICE_APP/Info.plist")"
          MERCHANT_EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$MERCHANT_DEVICE_APP/Info.plist")"
          file "$DRIVER_DEVICE_APP/$DRIVER_EXECUTABLE" | tee "$DIST/driver-device-binary.txt"
          file "$MERCHANT_DEVICE_APP/$MERCHANT_EXECUTABLE" | tee "$DIST/merchant-device-binary.txt"
          grep -E 'arm64|Mach-O 64-bit' "$DIST/driver-device-binary.txt"
          grep -E 'arm64|Mach-O 64-bit' "$DIST/merchant-device-binary.txt"

          ditto -c -k --sequesterRsrc --keepParent "$DRIVER_SIM_APP" "$DIST/DAY-NIGHT-Driver-v1.2.0-iOS-Simulator.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$MERCHANT_SIM_APP" "$DIST/DAY-NIGHT-Merchant-v1.2.0-iOS-Simulator.app.zip"

          rm -rf "$DIST/driver-payload" "$DIST/merchant-payload"
          mkdir -p "$DIST/driver-payload/Payload" "$DIST/merchant-payload/Payload"
          ditto "$DRIVER_DEVICE_APP" "$DIST/driver-payload/Payload/DAY NIGHT Driver.app"
          ditto "$MERCHANT_DEVICE_APP" "$DIST/merchant-payload/Payload/DAY NIGHT Merchant.app"
          (cd "$DIST/driver-payload" && zip -qry "../DAY-NIGHT-Driver-v1.2.0-unsigned.ipa" Payload)
          (cd "$DIST/merchant-payload" && zip -qry "../DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa" Payload)

          test -s "$DIST/DAY-NIGHT-Driver-v1.2.0-unsigned.ipa"
          test -s "$DIST/DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa"
          unzip -l "$DIST/DAY-NIGHT-Driver-v1.2.0-unsigned.ipa" | grep -F 'Payload/DAY NIGHT Driver.app/Info.plist'
          unzip -l "$DIST/DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa" | grep -F 'Payload/DAY NIGHT Merchant.app/Info.plist'

          (cd "$DIST" && shasum -a 256 DAY-NIGHT-Driver-v1.2.0-unsigned.ipa > DAY-NIGHT-Driver-v1.2.0-unsigned.ipa.sha256)
          (cd "$DIST" && shasum -a 256 DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa > DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa.sha256)
          (cd "$DIST" && zip -9 DAY-NIGHT-iOS-Apps-v1.2.0-UNSIGNED-IPA.zip \
            DAY-NIGHT-Driver-v1.2.0-unsigned.ipa DAY-NIGHT-Driver-v1.2.0-unsigned.ipa.sha256 \
            DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa.sha256 \
            driver-device-binary.txt merchant-device-binary.txt)

      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-iOS-v1.2.0-Build-Diagnostic
          path: |
            ios-role-shell/driver-simulator-build.log
            ios-role-shell/merchant-simulator-build.log
            ios-role-shell/driver-device-build.log
            ios-role-shell/merchant-device-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Driver unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-Driver-iOS-v1.2.0-Unsigned-IPA
          path: |
            ios-role-shell/dist-v120/DAY-NIGHT-Driver-v1.2.0-unsigned.ipa
            ios-role-shell/dist-v120/DAY-NIGHT-Driver-v1.2.0-unsigned.ipa.sha256
            ios-role-shell/dist-v120/driver-device-binary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Merchant unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-Merchant-iOS-v1.2.0-Unsigned-IPA
          path: |
            ios-role-shell/dist-v120/DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa
            ios-role-shell/dist-v120/DAY-NIGHT-Merchant-v1.2.0-unsigned.ipa.sha256
            ios-role-shell/dist-v120/merchant-device-binary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete unsigned IPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-iOS-Apps-v1.2.0-UNSIGNED-IPA
          path: ios-role-shell/dist-v120/DAY-NIGHT-iOS-Apps-v1.2.0-UNSIGNED-IPA.zip
          if-no-files-found: error
          retention-days: 30
