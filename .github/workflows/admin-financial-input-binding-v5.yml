name: Admin Financial Input Binding V5

on:
  push:
    branches: [fix/admin-new-order-financial-input-binding-v5]
    paths:
      - .github/repairs/apply-admin-financial-input-binding-v5.py
      - .github/repairs/fix-admin-financial-gate-v5.py
      - .github/workflows/admin-financial-input-binding-v5.yml
      - artifacts/day-night-delivery/src/lib/adminNewOrderFinancialState.ts

permissions:
  contents: write

concurrency:
  group: admin-financial-input-binding-v5
  cancel-in-progress: false

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-new-order-financial-input-binding-v5
          fetch-depth: 0

      - name: Apply final source repair
        run: |
          python .github/repairs/apply-admin-financial-input-binding-v5.py
          python .github/repairs/fix-admin-financial-gate-v5.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Test interactive state reducer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import * as ts from 'typescript';

          const sourcePath = path.resolve('artifacts/day-night-delivery/src/lib/adminNewOrderFinancialState.ts');
          const outputPath = path.join(os.tmpdir(), `admin-financial-state-${process.pid}.mjs`);
          const output = ts.transpileModule(fs.readFileSync(sourcePath, 'utf8'), {
            compilerOptions: { module: ts.ModuleKind.ESNext, target: ts.ScriptTarget.ES2022 },
          }).outputText;
          fs.writeFileSync(outputPath, output, 'utf8');
          const { updateAdminFinancialField, selectAdminPriceMode } = await import(`${pathToFileURL(outputPath).href}?v=${Date.now()}`);

          let state = {
            goods_value: '',
            manual_delivery_price: '',
            discount_amount: '',
            price_mode: 'system',
            delivery_fee_mode: 'customer_pays',
            payment_method: 'cod',
          };

          state = updateAdminFinancialField(state, 'goods_value', '0');
          if (state.goods_value !== '0' || state.delivery_fee_mode !== 'deduct_from_merchant' || state.payment_method !== 'merchant_pays') {
            throw new Error(`goods zero did not atomically select merchant debit: ${JSON.stringify(state)}`);
          }
          console.log('INPUT 0 PASS: merchant debit selected immediately');

          state = updateAdminFinancialField(state, 'goods_value', '100');
          if (state.goods_value !== '100' || state.delivery_fee_mode !== 'deduct_from_merchant') {
            throw new Error(`goods 100 did not stay live in merchant mode: ${JSON.stringify(state)}`);
          }
          console.log('INPUT 100 PASS: live value preserved');

          state = selectAdminPriceMode(state, 'manual');
          state = updateAdminFinancialField(state, 'manual_delivery_price', '25');
          if (state.manual_delivery_price !== '25' || state.price_mode !== 'manual') {
            throw new Error(`manual 25 did not bind immediately: ${JSON.stringify(state)}`);
          }
          console.log('MANUAL 25 PASS: delivery input bound immediately');

          state = updateAdminFinancialField(state, 'goods_value', '10');
          if (state.goods_value !== '10') throw new Error('goods 10 was not stored');
          console.log('LIVE CHANGE PASS: 0 -> 100 -> 10');
          fs.rmSync(outputPath, { force: true });
          NODE

      - name: Run financial matrix and source gate
        run: |
          set -euo pipefail
          node artifacts/day-night-delivery/scripts/admin-new-order-live-financial-gate.mjs | tee /tmp/financial-v5.txt
          grep -Fq 'CASE 1 PASS: goods=0, fee=25, merchant, customer=0, merchant=-25' /tmp/financial-v5.txt
          grep -Fq 'CASE 2 PASS: goods=100, fee=25, merchant, customer=100, merchant=75' /tmp/financial-v5.txt
          grep -Fq 'CASE 3 PASS: goods=10, fee=25, merchant, customer=10, merchant=-15' /tmp/financial-v5.txt
          grep -Fq 'CASE 4 PASS: goods=100, fee=25, customer, customer=125, merchant=100' /tmp/financial-v5.txt
          grep -Fq 'LIVE CHANGE PASS' /tmp/financial-v5.txt
          grep -Fq 'SAVE/REOPEN PASS' /tmp/financial-v5.txt

      - name: TypeScript
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Production build
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Verify exact implementation
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'data-admin-financial-preview-version="5"' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx
          grep -Fq 'onInput={(event) => setFinancialField("goods_value", event.currentTarget.value)}' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx
          grep -Fq 'onInput={(event) => setFinancialField("manual_delivery_price", event.currentTarget.value)}' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx
          ! grep -Fq 'useEffect(' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx

      - name: Remove temporary repair automation
        run: |
          rm -f .github/repairs/apply-admin-financial-input-binding-v5.py
          rm -f .github/repairs/fix-admin-financial-gate-v5.py
          rm -f .github/workflows/admin-financial-input-binding-v5.yml

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name 'daynight-financial-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(admin): bind financial inputs directly to live preview'
          git push origin HEAD:fix/admin-new-order-financial-input-binding-v5
