name: Apply Final P1 Recovery Patch

# The workflow intentionally patches the existing internal branch, validates every
# replacement contract, commits the result, and deletes itself in the same commit.
on:
  push:
    branches: [runtime/issue-266-evidence]
    paths: [.github/workflows/p1-apply-final-recovery.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/issue-266-evidence
          fetch-depth: 0

      - name: Apply verified recovery changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cx = Path('artifacts/day-night-delivery/scripts/customer-experience-runtime-e2e.mjs')
          text = cx.read_text(encoding='utf-8')
          replacements = {
              '["out_for_delivery", "Temporary parcel out for delivery"],': '["in_transit", "Temporary parcel in transit"],',
              'return status === "accepted" ? ["accepted", "confirmed"].includes(actual) : status === "out_for_delivery" ? ["out_for_delivery", "in_transit"].includes(actual) : actual === status;': 'return status === "accepted" ? ["accepted", "confirmed"].includes(actual) : actual === status;',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Customer E2E replacement contract failed: {old}')
              text = text.replace(old, new)
          cx.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/p1-runtime-evidence.yml')
          text = workflow.read_text(encoding='utf-8')
          old_target = '            20260730130000_p1_direct_finance_backfill.sql\n'
          new_target = old_target + '            20260730133000_track17_recovery_health.sql\n'
          if text.count(old_target) != 1:
              raise SystemExit('Workflow migration target contract failed')
          text = text.replace(old_target, new_target)

          old_versions = '20260730101500 20260730114000 20260730130000; do'
          new_versions = '20260730101500 20260730114000 20260730130000 20260730133000; do'
          if text.count(old_versions) != 1:
              raise SystemExit('Workflow migration version contract failed')
          text = text.replace(old_versions, new_versions)

          old_runtime = '''          if (!quota.response.ok || quota.payload?.ok !== true) {
            console.error(`17TRACK quota refresh failed with HTTP ${quota.response.status}.`);
            process.exit(1);
          }
          console.log('Finance authority verified and 17TRACK quota refreshed.');'''
          new_runtime = '''          if (!quota.response.ok || quota.payload?.ok !== true) {
            console.error(`17TRACK quota refresh failed with HTTP ${quota.response.status}.`);
            process.exit(1);
          }

          const listing = await post('/functions/v1/track17-admin', { action: 'list', limit: 100 });
          if (!listing.response.ok || listing.payload?.ok !== true) {
            console.error(`17TRACK shipment listing failed with HTTP ${listing.response.status}.`);
            process.exit(1);
          }

          const activeShipments = (Array.isArray(listing.payload?.shipments) ? listing.payload.shipments : [])
            .filter((shipment) => !['delivered', 'expired'].includes(String(shipment?.normalized_status || '').toLowerCase()))
            .filter((shipment) => !shipment?.tracking_stopped_at);
          const recovery = [];
          for (const shipment of activeShipments) {
            const synced = await post('/functions/v1/sync-track17-shipment', {
              shipment_id: shipment.id,
              force: true,
            });
            recovery.push({
              ok: synced.payload?.ok === true,
              status: synced.response.status,
              code: synced.payload?.code || null,
            });
          }
          const recoveryProof = {
            active_shipments: activeShipments.length,
            successful_syncs: recovery.filter((item) => item.ok).length,
            failed_syncs: recovery.filter((item) => !item.ok).length,
            results: recovery,
          };
          fs.writeFileSync(`${root}/track17-recovery-sync.json`, JSON.stringify(recoveryProof, null, 2));
          if (recoveryProof.failed_syncs > 0) {
            console.error(`17TRACK recovery sync failed for ${recoveryProof.failed_syncs} active shipment(s).`);
            process.exit(1);
          }
          console.log('Finance authority verified; 17TRACK quota and active shipments refreshed.');'''
          if text.count(old_runtime) != 1:
              raise SystemExit('Workflow runtime recovery insertion contract failed')
          text = text.replace(old_runtime, new_runtime)
          workflow.write_text(text, encoding='utf-8')

          gate = Path('artifacts/day-night-delivery/scripts/p1-production-hardening-gate.mjs')
          text = gate.read_text(encoding='utf-8')
          marker = '''forbidText(directFinanceBackfill, "delete from", "direct finance backfill destructive delete");
forbidText(directFinanceBackfill, "truncate", "direct finance backfill destructive truncate");
'''
          addition = marker + '''
const track17RecoveryHealth = readRepo("supabase/migrations/20260730133000_track17_recovery_health.sql");
for (const contract of [
  "api_unresolved_errors_by_operation",
  "succeeded.tracking_number = failed.tracking_number",
  "shipment.last_synced_at",
  "shipment.last_webhook_at",
]) requireText(track17RecoveryHealth, contract, "17TRACK recovery health");
forbidText(track17RecoveryHealth, "delete from public.track17_api_logs", "17TRACK audit history deletion");

const syncTrack17 = readRepo("supabase/functions/sync-track17-shipment/index.ts");
requireText(syncTrack17, "const force = body.force === true", "admin recovery sync force contract");
requireText(syncTrack17, "shipment_id: shipmentId || null", "failed sync shipment identity");
'''
          if text.count(marker) != 1:
              raise SystemExit('P1 gate recovery insertion contract failed')
          text = text.replace(marker, addition)
          gate.write_text(text, encoding='utf-8')

          Path('.github/workflows/p1-apply-final-recovery.yml').unlink(missing_ok=True)
          PY

          grep -F '["in_transit", "Temporary parcel in transit"]' \
            artifacts/day-night-delivery/scripts/customer-experience-runtime-e2e.mjs
          grep -F '20260730133000_track17_recovery_health.sql' .github/workflows/p1-runtime-evidence.yml
          grep -F 'track17-recovery-sync.json' .github/workflows/p1-runtime-evidence.yml
          grep -F 'api_unresolved_errors_by_operation' artifacts/day-night-delivery/scripts/p1-production-hardening-gate.mjs

      - name: Commit clean final recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daynightae-cmyk'
          git config user.email 'daynightae-cmyk@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p1): recover tracking health and use canonical driver status'
          git push origin HEAD:runtime/issue-266-evidence
