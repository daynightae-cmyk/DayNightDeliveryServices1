name: Apply Admin Order Editor Staged Paint

on:
  push:
    branches:
      - perf/admin-order-editor-staged-paint-20260816
    paths:
      - .github/workflows/apply-admin-order-editor-staged-paint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/admin-order-editor-staged-paint-20260816
          fetch-depth: 0
      - name: Apply staged editor patch
        run: python .github/scripts/apply-admin-order-editor-staged-paint.py
      - name: Commit staged editor paint
        run: |
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "293348050+daynightae-cmyk@users.noreply.github.com"
          git add artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx
          git diff --cached --check
          git commit -m "perf(admin): stage heavy order editor after first paint"
          git push origin HEAD:perf/admin-order-editor-staged-paint-20260816
