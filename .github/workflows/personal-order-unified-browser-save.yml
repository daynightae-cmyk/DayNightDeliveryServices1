name: Unified Personal Order Browser Save
# Persists one real test order, verifies it, then removes it from production.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/personal-order-unified-browser-save.mjs"
      - ".github/workflows/personal-order-unified-browser-save.yml"
      - "artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx"
      - "artifacts/day-night-delivery/src/components/admin/AdminPersonalOrderForm.tsx"
      - "artifacts/day-night-delivery/src/components/AdminPanelLuxury.tsx"
      - "artifacts/day-night-delivery/src/components/admin/command-center/AdminPanelCommandCenter.tsx"
      - "artifacts/day-night-delivery/src/lib/personalOrderOperations.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-personal-order-browser-save-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-save-and-cleanup:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-runtime-tests
    env:
      TEST_BASE_URL: http://127.0.0.1:4173
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate protected runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"

      - name: Install dependencies and build exact PR head
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/day-night-delivery run personal-orders:gate
          pnpm --dir artifacts/day-night-delivery run typecheck
          pnpm --dir artifacts/day-night-delivery run build
          test -s artifacts/day-night-delivery/dist/public/index.html
          mkdir -p personal-order-browser-evidence
          nohup pnpm --dir artifacts/day-night-delivery exec vite preview --host 127.0.0.1 --port 4173 --strictPort > personal-order-browser-evidence/local-web.log 2>&1 &
          echo $! > personal-order-browser-evidence/local-web.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$TEST_BASE_URL/auth?nosplash=1" | grep -F 'id="root"' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat personal-order-browser-evidence/local-web.log >&2
          exit 1

      - name: Install isolated Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          playwright_dir="$RUNNER_TEMP/daynight-personal-order-playwright"
          rm -rf "$playwright_dir"
          mkdir -p "$playwright_dir"
          cd "$playwright_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_NODE_PATH=$playwright_dir/node_modules" >> "$GITHUB_ENV"

      - name: Create, verify, display, and clean a real personal order
        run: node .github/scripts/personal-order-unified-browser-save.mjs

      - name: Stop local application
        if: always()
        shell: bash
        run: |
          if [ -f personal-order-browser-evidence/local-web.pid ]; then
            kill "$(cat personal-order-browser-evidence/local-web.pid)" 2>/dev/null || true
          fi

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-Unified-Personal-Order-Evidence
          path: personal-order-browser-evidence/
          if-no-files-found: warn
          retention-days: 30
