name: Finalize Admin Order Delete and Edit Flexibility

on:
  push:
    branches:
      - fix/admin-order-delete-edit-flexibility-20260804
    paths:
      - ".github/scripts/finalize-admin-order-delete-edit-flexibility.mjs"
      - ".github/workflows/finalize-admin-order-delete-edit-flexibility.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/finalize-admin-order-delete-edit-flexibility.mjs"
      - ".github/workflows/finalize-admin-order-delete-edit-flexibility.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-admin-order-delete-edit-flexibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-order-delete-edit-flexibility-20260804
          fetch-depth: 0

      - name: Apply focused implementation
        run: node .github/scripts/finalize-admin-order-delete-edit-flexibility.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify flexible delete and automatic edit audit
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-order-delete-edit-flexibility-gate.mjs

      - name: Verify complete order editor contract
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-complete-order-edit-gate.mjs

      - name: Verify final order lifecycle
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-order-lifecycle-final-gate.mjs

      - name: TypeScript
        run: pnpm run web:typecheck

      - name: Full production gate
        run: pnpm run web:gate

      - name: Production build
        run: pnpm run web:build

      - name: Commit verified implementation only
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT CI"
          git config user.email "actions@users.noreply.github.com"

          git rm .github/scripts/finalize-admin-order-delete-edit-flexibility.mjs
          git rm .github/workflows/finalize-admin-order-delete-edit-flexibility.yml

          git add \
            artifacts/day-night-delivery/package.json \
            artifacts/day-night-delivery/scripts/admin-complete-order-edit-gate.mjs \
            artifacts/day-night-delivery/scripts/admin-order-delete-edit-flexibility-gate.mjs \
            artifacts/day-night-delivery/src/components/admin/AdminOrderDeleteModal.tsx \
            artifacts/day-night-delivery/src/components/admin/AdminOrderEditModalComplete.tsx \
            artifacts/day-night-delivery/src/lib/adminOrderDeleteData.ts \
            supabase/migrations/20260804053000_admin_order_delete_flexible_v2.sql

          git diff --cached --check
          git commit -m "fix(admin): make order deletion and editing operator-friendly"
          git push origin HEAD:fix/admin-order-delete-edit-flexibility-20260804
