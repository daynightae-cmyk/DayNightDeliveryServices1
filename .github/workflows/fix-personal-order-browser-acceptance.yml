name: Finalize Personal Order Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/fix-personal-order-browser-acceptance.py"
      - ".github/workflows/fix-personal-order-browser-acceptance.yml"
  push:
    branches: [feat/unify-personal-order-entry-20260803]
    paths:
      - ".github/scripts/fix-personal-order-browser-acceptance.py"
      - ".github/workflows/fix-personal-order-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-personal-order-browser-acceptance
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unify-personal-order-entry-20260803
          fetch-depth: 0

      - name: Patch acceptance to trust the persisted database row
        run: python .github/scripts/fix-personal-order-browser-acceptance.py

      - name: Remove one-time finalizer and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix-personal-order-browser-acceptance.py
          rm -f .github/workflows/fix-personal-order-browser-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No acceptance correction produced." >&2; exit 1; }
          git commit -m "test(admin): verify persisted personal order before UI refresh"
          git push origin HEAD:feat/unify-personal-order-entry-20260803
