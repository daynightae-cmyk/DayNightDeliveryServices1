name: Final Preview Browser Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-preview-browser-acceptance.yml"
      - "artifacts/day-night-delivery/**"
      - "android-role-shell/**"
      - "supabase/migrations/**"
      - "supabase/production-reconciliation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-preview-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-preview-source:
    name: Admin and ILYTK browser acceptance
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-runtime-tests
    env:
      DEPLOYED_PREVIEW_URL: https://day-night-delivery1-git-fix-gl-dd1944-daynightae-cmyks-projects.vercel.app
      TEST_BASE_URL: http://127.0.0.1:4173
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}
      RUNTIME_MERCHANT_EMAIL: ${{ secrets.RUNTIME_MERCHANT_EMAIL }}
      RUNTIME_MERCHANT_PASSWORD: ${{ secrets.RUNTIME_MERCHANT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify protected browser credentials and backend
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD RUNTIME_MERCHANT_EMAIL RUNTIME_MERCHANT_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done

      - name: Build and serve exact branch-head web application
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run web:typecheck
          pnpm run web:build
          test -s artifacts/day-night-delivery/dist/public/index.html
          mkdir -p preview-browser-evidence
          nohup pnpm --dir artifacts/day-night-delivery exec vite preview --host 127.0.0.1 --port 4173 --strictPort > preview-browser-evidence/local-web.log 2>&1 &
          echo $! > preview-browser-evidence/local-web.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$TEST_BASE_URL/auth?nosplash=1" | grep -F 'id="root"' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview-browser-evidence/local-web.log >&2
          exit 1

      - name: Install isolated Chromium acceptance runtime
        shell: bash
        run: |
          set -euo pipefail
          playwright_dir="$RUNNER_TEMP/daynight-playwright"
          rm -rf "$playwright_dir"
          mkdir -p "$playwright_dir"
          cd "$playwright_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_NODE_PATH=$playwright_dir/node_modules" >> "$GITHUB_ENV"

      - name: Test admin, ILYTK portal, and search on desktop and phone
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium, devices } = require(`${process.env.PLAYWRIGHT_NODE_PATH}/playwright`);

          const base = String(process.env.TEST_BASE_URL || '').replace(/\/$/, '');
          const deployedPreview = String(process.env.DEPLOYED_PREVIEW_URL || '').replace(/\/$/, '');
          const adminEmail = process.env.RUNTIME_ADMIN_EMAIL;
          const adminPassword = process.env.RUNTIME_ADMIN_PASSWORD;
          const merchantEmail = process.env.RUNTIME_MERCHANT_EMAIL;
          const merchantPassword = process.env.RUNTIME_MERCHANT_PASSWORD;
          const ilytkId = '325bb302-75c3-48cc-84ba-e58817d6d148';
          const g3bxgId = 'b0da2d6d-2fc9-43b3-9e38-260ff2dbd68e';
          const expectedMerchant = /استبي ما عرفنالك|DN-MER-SHOP-ILYTK|ILYTK/i;
          const reviewedCoupons = ['003860', '010503', '010505'];
          const excludedCoupon = '010504';

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function bodyText(page) {
            return page.locator('body').innerText();
          }

          async function clickFirst(locator, description) {
            const count = await locator.count();
            for (let index = 0; index < count; index += 1) {
              const item = locator.nth(index);
              if (await item.isVisible().catch(() => false)) {
                await item.click();
                return;
              }
            }
            if (count > 0) {
              await locator.first().click({ force: true });
              return;
            }
            throw new Error(`Missing control: ${description}`);
          }

          async function loginAdmin(page) {
            await page.goto(`${base}/auth?nosplash=1&lang=ar&__dn_acceptance=admin`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.locator('.auth-clean__intro-cta').click();
            await page.locator('#dn-admin-email').fill(adminEmail);
            await page.locator('#dn-admin-password').fill(adminPassword);
            await Promise.all([
              page.waitForURL((url) => url.pathname === '/admin', { timeout: 90000 }),
              page.locator('button[type="submit"]').click(),
            ]);
            await page.waitForLoadState('networkidle', { timeout: 90000 }).catch(() => {});
            assert(/لوحة التحكم|Dashboard|كافة الطلبات|All Orders/.test(await bodyText(page)), 'Admin portal did not render after protected login.');
          }

          async function selectorText(page) {
            await page.waitForTimeout(700);
            return page.locator('.dn-admin-bulk-selector-list').innerText();
          }

          async function testAdmin(page, label) {
            await loginAdmin(page);
            await clickFirst(page.getByText(/كافة الطلبات|All Orders/, { exact: true }), 'All Orders navigation');
            const search = page.locator('[data-admin-order-search="true"]');
            const merchantSelect = page.locator('.dn-admin-bulk-filter-grid select');
            await search.waitFor({ state: 'visible', timeout: 90000 });
            await merchantSelect.waitFor({ state: 'attached', timeout: 90000 });

            await merchantSelect.selectOption(ilytkId);
            await search.fill('003860');
            let text = await selectorText(page);
            assert(text.includes('003860'), `${label}: ILYTK admin scope did not return coupon 003860.`);

            await merchantSelect.selectOption(g3bxgId);
            text = await selectorText(page);
            assert(!text.includes('003860'), `${label}: coupon 003860 leaked into G3BXG admin scope.`);

            await search.fill(excludedCoupon);
            text = await selectorText(page);
            assert(text.includes(excludedCoupon), `${label}: G3BXG admin scope did not return coupon 010504.`);

            await merchantSelect.selectOption(ilytkId);
            text = await selectorText(page);
            assert(!text.includes(excludedCoupon), `${label}: coupon 010504 leaked into ILYTK admin scope.`);

            await search.fill('003860');
            text = await selectorText(page);
            assert(text.includes('003860'), `${label}: ILYTK admin scope lost coupon 003860 after owner switching.`);
            await page.screenshot({ path: `preview-browser-evidence/${label}-admin-orders.png`, fullPage: true });
          }

          async function loginMerchant(page) {
            await page.goto(`${base}/merchant?nosplash=1&lang=ar&__dn_acceptance=merchant`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            const email = page.locator('input[type="email"]').first();
            const password = page.locator('input[type="password"]').first();
            await email.waitFor({ state: 'visible', timeout: 90000 });
            await email.fill(merchantEmail);
            await password.fill(merchantPassword);
            await page.locator('form button[type="submit"]').first().click();
            await page.locator('[data-merchant-authenticated="true"]').waitFor({ state: 'visible', timeout: 90000 });
            await page.waitForLoadState('networkidle', { timeout: 90000 }).catch(() => {});
            assert(expectedMerchant.test(await bodyText(page)), 'Authenticated merchant account is not canonical ILYTK.');
          }

          async function merchantSearch(page, query) {
            await clickFirst(page.getByRole('button', { name: /البحث|Search/ }), 'Merchant global search');
            const dialog = page.getByRole('dialog', { name: /البحث الشامل|Global search/ });
            await dialog.waitFor({ state: 'visible', timeout: 30000 });
            await dialog.locator('input').first().fill(query);
            await page.waitForTimeout(900);
            const text = await dialog.innerText();
            const resultCount = await dialog.locator('.dn-merchant-command-results button').count();
            await page.keyboard.press('Escape');
            return { text, resultCount };
          }

          async function testMerchant(page, label) {
            await loginMerchant(page);
            for (const coupon of reviewedCoupons) {
              const result = await merchantSearch(page, coupon);
              assert(result.resultCount > 0, `${label}: ILYTK search returned no result for ${coupon}.`);
              assert(!/لا توجد نتائج مطابقة|No matching results/.test(result.text), `${label}: ILYTK search reported empty for ${coupon}.`);
            }
            const excluded = await merchantSearch(page, excludedCoupon);
            assert(excluded.resultCount === 0, `${label}: excluded coupon 010504 appeared in ILYTK portal search.`);
            assert(/لا توجد نتائج مطابقة|No matching results/.test(excluded.text), `${label}: excluded coupon 010504 did not produce explicit empty state.`);
            await page.screenshot({ path: `preview-browser-evidence/${label}-merchant.png`, fullPage: true });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const scenarios = [
              { label: 'desktop', context: { viewport: { width: 1440, height: 1000 }, locale: 'ar-AE' } },
              { label: 'phone', context: { ...devices['Pixel 7'], locale: 'ar-AE' } },
            ];
            const report = [];
            try {
              for (const scenario of scenarios) {
                const adminContext = await browser.newContext(scenario.context);
                await testAdmin(await adminContext.newPage(), scenario.label);
                await adminContext.close();

                const merchantContext = await browser.newContext(scenario.context);
                await testMerchant(await merchantContext.newPage(), scenario.label);
                await merchantContext.close();
                report.push({ scenario: scenario.label, admin: 'PASS', merchant: 'PASS', search: 'PASS', crossOwner: 'PASS' });
              }
            } finally {
              await browser.close();
            }
            fs.writeFileSync('preview-browser-evidence/report.json', JSON.stringify({
              branchHead: process.env.GITHUB_HEAD_SHA || process.env.GITHUB_SHA,
              deployedPreview,
              testedExactSourceBundle: true,
              reviewedCoupons,
              excludedCoupon,
              result: 'PASS',
              scenarios: report,
            }, null, 2));
            console.log(JSON.stringify(report, null, 2));
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

      - name: Stop local application
        if: always()
        shell: bash
        run: |
          if [ -f preview-browser-evidence/local-web.pid ]; then
            kill "$(cat preview-browser-evidence/local-web.pid)" 2>/dev/null || true
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAY-NIGHT-Final-Preview-Browser-Evidence
          path: preview-browser-evidence/
          if-no-files-found: warn
          retention-days: 30
