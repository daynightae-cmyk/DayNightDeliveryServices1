name: Repair Admin Live Financial State

on:
  push:
    branches:
      - fix/admin-live-financial-state-20260805

permissions:
  contents: write

jobs:
  diagnose-patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-live-financial-state-20260805
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Patch the actual live-state regression
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          component_path = Path("artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx")
          autocomplete_path = Path("artifacts/day-night-delivery/src/components/admin/AdminHistoryAutocomplete.tsx")
          gate_path = Path("artifacts/day-night-delivery/scripts/admin-live-financial-state-gate.mjs")

          component = component_path.read_text(encoding="utf-8")
          autocomplete = autocomplete_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"Patch failed: {label}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Patch failed: {label}; matches={count}")
              return updated

          component = replace_once(
              component,
              'import { useEffect, useMemo, useState, type FormEvent } from "react";',
              'import { useMemo, useState, type FormEvent } from "react";',
              "remove delayed zero-value effect",
          )
          component = replace_once(
              component,
              '  effectiveDeliveryFeeMode,\n',
              '',
              "remove conflicting effective mode import",
          )

          component = regex_once(
              component,
              r'function merchantSettlement\([\s\S]*?\n\s*type FinancialMetricTone = "neutral" \| "gold" \| "danger";',
              '''function merchantSettlement(value: number, isArabic: boolean) {
            return value < 0
              ? {
                  label: isArabic ? "مستحق على التاجر" : "Merchant debit",
                  amount: value,
                }
              : {
                  label: isArabic ? "مستحق للتاجر" : "Due to merchant",
                  amount: value,
                };
          }

          type FinancialMetricTone = "neutral" | "gold" | "danger";''',
              "make settlement label depend on the signed balance",
          )

          component = regex_once(
              component,
              r'  const authoritativeDeliveryFeeMode = effectiveDeliveryFeeMode\([\s\S]*?\n  \}, \[form\.goods_value, form\.delivery_fee_mode, form\.payment_method\]\);\n',
              '''  const explicitManualZero =
            form.price_mode === "manual" &&
            form.manual_delivery_price !== "" &&
            form.manual_delivery_price !== null &&
            form.manual_delivery_price !== undefined &&
            Number.isFinite(Number(form.manual_delivery_price)) &&
            Number(form.manual_delivery_price) === 0;
          const authoritativeDeliveryFeeMode = explicitManualZero
            ? "deduct_from_merchant"
            : form.delivery_fee_mode;
          const merchantFeeModeActive =
            authoritativeDeliveryFeeMode === "deduct_from_merchant";
          const resolvedFinancialInput = useMemo<FinancialOpsOrderInput>(() => ({
            ...form,
            merchant: selectedMerchant,
            delivery_fee_mode: authoritativeDeliveryFeeMode,
            payment_method: merchantFeeModeActive
              ? "merchant_pays"
              : form.payment_method === "merchant_pays" ||
                  form.payment_method === "sender_pays"
                ? "cod"
                : form.payment_method,
          }), [form, selectedMerchant, authoritativeDeliveryFeeMode, merchantFeeModeActive]);
          const financials = useMemo(() => {
            try {
              return calculateFinancialOpsOrder(resolvedFinancialInput);
            } catch {
              return null;
            }
          }, [resolvedFinancialInput]);
          const settlement = financials
            ? merchantSettlement(financials.merchantDue, isArabic)
            : null;
          const merchantDebitActive = Boolean(
            financials && financials.merchantDue < 0,
          );
          const ownerSelectionValue = ownerMode === "personal" ? PERSONAL_ORDER_OPTION : form.merchant_id || "";
''',
              "replace conflicting and delayed financial derivation",
          )

          component = replace_once(
              component,
              'type="number" min={0} step="0.01" name="dn_goods_value_no_history_20260805"',
              'type="number" min={0} step="0.01" data-admin-financial-input="true" name="dn_goods_value_no_history_20260805"',
              "protect goods input from DOM autocomplete",
          )
          component = replace_once(
              component,
              '<input type="number" min={0} step="0.01" value={form.manual_delivery_price ?? ""}',
              '<input type="number" min={0} step="0.01" data-admin-financial-input="true" value={form.manual_delivery_price ?? ""}',
              "protect manual delivery input",
          )
          component = replace_once(
              component,
              '<input type="number" min={0} step="0.01" value={form.discount_amount ?? ""}',
              '<input type="number" min={0} step="0.01" data-admin-financial-input="true" value={form.discount_amount ?? ""}',
              "protect discount input",
          )

          component = replace_once(
              component,
              '''tone={
                  merchantDebitActive
                    ? "neutral"
                    : "gold"
                }''',
              '''tone={merchantFeeModeActive ? "neutral" : "gold"}''',
              "customer emphasis follows fee owner",
          )

          old_final = '''label={
                  merchantDebitActive
                    ? isArabic
                      ? "إجمالي المستحق على التاجر"
                      : "Merchant debit total"
                    : isArabic
                      ? "الإجمالي النهائي المطلوب من العميل"
                      : "Final customer total"
                }
                value={
                  merchantDebitActive
                    ? financials.merchantDue
                    : financials.customerTotal
                }
                tone={merchantDebitActive ? "danger" : "gold"}'''
          new_final = '''label={
                  financials.merchantDue < 0
                    ? isArabic
                      ? "إجمالي المستحق على التاجر"
                      : "Merchant debit total"
                    : merchantFeeModeActive
                      ? isArabic
                        ? "الإجمالي النهائي للتاجر"
                        : "Final merchant total"
                      : isArabic
                        ? "الإجمالي النهائي المطلوب من العميل"
                        : "Final customer total"
                }
                value={
                  merchantFeeModeActive
                    ? financials.merchantDue
                    : financials.customerTotal
                }
                tone={financials.merchantDue < 0 ? "danger" : "gold"}'''
          component = replace_once(
              component,
              old_final,
              new_final,
              "final card reads current signed financial state",
          )

          old_selector = '''input:not([type="hidden"]):not([type="password"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]):not([type="date"]):not([type="datetime-local"]):not([readonly]):not([disabled])'''
          new_selector = '''input:not([type="hidden"]):not([type="password"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]):not([type="date"]):not([type="datetime-local"]):not([type="number"]):not([inputmode="decimal"]):not([inputmode="numeric"]):not([data-admin-financial-input="true"]):not([readonly]):not([disabled])'''
          autocomplete = replace_once(
              autocomplete,
              old_selector,
              new_selector,
              "exclude financial number inputs from smart autocomplete",
          )
          autocomplete = replace_once(
              autocomplete,
              '''      for (const input of inputs) {
        if (bound.has(input)) continue;''',
              '''      for (const input of inputs) {
        if (
          input.dataset.adminFinancialInput === "true" ||
          input.type === "number" ||
          input.inputMode === "decimal" ||
          input.inputMode === "numeric"
        ) {
          continue;
        }
        if (bound.has(input)) continue;''',
              "add defensive financial-input exclusion",
          )

          component_path.write_text(component, encoding="utf-8")
          autocomplete_path.write_text(autocomplete, encoding="utf-8")

          gate_path.write_text('''import fs from "node:fs";

          const component = fs.readFileSync(
            "artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx",
            "utf8",
          );
          const autocomplete = fs.readFileSync(
            "artifacts/day-night-delivery/src/components/admin/AdminHistoryAutocomplete.tsx",
            "utf8",
          );

          const checks = [
            [!component.includes("useEffect"), "delayed financial synchronization removed"],
            [!component.includes("effectiveDeliveryFeeMode"), "conflicting mode resolver removed from UI"],
            [component.includes('data-admin-financial-input="true"'), "financial inputs are explicitly protected"],
            [component.includes('label: isArabic ? "مستحق على التاجر"') && component.includes("return value < 0"), "merchant label follows signed amount"],
            [component.includes('"الإجمالي النهائي للتاجر"'), "positive merchant total label exists"],
            [component.includes('tone={financials.merchantDue < 0 ? "danger" : "gold"}'), "danger color follows actual negative balance"],
            [component.includes("merchantFeeModeActive ? financials.merchantDue"), "final amount follows fee owner"],
            [autocomplete.includes(':not([type="number"])'), "number inputs excluded from history autocomplete"],
            [autocomplete.includes(':not([data-admin-financial-input="true"])'), "financial marker excluded from history autocomplete"],
            [autocomplete.includes('input.dataset.adminFinancialInput === "true"'), "defensive runtime exclusion exists"],
          ];

          for (const [ok, label] of checks) {
            if (!ok) throw new Error(`admin_live_financial_state_gate_failed: ${label}`);
          }

          const calculate = (goods, fee, mode, discount = 0) => ({
            customer: mode === "customer_pays" ? goods + fee - discount : goods - discount,
            merchant: mode === "deduct_from_merchant" ? goods - discount - fee : goods - discount,
          });
          const matrix = [
            [0, 25, "deduct_from_merchant", 0, -25],
            [30, 25, "deduct_from_merchant", 30, 5],
            [100, 25, "deduct_from_merchant", 100, 75],
            [100, 25, "customer_pays", 125, 100],
          ];
          for (const [goods, fee, mode, customer, merchant] of matrix) {
            const result = calculate(goods, fee, mode);
            if (result.customer !== customer || result.merchant !== merchant) {
              throw new Error(`financial_matrix_failed: ${goods}/${fee}/${mode}`);
            }
          }

          console.log("admin live financial state gate: PASS");
          console.log("DOM autocomplete no longer owns numeric financial inputs");
          console.log("0/25 merchant => customer 0, merchant -25");
          console.log("30/25 merchant => customer 30, merchant 5");
          ''', encoding="utf-8")

          Path(".github/workflows/admin-live-financial-state-fix.yml").unlink()
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify regression contract
        run: node artifacts/day-night-delivery/scripts/admin-live-financial-state-gate.mjs

      - name: Verify financial engine matrix
        run: pnpm --dir artifacts/day-night-delivery run financial-matrix:gate

      - name: Typecheck application
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Build production application
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "daynight.ae@gmail.com"
          git add artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx \
                  artifacts/day-night-delivery/src/components/admin/AdminHistoryAutocomplete.tsx \
                  artifacts/day-night-delivery/scripts/admin-live-financial-state-gate.mjs \
                  .github/workflows/admin-live-financial-state-fix.yml
          git commit -m "fix(admin): restore live financial field reactivity"
          git push origin HEAD:fix/admin-live-financial-state-20260805
