name: Repair Admin Live Financial State

on:
  push:
    branches:
      - fix/admin-live-financial-state-20260805

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-live-financial-state-20260805
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply repair
        run: |
          python .github/scripts/admin_live_financial_state_patch.py
          python - <<'PY'
          from pathlib import Path

          component_path = Path("artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx")
          component = component_path.read_text(encoding="utf-8")
          old_call = '''      const savedSettlement = merchantSettlement(
                calculated.merchantDue,
                isArabic,
                calculated.deliveryFeeMode,
              );'''
          new_call = '''      const savedSettlement = merchantSettlement(
                calculated.merchantDue,
                isArabic,
              );'''
          if old_call not in component:
              raise RuntimeError("saved merchant settlement signature was not found")
          component_path.write_text(component.replace(old_call, new_call, 1), encoding="utf-8")

          plugin_path = Path("artifacts/day-night-delivery/scripts/precise-financial-rule-compatible-plugin.ts")
          plugin = plugin_path.read_text(encoding="utf-8")
          old_detection = '''        source.includes("effectiveDeliveryFeeMode") &&
        source.includes("calculateFinancialOpsOrder") &&
        source.includes('data-admin-new-order-form="merchant"');'''
          new_detection = '''        source.includes("calculateFinancialOpsOrder") &&
        source.includes("resolvedFinancialInput") &&
        source.includes('data-admin-new-order-form="merchant"');'''
          if old_detection not in plugin:
              raise RuntimeError("authoritative new-order plugin detection was not found")
          plugin_path.write_text(plugin.replace(old_detection, new_detection, 1), encoding="utf-8")
          PY

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify source contract
        run: node artifacts/day-night-delivery/scripts/admin-live-financial-state-gate.mjs

      - name: Verify financial matrix
        run: pnpm --dir artifacts/day-night-delivery run financial-matrix:gate

      - name: Typecheck
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Build
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Commit repair
        run: |
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "daynight.ae@gmail.com"
          git add -A
          git commit -m "fix(admin): restore live financial field reactivity"
          git push origin HEAD:fix/admin-live-financial-state-20260805
