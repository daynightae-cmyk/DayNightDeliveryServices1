name: Export language policy generator v3
# Unconditional one-time generation on a unique source branch.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-language-policy-generator.yml
      - artifacts/day-night-delivery/scripts/apply-export-language-policy.py
      - artifacts/day-night-delivery/scripts/export-localization-template.ts.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: export-language-policy-generator-v3
  cancel-in-progress: false

jobs:
  generate-language-aware-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_BRANCH: fix/export-language-aware-statements-v3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/day-night-delivery/pnpm-lock.yaml

      - name: Apply export language policy on latest main
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            git switch -c "$SOURCE_BRANCH"
            python artifacts/day-night-delivery/scripts/apply-export-language-policy.py
            python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/day-night-delivery/package.json')
          text = path.read_text(encoding='utf-8')
          gate = '    "export-language:gate": "node scripts/export-language-policy-gate.mjs",\n'
          anchor = '    "merchant-statement-edit:gate": "node scripts/merchant-statement-order-edit-gate.mjs",\n'
          if gate not in text:
              if anchor not in text:
                  raise SystemExit('package.json export gate script anchor missing')
              text = text.replace(anchor, anchor + gate, 1)
          production_anchor = 'node scripts/merchant-statement-order-edit-gate.mjs && node scripts/customer-experience-tests.mjs'
          production_replacement = 'node scripts/merchant-statement-order-edit-gate.mjs && node scripts/export-language-policy-gate.mjs && node scripts/customer-experience-tests.mjs'
          if production_replacement not in text:
              if production_anchor not in text:
                  raise SystemExit('package.json production gate anchor missing')
              text = text.replace(production_anchor, production_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
            git rm artifacts/day-night-delivery/scripts/apply-export-language-policy.py
            git rm artifacts/day-night-delivery/scripts/export-localization-template.ts.txt
            git rm .github/workflows/export-language-policy-generator.yml
          } > "$RUNNER_TEMP/export-patch-v3.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/export-patch-v3.log"
          exit "$status"

      - name: Validate TypeScript, export policy, production gates, and build
        id: validate
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        working-directory: artifacts/day-night-delivery
        shell: bash
        run: |
          set +e
          {
            pnpm install --frozen-lockfile
            pnpm exec tsc --noEmit
            node scripts/export-language-policy-gate.mjs
            node scripts/personal-orders-admin-gate.mjs
            pnpm build
          } > "$RUNNER_TEMP/export-validate-v3.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/export-validate-v3.log"
          exit "$status"

      - name: Commit only reviewed source files and publish branch
        id: publish
        if: steps.patch.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add \
            artifacts/day-night-delivery/src/lib/exportLocalization.ts \
            artifacts/day-night-delivery/scripts/export-language-policy-gate.mjs
          git commit -m "fix(exports): follow dashboard language across all statements"
          git push origin "$SOURCE_BRANCH"

      - name: Report sanitized v3 generator outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          patch_tail="$(tail -n 30 "$RUNNER_TEMP/export-patch-v3.log" 2>/dev/null || true)"
          validate_tail="$(tail -n 30 "$RUNNER_TEMP/export-validate-v3.log" 2>/dev/null || true)"
          cat > "$RUNNER_TEMP/export-generator-v3-report.md" <<EOF
          ## Export language generator v3 outcome

          - Patch: ${{ steps.patch.outcome }}
          - Validation/build: ${{ steps.validate.outcome }}
          - Branch publish: ${{ steps.publish.outcome }}
          - Run: ${{ github.run_id }}

          ### Patch tail
          ```text
          $patch_tail
          ```

          ### Validation tail
          ```text
          $validate_tail
          ```
          EOF
          gh pr comment 292 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/export-generator-v3-report.md"

      - name: Fail closed when generation did not pass
        if: steps.patch.outcome != 'success' || steps.validate.outcome != 'success' || steps.publish.outcome != 'success'
        shell: bash
        run: exit 1
