name: Merchant Business Center RPC Reconciliation Once

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/production-reconciliation/20260802070000_restore_merchant_business_center_rpc.sql"
      - ".github/workflows/merchant-business-center-rpc-reconciliation-once.yml"
      - ".github/scripts/ilytk-session-rpc-diagnostic.mjs"

permissions:
  contents: read

concurrency:
  group: merchant-business-center-rpc-reconciliation-once
  cancel-in-progress: false

jobs:
  restore-and-verify:
    if: >-
      github.repository == 'daynightae-cmyk/DayNightDeliveryServices1' &&
      github.event.pull_request.head.ref == 'fix/global-order-merchant-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify protected lineage and production target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d9e18be5ebee6767d41b7cbb0e6a4d30e1435d44 HEAD
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - name: Install exact repository dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Confirm the RPC is absent before reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const response = await fetch(`${root}/rest/v1/`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              Accept: 'application/openapi+json',
            },
          });
          if (!response.ok) throw new Error(`openapi_${response.status}_${await response.text()}`);
          const spec = await response.json();
          const path = spec.paths?.['/rpc/merchant_portal_business_center'];
          console.log(JSON.stringify({ before_reconciliation_rpc_exposed: Boolean(path) }, null, 2));
          NODE

      - name: Apply exact idempotent production reconciliation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/daynight-merchant-business-center-rpc"
          target="20260802070000_restore_merchant_business_center_rpc.sql"
          mkdir -p "$release_dir/supabase/migrations"
          cp supabase/config.toml "$release_dir/supabase/config.toml"
          supabase --workdir "$release_dir" link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$release_dir" migration fetch --linked
          if [ -f "$release_dir/supabase/migrations/$target" ]; then
            echo "$target already recorded; verifying live RPC only"
          else
            cp "supabase/production-reconciliation/$target" "$release_dir/supabase/migrations/$target"
            supabase --workdir "$release_dir" db push --dry-run
            supabase --workdir "$release_dir" db push --yes
          fi

      - name: Wait for PostgREST schema reload
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node --input-type=module <<'NODE'
          const root = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const response = await fetch(`${root}/rest/v1/`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              Accept: 'application/openapi+json',
            },
          });
          if (!response.ok) process.exit(1);
          const spec = await response.json();
          process.exit(spec.paths?.['/rpc/merchant_portal_business_center'] ? 0 : 1);
          NODE
            then
              echo "merchant_portal_business_center is exposed by PostgREST"
              exit 0
            fi
            sleep 2
          done
          echo "RPC was not exposed after schema reload" >&2
          exit 1

      - name: Verify genuine ILYTK RPC chain end to end
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/ilytk-session-rpc-diagnostic.mjs
