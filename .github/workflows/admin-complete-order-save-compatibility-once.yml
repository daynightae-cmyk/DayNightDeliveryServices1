name: Admin Complete Order Save Compatibility Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-complete-order-save-compatibility-once.yml"
      - "supabase/migrations/20260802104000_admin_complete_order_save_compatibility_alias.sql"

permissions:
  contents: read

concurrency:
  group: admin-complete-order-save-compatibility-once
  cancel-in-progress: false

jobs:
  deploy-compatibility:
    if: >-
      github.repository == 'daynightae-cmyk/DayNightDeliveryServices1' &&
      github.event.pull_request.head.ref == 'fix/admin-order-save-real-edits-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact compatibility migration
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

          target="supabase/migrations/20260802104000_admin_complete_order_save_compatibility_alias.sql"
          test -s "$target"
          grep -F "admin_update_order_complete_verified_v1_internal" "$target" >/dev/null
          grep -F "admin_update_order_complete_verified_v2" "$target" >/dev/null
          grep -F "deployed_client_entrypoint" "$target" >/dev/null
          grep -F "probe_tests_deployed_client_entrypoint" "$target" >/dev/null
          ! grep -Eiq 'truncate[[:space:]]+table|drop[[:space:]]+table|delete[[:space:]]+from[[:space:]]+public\.(orders|merchants)' "$target"

      - name: Apply only the compatibility migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 2; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD" >&2; exit 2; }

          release_dir="$RUNNER_TEMP/daynight-admin-order-save-compatibility"
          target="20260802104000_admin_complete_order_save_compatibility_alias.sql"
          rm -rf "$release_dir"
          mkdir -p "$release_dir/supabase/migrations"
          cp supabase/config.toml "$release_dir/supabase/config.toml"

          supabase --workdir "$release_dir" link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$release_dir" migration fetch --linked

          if [ -f "$release_dir/supabase/migrations/$target" ]; then
            echo "$target already recorded"
          else
            cp "supabase/migrations/$target" "$release_dir/supabase/migrations/$target"
            supabase --workdir "$release_dir" db push --dry-run
            supabase --workdir "$release_dir" db push --yes
          fi

      - name: Verify current-site entrypoint and health RPC
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node --input-type=module <<'NODE'
          const root = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const response = await fetch(`${root}/rest/v1/`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              Accept: 'application/openapi+json',
            },
          });
          if (!response.ok) process.exit(1);
          const spec = await response.json();
          const paths = spec.paths || {};
          const required = [
            '/rpc/admin_update_order_complete_verified',
            '/rpc/admin_update_order_complete_verified_v2',
            '/rpc/admin_probe_order_complete_save',
            '/rpc/admin_complete_order_save_compatibility_health',
          ];
          process.exit(required.every((path) => paths[path]) ? 0 : 1);
          NODE
            then
              echo "The currently deployed Save RPC name routes to the corrected implementation"
              exit 0
            fi
            sleep 2
          done
          echo "Compatibility entrypoint was not exposed by PostgREST" >&2
          exit 1
