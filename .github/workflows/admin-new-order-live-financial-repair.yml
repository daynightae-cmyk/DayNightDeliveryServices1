name: Admin New Order Live Financial Repair

on:
  push:
    branches: [fix/admin-new-order-live-financial-source-20260805]
    paths:
      - .github/workflows/admin-new-order-live-financial-repair.yml
      - .github/repairs/apply-admin-new-order-live-financial-fix.py
      - .github/repairs/apply-order-financial-centralization.py
      - .github/repairs/fix-admin-new-order-gate-runtime.py

permissions:
  contents: write

concurrency:
  group: admin-new-order-live-financial-repair
  cancel-in-progress: false

jobs:
  repair-test-commit:
    name: Repair, test and commit authoritative financial flow
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-new-order-live-financial-source-20260805
          fetch-depth: 0

      - name: Apply focused source repairs
        run: |
          set -euo pipefail
          python .github/repairs/apply-admin-new-order-live-financial-fix.py
          python .github/repairs/apply-order-financial-centralization.py
          python .github/repairs/fix-admin-new-order-gate-runtime.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mandatory financial acceptance matrix
        run: |
          set -euo pipefail
          node artifacts/day-night-delivery/scripts/admin-new-order-live-financial-gate.mjs | tee /tmp/admin-new-order-live-financial.txt
          grep -Fq 'CASE 1 PASS: goods=0, fee=25, merchant, customer=0, merchant=-25' /tmp/admin-new-order-live-financial.txt
          grep -Fq 'CASE 2 PASS: goods=100, fee=25, merchant, customer=100, merchant=75' /tmp/admin-new-order-live-financial.txt
          grep -Fq 'CASE 3 PASS: goods=10, fee=25, merchant, customer=10, merchant=-15' /tmp/admin-new-order-live-financial.txt
          grep -Fq 'CASE 4 PASS: goods=100, fee=25, customer, customer=125, merchant=100' /tmp/admin-new-order-live-financial.txt
          grep -Fq 'LIVE CHANGE PASS' /tmp/admin-new-order-live-financial.txt
          grep -Fq 'SAVE/REOPEN PASS' /tmp/admin-new-order-live-financial.txt

      - name: Verify centralized calculator and create contract
        run: |
          set -euo pipefail
          pnpm --dir artifacts/day-night-delivery run test:admin-order-create-v3
          test "$(grep -c 'calculateOrderFinancials({' artifacts/day-night-delivery/src/lib/orderFinancialOperations.ts)" -eq 1
          ! grep -Fq 'const customerTotal = Math.round' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx
          ! grep -Fq 'merchantDebitActive' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx
          ! grep -Fq 'authoritativeDeliveryFeeMode' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx

      - name: TypeScript
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Production build
        run: |
          pnpm --dir artifacts/day-night-delivery run build
          echo 'BUILD PASS'

      - name: Verify clean patch
        run: git diff --check

      - name: Remove temporary repair automation
        run: |
          rm -f .github/repairs/apply-admin-new-order-live-financial-fix.py
          rm -f .github/repairs/apply-order-financial-centralization.py
          rm -f .github/repairs/fix-admin-new-order-gate-runtime.py
          rm -f .github/workflows/admin-new-order-live-financial-repair.yml

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name 'daynight-financial-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified source changes were produced.' >&2
            exit 1
          fi
          git commit -m 'fix(admin): make new-order financial preview fully reactive'
          git push origin HEAD:fix/admin-new-order-live-financial-source-20260805
