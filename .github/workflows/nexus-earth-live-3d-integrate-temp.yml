name: NEXUS Earth Live 3D Integrate Temp

on:
  push:
    branches:
      - feature/nexus-earth-live-3d-20260816
    paths:
      - .github/workflows/nexus-earth-live-3d-integrate-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/nexus-earth-live-3d-20260816
          fetch-depth: 0

      - name: Transform orbital map into close 3D live city scene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path('artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx')
          css = Path('artifacts/day-night-delivery/src/styles/dn-nexus-orbital-live.css')
          s = component.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global s
              if old not in s:
                  raise SystemExit(f'Missing source contract for {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'const UAE_ORBIT_CENTER: NexusLngLat = [54.55, 24.42];',
              '''type LiveCityCamera = {\n  name: string;\n  center: NexusLngLat;\n  zoom: number;\n  pitch: number;\n  bearing: number;\n};\n\nconst UAE_LIVE_CITY_TOUR: LiveCityCamera[] = [\n  { name: "Dubai Downtown", center: [55.2744, 25.1972], zoom: 15.55, pitch: 70, bearing: -28 },\n  { name: "Dubai Marina", center: [55.1412, 25.0782], zoom: 15.65, pitch: 72, bearing: 24 },\n  { name: "Abu Dhabi Corniche", center: [54.3773, 24.4539], zoom: 15.35, pitch: 69, bearing: -18 },\n  { name: "Sharjah Waterfront", center: [55.3839, 25.3514], zoom: 15.25, pitch: 68, bearing: 32 },\n  { name: "Al Ain", center: [55.7606, 24.2075], zoom: 15.1, pitch: 67, bearing: -12 },\n];\nconst EARTH_LIVE_START = UAE_LIVE_CITY_TOUR[0];''',
              'live city camera constants',
          )

          replace_once(
              '  const orbitTimerRef = useRef<number | null>(null);',
              '  const orbitTimerRef = useRef<number | null>(null);\n  const liveTourIndexRef = useRef(0);',
              'live tour ref',
          )

          replace_once(
              '''          center: UAE_ORBIT_CENTER,\n          zoom: 6.35,\n          pitch: 54,\n          bearing: -24,\n          projection: "globe",\n          attributionControl: true,\n          antialias: true,''',
              '''          center: EARTH_LIVE_START.center,\n          zoom: EARTH_LIVE_START.zoom,\n          pitch: EARTH_LIVE_START.pitch,\n          bearing: EARTH_LIVE_START.bearing,\n          projection: "mercator",\n          config: {\n            basemap: {\n              lightPreset: "day",\n              showRoadsAndTransit: true,\n              showPedestrianRoads: true,\n              showRoadLabels: true,\n              showPlaceLabels: true,\n              showPointOfInterestLabels: true,\n              showTransitLabels: true,\n            },\n          },\n          attributionControl: true,\n          antialias: true,''',
              'close 3d initial camera',
          )

          replace_once(
              '''          try {\n            localMap.setConfigProperty("basemap", "lightPreset", lightPresetForDubai(new Date()));\n            localMap.setConfigProperty("basemap", "showRoadsAndTransit", true);\n            localMap.setConfigProperty("basemap", "showRoadLabels", true);\n            localMap.setConfigProperty("basemap", "showPlaceLabels", true);\n          } catch {\n            // Standard style config is best-effort; data truth does not depend on it.\n          }''',
              '''          const visualConfig: Record<string, string | boolean | number> = {\n            lightPreset: "day",\n            showRoadsAndTransit: true,\n            showPedestrianRoads: true,\n            showRoadLabels: true,\n            showPlaceLabels: true,\n            showPointOfInterestLabels: true,\n            showTransitLabels: true,\n            show3dObjects: true,\n            show3dBuildings: true,\n            show3dTrees: true,\n            show3dLandmarks: true,\n            show3dFacades: true,\n          };\n          for (const [key, value] of Object.entries(visualConfig)) {\n            try {\n              localMap.setConfigProperty("basemap", key, value);\n            } catch {\n              // Individual visual capabilities vary by Standard style revision.\n            }\n          }''',
              '3d standard style config',
          )

          replace_once(
              '''            localMap.setFog({\n              range: [0.6, 8],\n              color: "#10233f",\n              "high-color": "#24588e",\n              "space-color": "#020713",\n              "star-intensity": 0.32,\n            });''',
              '''            localMap.setFog({\n              range: [1.5, 12],\n              color: "#dbeeff",\n              "high-color": "#b8ddff",\n              "space-color": "#07162a",\n              "star-intensity": 0,\n            });''',
              'bright earth atmosphere',
          )

          replace_once(
              'if (Array.isArray(coordinates)) localMap.easeTo({ center: coordinates, zoom: Math.max(localMap.getZoom(), 12.5), pitch: 63, duration: 850 });',
              'if (Array.isArray(coordinates)) localMap.easeTo({ center: coordinates, zoom: Math.max(localMap.getZoom(), 16.2), pitch: 70, bearing: localMap.getBearing(), duration: 1050 });',
              'driver close street focus',
          )

          replace_once(
              'localMap.easeTo({ center: feature.geometry.coordinates, zoom, pitch: 55 });',
              'localMap.easeTo({ center: feature.geometry.coordinates, zoom: Math.max(zoom, 14.5), pitch: 66 });',
              'cluster close focus',
          )

          replace_once(
              '''    try {\n      map.setConfigProperty("basemap", "lightPreset", lightPresetForDubai(now));\n    } catch {\n      // Visual synchronization only.\n    }''',
              '''    try {\n      // Keep the operational scene readable and photorealistic even during UAE dusk/night.\n      // The real UAE clock remains live in the HUD; this is a visualization choice only.\n      map.setConfigProperty("basemap", "lightPreset", "day");\n    } catch {\n      // Visual synchronization only.\n    }''',
              'daylight visibility lock',
          )

          replace_once(
              '''    if (!map || !orbitalMode || selectedOrder || selectedDriver) return;\n    orbitTimerRef.current = window.setInterval(() => {\n      const current = mapRef.current;\n      if (!current) return;\n      current.easeTo({\n        bearing: current.getBearing() + 9,\n        pitch: 55,\n        duration: 4500,\n        easing: (value: number) => value,\n        essential: false,\n      });\n    }, 4800);''',
              '''    if (!map || !orbitalMode || selectedOrder || selectedDriver) return;\n    const moveToNextLiveCity = () => {\n      const current = mapRef.current;\n      if (!current || document.visibilityState !== "visible") return;\n      liveTourIndexRef.current = (liveTourIndexRef.current + 1) % UAE_LIVE_CITY_TOUR.length;\n      const target = UAE_LIVE_CITY_TOUR[liveTourIndexRef.current];\n      current.flyTo({\n        center: target.center,\n        zoom: target.zoom,\n        pitch: target.pitch,\n        bearing: target.bearing,\n        duration: 6500,\n        curve: 1.15,\n        essential: false,\n      });\n    };\n    orbitTimerRef.current = window.setInterval(moveToNextLiveCity, 18000);''',
              'live city tour',
          )

          replace_once(
              'if (bounds) map.fitBounds(bounds, { padding: 110, maxZoom: 14, duration: 850, pitch: 58 });',
              'if (bounds) map.fitBounds(bounds, { padding: 110, maxZoom: 16, duration: 1050, pitch: 66 });',
              'route close fit',
          )

          replace_once(
              '''    setOrbitalMode(true);\n    map.easeTo({ center: UAE_ORBIT_CENTER, zoom: 6.35, pitch: 54, bearing: -24, duration: 1200 });''',
              '''    liveTourIndexRef.current = 0;\n    setOrbitalMode(true);\n    map.flyTo({\n      center: EARTH_LIVE_START.center,\n      zoom: EARTH_LIVE_START.zoom,\n      pitch: EARTH_LIVE_START.pitch,\n      bearing: EARTH_LIVE_START.bearing,\n      duration: 1800,\n      essential: false,\n    });''',
              'reset live city tour',
          )

          replace_once(
              'if (bounds) map.fitBounds(bounds, { padding: 100, maxZoom: 12.5, duration: 850, pitch: 55 });\n    else map.easeTo({ center: UAE_ORBIT_CENTER, zoom: 7, pitch: 55, duration: 850 });',
              'if (bounds) map.fitBounds(bounds, { padding: 100, maxZoom: 15.5, duration: 1050, pitch: 66 });\n    else map.flyTo({ center: EARTH_LIVE_START.center, zoom: EARTH_LIVE_START.zoom, pitch: EARTH_LIVE_START.pitch, bearing: EARTH_LIVE_START.bearing, duration: 1400, essential: false });',
              'operations focus fallback',
          )

          replace_once('NEXUS ORBITAL LIVE · UAE', 'NEXUS EARTH LIVE 3D · UAE', 'hud title')
          replace_once(
              'قمر صناعي + حركة طرق حقيقية + عمليات DAY NIGHT',
              'شوارع فضائية + مبانٍ ومجسمات 3D + حركة طرق حقيقية + عمليات DAY NIGHT',
              'arabic hud subtitle',
          )
          replace_once(
              'Satellite imagery + real traffic + DAY NIGHT operations',
              'Satellite streets + real 3D environment + real traffic + DAY NIGHT operations',
              'english hud subtitle',
          )
          replace_once(
              '<Activity size={15} /> ORBIT',
              '<Activity size={15} /> LIVE 3D',
              'live tour button',
          )
          replace_once(
              '<span><Activity size={12} /> SATELLITE IMAGERY</span>',
              '<span><Activity size={12} /> SATELLITE + 3D BUILDINGS</span>',
              'ambient 3d status',
          )
          replace_once(
              '<span><Clock3 size={12} /> {lightPresetForDubai(now).toUpperCase()}</span>',
              '<span><Clock3 size={12} /> UAE {lightPresetForDubai(now).toUpperCase()} · 3D DAY VISIBILITY</span>',
              'ambient daylight status',
          )
          replace_once(
              'NEXUS ORBITAL LIVE command center',
              'DAY NIGHT NEXUS EARTH LIVE 3D command center',
              'dispatch audit note',
          )
          replace_once(
              'NEXUS ORBITAL LIVE فوق الإمارات',
              'NEXUS EARTH LIVE 3D للشوارع والمباني فوق الإمارات',
              'arabic aria label',
          )
          replace_once(
              'NEXUS ORBITAL LIVE over the UAE',
              'NEXUS EARTH LIVE 3D streets and buildings over the UAE',
              'english aria label',
          )

          component.write_text(s, encoding='utf-8')

          c = css.read_text(encoding='utf-8')
          old_vignette = '''.dn-nexus-command-map__vignette {\n  position: absolute;\n  z-index: 1;\n  inset: 0;\n  pointer-events: none;\n  background:\n    linear-gradient(180deg, rgba(1, 6, 15, 0.72) 0%, transparent 25%, transparent 72%, rgba(1, 6, 15, 0.7) 100%),\n    linear-gradient(90deg, rgba(1, 6, 15, 0.42), transparent 22%, transparent 78%, rgba(1, 6, 15, 0.42));\n  box-shadow: inset 0 0 100px rgba(1, 7, 18, 0.5);\n}'''
          new_vignette = '''.dn-nexus-command-map__vignette {\n  position: absolute;\n  z-index: 1;\n  inset: 0;\n  pointer-events: none;\n  background:\n    linear-gradient(180deg, rgba(1, 8, 18, 0.34) 0%, transparent 16%, transparent 80%, rgba(1, 8, 18, 0.28) 100%),\n    linear-gradient(90deg, rgba(1, 8, 18, 0.16), transparent 13%, transparent 87%, rgba(1, 8, 18, 0.16));\n  box-shadow: inset 0 0 42px rgba(1, 7, 18, 0.22);\n}'''
          if old_vignette not in c:
              raise SystemExit('Missing CSS vignette contract')
          c = c.replace(old_vignette, new_vignette, 1)
          c = c.replace('  opacity: 0.72;\n}\n\n.dn-nexus-command-map__scan::before,', '  display: none;\n  opacity: 0;\n}\n\n.dn-nexus-command-map__scan::before,', 1)
          css.write_text(c, encoding='utf-8')
          PY

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NEXUS EARTH LIVE 3D · UAE' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q 'show3dBuildings: true' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q 'zoom: 15.55' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q 'SATELLITE + 3D BUILDINGS' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q 'display: none' artifacts/day-night-delivery/src/styles/dn-nexus-orbital-live.css
          ! grep -q 'center: UAE_ORBIT_CENTER' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DAY NIGHT NEXUS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx artifacts/day-night-delivery/src/styles/dn-nexus-orbital-live.css
          git diff --cached --check
          git commit -m 'feat(nexus): enter real street-level 3D live city view'
          git push origin HEAD:feature/nexus-earth-live-3d-20260816
