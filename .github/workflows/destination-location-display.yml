name: Destination Location Display

on:
  push:
    branches:
      - fix/destination-location-display
    paths:
      - .github/workflows/destination-location-display.yml
      - artifacts/day-night-delivery/scripts/apply-destination-location-format.py
      - artifacts/day-night-delivery/scripts/destination-location-tests.ts
      - artifacts/day-night-delivery/src/lib/destinationLocation.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: destination-location-display-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/destination-location-display
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply central destination formatter
        run: python artifacts/day-night-delivery/scripts/apply-destination-location-format.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run destination formatter tests
        working-directory: artifacts/day-night-delivery
        run: pnpm destination-location:test

      - name: TypeScript check
        working-directory: artifacts/day-night-delivery
        run: pnpm typecheck

      - name: Export language policy gate
        working-directory: artifacts/day-night-delivery
        run: pnpm export-language:gate

      - name: Complete production gate
        working-directory: artifacts/day-night-delivery
        run: pnpm production:gate

      - name: Production build
        working-directory: artifacts/day-night-delivery
        run: pnpm build

      - name: Remove one-time patch infrastructure
        run: |
          rm -f artifacts/day-night-delivery/scripts/apply-destination-location-format.py
          rm -f .github/workflows/destination-location-display.yml

      - name: Publish validated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(i18n): format destinations as emirate and area"
          git push origin HEAD:fix/destination-location-display
