name: Merchant Debit Runtime Truth

on:
  push:
    branches:
      - fix/merchant-debit-runtime-truth-20260805

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/merchant-debit-runtime-truth-20260805
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply authoritative runtime repair
        run: python scripts/merchant-debit-runtime-truth-patch.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "daynight.ae@gmail.com"
          git add artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx \
                  artifacts/day-night-delivery/src/lib/orderFinancialOperations.ts \
                  .github/workflows/merchant-debit-runtime-truth.yml \
                  scripts/merchant-debit-runtime-truth-patch.py
          git commit -m "fix(admin): make merchant debit preview authoritative"
          git push origin HEAD:fix/merchant-debit-runtime-truth-20260805
