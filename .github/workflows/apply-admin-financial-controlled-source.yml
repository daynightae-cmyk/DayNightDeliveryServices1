name: Apply Admin Financial Controlled Source Cleanup

on:
  push:
    branches:
      - fix/admin-financial-controlled-source-20260805
    paths:
      - .github/workflows/apply-admin-financial-controlled-source.yml

permissions:
  contents: write

jobs:
  apply-source-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-financial-controlled-source-20260805
          fetch-depth: 0

      - name: Apply exact cleanup
        run: python .github/scripts/apply-admin-financial-controlled-source.py

      - name: Verify and commit branch-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "day-night-ci"
          git config user.email "day-night-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): make financial onChange the sole live state writer"
          git push origin HEAD:fix/admin-financial-controlled-source-20260805
