name: Admin Complete Order Edit Schema Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/admin-complete-order-edit-schema-once.yml"
      - "supabase/migrations/20260802084500_admin_complete_order_edit.sql"
      - "artifacts/day-night-delivery/scripts/admin-complete-order-edit-gate.mjs"

permissions:
  contents: read

concurrency:
  group: admin-complete-order-edit-schema-once
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    if: >-
      github.repository == 'daynightae-cmyk/DayNightDeliveryServices1' &&
      github.event.pull_request.head.ref == 'fix/admin-full-order-edit-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact branch, lineage, secrets, and production project
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done
          git merge-base --is-ancestor 283e71b5127054104cdae36b080778728d97579f HEAD
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - name: Confirm exact migration safety contract
        shell: bash
        run: |
          set -euo pipefail
          target="supabase/migrations/20260802084500_admin_complete_order_edit.sql"
          test -s "$target"
          grep -F "begin;" "$target" >/dev/null
          grep -F "commit;" "$target" >/dev/null
          grep -F "admin_update_order_complete_verified" "$target" >/dev/null
          grep -F "order_admin_edit_audit" "$target" >/dev/null
          grep -F "for update" "$target" >/dev/null
          ! grep -Eiq 'truncate[[:space:]]+table|drop[[:space:]]+table[[:space:]]+public\.(orders|merchants)|delete[[:space:]]+from[[:space:]]+public\.(orders|merchants)' "$target"

      - name: Check whether the RPC is already exposed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const response = await fetch(`${root}/rest/v1/`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              Accept: 'application/openapi+json',
            },
          });
          if (!response.ok) throw new Error(`openapi_${response.status}_${await response.text()}`);
          const spec = await response.json();
          console.log(JSON.stringify({
            before_complete_edit_rpc_exposed: Boolean(spec.paths?.['/rpc/admin_update_order_complete_verified']),
            before_health_rpc_exposed: Boolean(spec.paths?.['/rpc/admin_complete_order_edit_health']),
          }, null, 2));
          NODE

      - name: Apply only the audited complete-order-edit migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 2; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD" >&2; exit 2; }
          release_dir="$RUNNER_TEMP/daynight-admin-complete-order-edit"
          target="20260802084500_admin_complete_order_edit.sql"
          rm -rf "$release_dir"
          mkdir -p "$release_dir/supabase/migrations"
          cp supabase/config.toml "$release_dir/supabase/config.toml"
          supabase --workdir "$release_dir" link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$release_dir" migration fetch --linked
          if [ -f "$release_dir/supabase/migrations/$target" ]; then
            echo "$target is already recorded; skipping mutation and verifying live contract"
          else
            cp "supabase/migrations/$target" "$release_dir/supabase/migrations/$target"
            supabase --workdir "$release_dir" db push --dry-run
            supabase --workdir "$release_dir" db push --yes
          fi

      - name: Wait for PostgREST schema reload
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node --input-type=module <<'NODE'
          const root = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const response = await fetch(`${root}/rest/v1/`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              Accept: 'application/openapi+json',
            },
          });
          if (!response.ok) process.exit(1);
          const spec = await response.json();
          const ok = Boolean(
            spec.paths?.['/rpc/admin_update_order_complete_verified'] &&
            spec.paths?.['/rpc/admin_complete_order_edit_health'] &&
            spec.paths?.['/order_admin_edit_audit']
          );
          process.exit(ok ? 0 : 1);
          NODE
            then
              echo "Complete order editor RPCs and audit table are exposed"
              exit 0
            fi
            sleep 2
          done
          echo "PostgREST did not expose the complete order editor contract" >&2
          exit 1

      - name: Verify live health contract without editing an order
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const response = await fetch(`${root}/rest/v1/rpc/admin_complete_order_edit_health`, {
            method: 'POST',
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              'Content-Type': 'application/json',
            },
            body: '{}',
          });
          const text = await response.text();
          if (!response.ok) throw new Error(`health_${response.status}_${text}`);
          const data = JSON.parse(text);
          if (data?.ok !== true) throw new Error(`health_not_ready_${text}`);
          console.log(JSON.stringify(data, null, 2));
          NODE
