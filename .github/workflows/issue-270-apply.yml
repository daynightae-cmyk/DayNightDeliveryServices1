name: Apply Issue 270 Direct Abu Khalifa Integration

on:
  push:
    branches:
      - fix/issue-270-direct-abu-khalifa
    paths:
      - .github/issue-270-patch.py
      - .github/workflows/issue-270-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-270-direct-abu-khalifa
          fetch-depth: 0

      - name: Apply direct React integration
        run: python3 .github/issue-270-patch.py

      - name: Run source contract gate
        working-directory: artifacts/day-night-delivery
        run: node scripts/p1-production-hardening-gate.mjs

      - name: Validate patch formatting
        run: git diff --check

      - name: Remove one-time patch automation
        run: |
          rm -f .github/issue-270-patch.py
          rm -f .github/workflows/issue-270-apply.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): integrate Abu Khalifa card directly in React (#270)"
          git push origin HEAD:fix/issue-270-direct-abu-khalifa
