name: Finalize Admin UAE Areas Smart Suggestions

on:
  push:
    branches:
      - feat/admin-uae-smart-suggestions-arabic-currency-20260804
    paths:
      - ".github/workflows/finalize-admin-uae-smart-suggestions.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-admin-uae-smart-suggestions.yml"
      - "artifacts/day-night-delivery/package.json"
      - "artifacts/day-night-delivery/scripts/admin-uae-smart-suggestions-currency-gate.mjs"
      - "artifacts/day-night-delivery/src/data/uaeLocations.ts"
      - "artifacts/day-night-delivery/src/components/admin/AdminHistoryAutocomplete.tsx"
      - "artifacts/day-night-delivery/src/lib/adminLocale.ts"
      - "artifacts/day-night-delivery/src/styles/dn-admin-smart-autocomplete.css"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-admin-uae-smart-suggestions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-uae-smart-suggestions-arabic-currency-20260804
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify UAE areas smart suggestions and currency
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-uae-smart-suggestions-currency-gate.mjs

      - name: Verify destination and location behavior
        working-directory: artifacts/day-night-delivery
        run: node scripts/destination-location-tests.mjs

      - name: Verify final order lifecycle
        working-directory: artifacts/day-night-delivery
        run: node scripts/admin-order-lifecycle-final-gate.mjs

      - name: TypeScript
        run: pnpm run web:typecheck

      - name: Full production gate
        run: pnpm run web:gate

      - name: Production build
        run: pnpm run web:build

      - name: Remove temporary verification workflow
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAY NIGHT CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finalize-admin-uae-smart-suggestions.yml
          git diff --cached --check
          git commit -m "ci(admin): finalize UAE suggestion verification"
          git push origin HEAD:feat/admin-uae-smart-suggestions-arabic-currency-20260804
