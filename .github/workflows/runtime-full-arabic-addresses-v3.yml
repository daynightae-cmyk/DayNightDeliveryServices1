name: Generate Runtime Full Arabic Addresses V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-full-arabic-addresses-v3.yml
      - artifacts/day-night-delivery/scripts/repair-runtime-full-arabic-address-generator-v3.py
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: generate-runtime-full-arabic-addresses-v3
  cancel-in-progress: false

jobs:
  generate-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_BRANCH: fix/runtime-full-arabic-addresses-source-v3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect existing source state
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SOURCE_BRANCH" --state open --json number --jq '.[0].number // empty')"
            echo "pr=$existing_pr" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover PR for an existing source branch
        if: steps.source.outputs.exists == 'true' && steps.source.outputs.pr == ''
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SOURCE_BRANCH" \
            --title "Arabic UI: complete addresses across web and apps" \
            --body "Recovered the validated complete-address source branch after a transient PR publication failure."

      - name: Setup pnpm
        if: steps.source.outputs.exists != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.source.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply reviewed generator corrections and source patch
        id: patch
        if: steps.source.outputs.exists != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            git switch -c "$SOURCE_BRANCH"
            python artifacts/day-night-delivery/scripts/fix-runtime-full-arabic-address-generator.py
            python artifacts/day-night-delivery/scripts/repair-runtime-full-arabic-address-generator-v3.py
            python -m py_compile artifacts/day-night-delivery/scripts/apply-runtime-full-arabic-addresses.py
            python artifacts/day-night-delivery/scripts/apply-runtime-full-arabic-addresses.py
            git rm -f artifacts/day-night-delivery/scripts/apply-runtime-full-arabic-addresses.py
            git rm -f artifacts/day-night-delivery/scripts/fix-runtime-full-arabic-address-generator.py
            git rm -f artifacts/day-night-delivery/scripts/repair-runtime-full-arabic-address-generator-v3.py
            git rm -f .github/workflows/runtime-full-arabic-addresses.yml
            git rm -f .github/workflows/runtime-full-arabic-addresses-v2.yml
            git rm -f .github/workflows/runtime-full-arabic-addresses-v3.yml
          ) > "$RUNNER_TEMP/runtime-address-v3-patch.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/runtime-address-v3-patch.log"
          exit "$status"

      - name: Validate TypeScript, full address policy, production gates and build
        id: validate
        if: steps.source.outputs.exists != 'true' && steps.patch.outcome == 'success'
        continue-on-error: true
        working-directory: artifacts/day-night-delivery
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm exec tsc --noEmit
            node scripts/export-language-policy-gate.mjs
            pnpm production:gate
            pnpm build
          ) > "$RUNNER_TEMP/runtime-address-v3-validate.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/runtime-address-v3-validate.log"
          exit "$status"

      - name: Remove build-generated asset changes
        if: steps.source.outputs.exists != 'true' && steps.patch.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          generated=(
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/admin-dashboard-reference.png
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/admin-map.png
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/intro-gateway.png
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/khalifa-card-reference.png
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/loading-command-center.png
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/login-extra-reference.png
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/login-reference.png
            artifacts/day-night-delivery/public/assets/daynight/admin-auth-v3/logo-glass.png
            artifacts/day-night-delivery/public/assets/daynight/merchant-statement-logo.png
          )
          for path in "${generated[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git restore --source=HEAD --staged --worktree -- "$path"
            else
              rm -f -- "$path"
            fi
          done

      - name: Publish validated source branch and PR
        id: publish
        if: steps.source.outputs.exists != 'true' && steps.patch.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(i18n): localize complete addresses across every surface"
          git push origin "$SOURCE_BRANCH"

          cat > "$RUNNER_TEMP/runtime-full-arabic-addresses-v3.md" <<'EOF'
          ## الهدف

          عرض العنوان العربي الكامل كما سُجل في الطلب بكل واجهات DAY NIGHT، وليس اسم الإمارة فقط.

          ## النطاق

          - المدينة والمنطقة والشارع والمبنى والفيلا/الشقة والطابق والمعلم.
          - الويب ولوحة الإدارة والعميل والتاجر والمندوب والتتبع والخرائط ورسائل واتساب.
          - أغلفة Android وiOS للتاجر والمندوب عبر Runtime المشترك.
          - أولوية الحقول العربية لكل مكوّن، مع تعريب المكوّن الإنجليزي فقط عند غياب مقابله العربي.
          - تحديثات Realtime لا تعيد عنواناً قديماً، والخريطة تحتفظ باسم المدينة عند غياب عنوان تفصيلي.
          - الإنجليزية تستعيد القيم الأصلية بلا تعريب.

          ## الفحص

          - TypeScript
          - Full Arabic address policy gate
          - Complete production gate
          - Production build
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SOURCE_BRANCH" \
            --title "Arabic UI: complete addresses across web and apps" \
            --body-file "$RUNNER_TEMP/runtime-full-arabic-addresses-v3.md"

      - name: Report sanitized V3 outcome
        if: always() && steps.source.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          patch_tail="$(tail -n 60 "$RUNNER_TEMP/runtime-address-v3-patch.log" 2>/dev/null || true)"
          validate_tail="$(tail -n 80 "$RUNNER_TEMP/runtime-address-v3-validate.log" 2>/dev/null || true)"
          {
            echo "## Runtime full Arabic addresses V3"
            echo
            echo "- Patch: ${{ steps.patch.outcome }}"
            echo "- Validation/build: ${{ steps.validate.outcome }}"
            echo "- Publish: ${{ steps.publish.outcome }}"
            echo "- Run: ${{ github.run_id }}"
            echo
            echo "### Patch tail"
            echo '```text'
            printf '%s\n' "$patch_tail"
            echo '```'
            echo
            echo "### Validation tail"
            echo '```text'
            printf '%s\n' "$validate_tail"
            echo '```'
          } > "$RUNNER_TEMP/runtime-address-v3-report.md"
          gh pr comment 310 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/runtime-address-v3-report.md"

      - name: Fail closed when V3 generation did not pass
        if: steps.source.outputs.exists != 'true' && (steps.patch.outcome != 'success' || steps.validate.outcome != 'success' || steps.publish.outcome != 'success')
        shell: bash
        run: exit 1
