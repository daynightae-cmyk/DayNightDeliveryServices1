name: Global Merchant Order Visibility

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20260802004000_global_order_merchant_portal_visibility.sql
      - artifacts/day-night-delivery/src/lib/orderFinancialOperations.ts
      - artifacts/day-night-delivery/src/lib/adminData.ts
      - artifacts/day-night-delivery/src/components/AdminPanelLuxury.tsx
      - .github/workflows/global-merchant-order-visibility-production.yml
  push:
    branches: [main]
    paths:
      - supabase/migrations/20260802004000_global_order_merchant_portal_visibility.sql
      - .github/workflows/global-merchant-order-visibility-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-merchant-order-visibility-production
  cancel-in-progress: false

jobs:
  verify-and-apply:
    name: Enforce saved order visibility in the correct merchant portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-runtime-tests

    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate protected production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in VITE_SUPABASE_URL SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing protected production secrets: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - name: Build isolated migration release
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          target="20260802004000_global_order_merchant_portal_visibility.sql"
          workdir="$RUNNER_TEMP/day-night-global-merchant-visibility"
          rm -rf "$workdir"
          mkdir -p "$workdir/supabase/migrations"
          cp supabase/config.toml "$workdir/supabase/config.toml"
          supabase --workdir "$workdir" link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$workdir" migration fetch --linked
          if [ -f "$workdir/supabase/migrations/$target" ]; then
            echo "TARGET_ALREADY_APPLIED=true" >> "$GITHUB_ENV"
          else
            cp "supabase/migrations/$target" "$workdir/supabase/migrations/$target"
            echo "TARGET_ALREADY_APPLIED=false" >> "$GITHUB_ENV"
          fi
          echo "VISIBILITY_WORKDIR=$workdir" >> "$GITHUB_ENV"
          echo "VISIBILITY_TARGET=$target" >> "$GITHUB_ENV"

      - name: Dry-run exact visibility migration
        if: env.TARGET_ALREADY_APPLIED != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/global-merchant-visibility-dry-run.txt"
          supabase --workdir "$VISIBILITY_WORKDIR" db push --dry-run 2>&1 | tee "$output"
          grep -Fq "$VISIBILITY_TARGET" "$output"

      - name: Apply exact migration atomically
        if: env.TARGET_ALREADY_APPLIED != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase --workdir "$VISIBILITY_WORKDIR" db push --yes

      - name: Verify production contract without creating an order
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root = String(process.env.VITE_SUPABASE_URL || '').replace(/\/$/, '');
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '');
          const headers = {
            apikey: key,
            Authorization: `Bearer ${key}`,
            'Content-Type': 'application/json',
          };
          async function rpc(name, body = {}) {
            const response = await fetch(`${root}/rest/v1/rpc/${name}`, {
              method: 'POST', headers, body: JSON.stringify(body),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`${name}_http_${response.status}_${JSON.stringify(payload)}`);
            return payload;
          }
          const health = await rpc('admin_order_merchant_visibility_health');
          if (health?.ok !== true || health?.resolver_ready !== true || health?.trigger_ready !== true) {
            throw new Error(`visibility_contract_unhealthy_${JSON.stringify(health)}`);
          }
          const merchantResponse = await fetch(
            `${root}/rest/v1/merchants?select=id,merchant_code,trade_name&merchant_code=eq.DN-MER-1999-MFAWI&limit=1`,
            { headers },
          );
          const merchants = await merchantResponse.json().catch(() => ([]));
          if (!merchantResponse.ok || !Array.isArray(merchants) || !merchants[0]?.id) {
            throw new Error('known_portal_merchant_not_found');
          }
          const resolution = await rpc('admin_resolve_order_merchant', {
            p_merchant_id: merchants[0].id,
          });
          if (
            resolution?.ok !== true ||
            resolution?.canonical_merchant_id !== merchants[0].id ||
            Number(resolution?.portal_link_count || 0) < 1
          ) {
            throw new Error(`known_merchant_resolution_failed_${JSON.stringify(resolution)}`);
          }
          console.log(JSON.stringify({ health, resolution }, null, 2));
          NODE
