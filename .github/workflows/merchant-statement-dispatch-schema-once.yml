name: Merchant Statement Dispatch Schema Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/merchant-statement-dispatch-schema-once.yml"
      - ".github/scripts/merchant-statement-dispatch-production-probe.mjs"
      - "supabase/migrations/20260802110000_merchant_statement_dispatch_tracking.sql"

permissions:
  contents: read

concurrency:
  group: merchant-statement-dispatch-schema-once
  cancel-in-progress: false

jobs:
  deploy-and-probe:
    if: >-
      github.repository == 'daynightae-cmyk/DayNightDeliveryServices1' &&
      github.event.pull_request.head.ref == 'feat/merchant-statement-dispatch-tracking-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-runtime-tests
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNTIME_ADMIN_EMAIL: ${{ secrets.RUNTIME_ADMIN_EMAIL }}
      RUNTIME_ADMIN_PASSWORD: ${{ secrets.RUNTIME_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact guarded migration
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY RUNTIME_ADMIN_EMAIL RUNTIME_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected secret: $name" >&2; exit 2; }
          done

          project_ref="$(node -e "const u=new URL(process.env.VITE_SUPABASE_URL);process.stdout.write(u.hostname.split('.')[0])")"
          test "$project_ref" = "ngdwybpgacauorygoedi"
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

          target="supabase/migrations/20260802110000_merchant_statement_dispatch_tracking.sql"
          probe=".github/scripts/merchant-statement-dispatch-production-probe.mjs"
          test -s "$target"
          test -s "$probe"
          grep -F "merchant_statement_dispatch_log" "$target" >/dev/null
          grep -F "admin_confirm_merchant_statement_dispatch" "$target" >/dev/null
          grep -F "merchant_statement_resend_reason_required" "$target" >/dev/null
          grep -F "order_row.merchant_id = p_merchant_id" "$target" >/dev/null
          grep -F "p_dry_run boolean default false" "$target" >/dev/null
          ! grep -Eiq 'truncate[[:space:]]+table|drop[[:space:]]+table|delete[[:space:]]+from[[:space:]]+public\.(orders|merchants)' "$target"

      - name: Apply only the dispatch migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN" >&2; exit 2; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD" >&2; exit 2; }

          release_dir="$RUNNER_TEMP/daynight-merchant-dispatch-schema"
          target="20260802110000_merchant_statement_dispatch_tracking.sql"
          rm -rf "$release_dir"
          mkdir -p "$release_dir/supabase/migrations"
          cp supabase/config.toml "$release_dir/supabase/config.toml"

          supabase --workdir "$release_dir" link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase --workdir "$release_dir" migration fetch --linked

          if [ -f "$release_dir/supabase/migrations/$target" ]; then
            echo "$target already recorded"
          else
            cp "supabase/migrations/$target" "$release_dir/supabase/migrations/$target"
            supabase --workdir "$release_dir" db push --dry-run
            supabase --workdir "$release_dir" db push --yes
          fi

      - name: Verify dispatch runtime exposure
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node --input-type=module <<'NODE'
          const root = process.env.VITE_SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const response = await fetch(`${root}/rest/v1/`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              Accept: 'application/openapi+json',
            },
          });
          if (!response.ok) process.exit(1);
          const spec = await response.json();
          const paths = spec.paths || {};
          const required = [
            '/rpc/admin_get_merchant_statement_dispatch_status',
            '/rpc/admin_confirm_merchant_statement_dispatch',
            '/rpc/admin_merchant_statement_dispatch_health',
          ];
          process.exit(required.every((path) => paths[path]) ? 0 : 1);
          NODE
            then
              echo "Merchant statement dispatch runtime is exposed"
              exit 0
            fi
            sleep 2
          done
          echo "Merchant statement dispatch RPCs were not exposed by PostgREST" >&2
          exit 1

      - name: Execute authenticated no-write production probe
        run: node .github/scripts/merchant-statement-dispatch-production-probe.mjs
