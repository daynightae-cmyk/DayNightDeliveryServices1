name: NEXUS Satellite Streets 3D Temp

on:
  push:
    branches:
      - feature/nexus-earth-live-3d-20260816
    paths:
      - .github/workflows/nexus-satellite-streets-3d-temp.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nexus-earth-live-3d-20260816
          fetch-depth: 0

      - name: Use Satellite Streets with official classic 3D building extrusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path('artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx')
          gate = Path('artifacts/day-night-delivery/scripts/nexus-phase1-production-gate.mjs')
          s = component.read_text(encoding='utf-8')

          old_map = '''        localMap = new mapboxgl.Map({\n          container: mapHostRef.current,\n          // Standard owns the authoritative 3D scene. Satellite mode is composited\n          // underneath its roads, labels and 3D objects after style load.\n          style: "mapbox://styles/mapbox/standard",\n          center: EARTH_LIVE_START.center,\n          zoom: EARTH_LIVE_START.zoom,\n          pitch: EARTH_LIVE_START.pitch,\n          bearing: EARTH_LIVE_START.bearing,\n          projection: "mercator",\n          config: {\n            basemap: {\n              lightPreset: "day",\n              showRoadsAndTransit: true,\n              showPedestrianRoads: true,\n              showRoadLabels: true,\n              showPlaceLabels: true,\n              showPointOfInterestLabels: true,\n              showTransitLabels: true,\n            },\n          },\n          attributionControl: true,\n          antialias: true,\n        });'''
          new_map = '''        const satelliteStreetMode = styleMode === "satellite";\n        localMap = new mapboxgl.Map({\n          container: mapHostRef.current,\n          // Satellite mode uses one coherent classic style: authentic aerial imagery +\n          // Streets vector data. We then extrude its own building layer in 3D.\n          style: satelliteStreetMode\n            ? "mapbox://styles/mapbox/satellite-streets-v12"\n            : "mapbox://styles/mapbox/standard",\n          center: EARTH_LIVE_START.center,\n          zoom: EARTH_LIVE_START.zoom,\n          pitch: EARTH_LIVE_START.pitch,\n          bearing: EARTH_LIVE_START.bearing,\n          projection: "mercator",\n          ...(satelliteStreetMode ? {} : {\n            config: {\n              basemap: {\n                lightPreset: "day",\n                showRoadsAndTransit: true,\n                showPedestrianRoads: true,\n                showRoadLabels: true,\n                showPlaceLabels: true,\n                showPointOfInterestLabels: true,\n                showTransitLabels: true,\n              },\n            },\n          }),\n          attributionControl: true,\n          antialias: true,\n        });'''
          if old_map not in s:
              raise SystemExit('map constructor anchor not found')
          s = s.replace(old_map, new_map, 1)

          old_visual = '''          for (const [key, value] of Object.entries(visualConfig)) {\n            try {\n              localMap.setConfigProperty("basemap", key, value);\n            } catch {\n              // Individual visual capabilities vary by Standard style revision.\n            }\n          }'''
          new_visual = '''          if (!satelliteStreetMode) {\n            for (const [key, value] of Object.entries(visualConfig)) {\n              try {\n                localMap.setConfigProperty("basemap", key, value);\n              } catch {\n                // Individual visual capabilities vary by Standard style revision.\n              }\n            }\n          }'''
          if old_visual not in s:
              raise SystemExit('visual config anchor not found')
          s = s.replace(old_visual, new_visual, 1)

          start = s.find('          // Hybrid Earth view: real Mapbox Satellite imagery stays below Standard')
          end = s.find('          const topSlot = { slot: "top" } as any;', start)
          if start < 0 or end < 0:
              raise SystemExit('hybrid raster block not found')

          classic3d = '''          // Satellite Streets already contains the real aerial imagery and the Mapbox\n          // Streets composite vector source. Extrude the same mapped building footprints\n          // with their real height/min_height attributes so imagery remains visible.\n          if (satelliteStreetMode) {\n            try {\n              const styleLayers = localMap.getStyle()?.layers || [];\n              const firstTextLabel = styleLayers.find((layer: any) =>\n                layer.type === "symbol" && layer.layout?.["text-field"],\n              )?.id;\n              if (localMap.getSource("composite") && !localMap.getLayer("dn-nexus-satellite-buildings-3d")) {\n                localMap.addLayer({\n                  id: "dn-nexus-satellite-buildings-3d",\n                  source: "composite",\n                  "source-layer": "building",\n                  filter: ["==", "extrude", "true"],\n                  type: "fill-extrusion",\n                  minzoom: 14.2,\n                  paint: {\n                    "fill-extrusion-color": [\n                      "interpolate", ["linear"], ["coalesce", ["get", "height"], 0],\n                      0, "#d8d3c9",\n                      70, "#ddd7cc",\n                      180, "#e7ddc5",\n                      400, "#f0e3bd",\n                    ],\n                    "fill-extrusion-height": [\n                      "interpolate", ["linear"], ["zoom"],\n                      14.2, 0,\n                      14.75, ["get", "height"],\n                    ],\n                    "fill-extrusion-base": [\n                      "interpolate", ["linear"], ["zoom"],\n                      14.2, 0,\n                      14.75, ["get", "min_height"],\n                    ],\n                    "fill-extrusion-opacity": 0.78,\n                    "fill-extrusion-vertical-gradient": true,\n                  },\n                } as any, firstTextLabel);\n              }\n            } catch (cause) {\n              console.warn("NEXUS Satellite Streets 3D buildings unavailable.", cause);\n            }\n          }\n\n          const topSlot = satelliteStreetMode ? ({} as any) : ({ slot: "top" } as any);\n'''
          s = s[:start] + classic3d + s[end + len('          const topSlot = { slot: "top" } as any;\n'):]
          component.write_text(s, encoding='utf-8')

          g = gate.read_text(encoding='utf-8')
          g = g.replace("  'style: \"mapbox://styles/mapbox/standard\"',\n  'mapbox://mapbox.satellite',\n  'slot: \"middle\"',", "  'mapbox://styles/mapbox/satellite-streets-v12',\n  'mapbox://styles/mapbox/standard',\n  'satelliteStreetMode',\n  'dn-nexus-satellite-buildings-3d',\n  '\"source-layer\": \"building\"',\n  'type: \"fill-extrusion\"',", 1)
          g = g.replace("  'dn-nexus-satellite-imagery',\n  'type: \"raster\"',\n", "  'dn-nexus-satellite-buildings-3d',\n  '\"fill-extrusion-height\"',\n  '\"fill-extrusion-base\"',\n", 1)
          g = g.replace("assert(!orbitalMap.includes('dn-nexus-real-building-extrusions'), 'conflicting explicit extrusion layer must stay removed');", "assert(!orbitalMap.includes('dn-nexus-real-building-extrusions'), 'conflicting external-source extrusion layer must stay removed');\nassert(!orbitalMap.includes('dn-nexus-satellite-imagery'), 'Standard raster-compositing experiment must stay removed');", 1)
          g = g.replace('Standard 3D scene + real Mapbox Satellite raster in middle slot behind Standard 3D required', 'Satellite Streets imagery + its own composite building heights required in satellite mode', 1)
          gate.write_text(g, encoding='utf-8')
          PY

          grep -q 'mapbox://styles/mapbox/satellite-streets-v12' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q 'dn-nexus-satellite-buildings-3d' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q '"source-layer": "building"' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          grep -q '"fill-extrusion-height"' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          ! grep -q 'dn-nexus-satellite-imagery' artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx
          git diff --check

      - name: Commit true satellite plus 3D composition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DAY NIGHT NEXUS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/day-night-delivery/src/components/admin/AdminNexusOrbitalLiveCommandMap.tsx artifacts/day-night-delivery/scripts/nexus-phase1-production-gate.mjs
          git diff --cached --check
          git commit -m 'fix(nexus): render 3D buildings directly over satellite streets'
          git push origin HEAD:feature/nexus-earth-live-3d-20260816
