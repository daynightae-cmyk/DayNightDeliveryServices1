name: Admin Financial Input Autocomplete Fix

on:
  push:
    branches: [fix/admin-financial-input-autocomplete-20260805]
    paths:
      - .github/repairs/apply-admin-financial-input-autocomplete.py
      - .github/workflows/admin-financial-input-autocomplete-fix.yml

permissions:
  contents: write

concurrency:
  group: admin-financial-input-autocomplete-fix
  cancel-in-progress: false

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-financial-input-autocomplete-20260805
          fetch-depth: 0

      - name: Apply focused repair
        run: python .github/repairs/apply-admin-financial-input-autocomplete.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Financial acceptance gate
        run: node artifacts/day-night-delivery/scripts/admin-new-order-live-financial-gate.mjs

      - name: TypeScript
        run: pnpm --dir artifacts/day-night-delivery run typecheck

      - name: Production build
        run: pnpm --dir artifacts/day-night-delivery run build

      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'data-admin-financial-input="true"' artifacts/day-night-delivery/src/components/admin/AdminNewOrderComplete.tsx
          grep -Fq ':not([type="number"])' artifacts/day-night-delivery/src/components/admin/AdminHistoryAutocomplete.tsx
          grep -Fq 'input.dataset.adminFinancialInput === "true"' artifacts/day-night-delivery/src/components/admin/AdminHistoryAutocomplete.tsx

      - name: Remove temporary repair automation
        run: |
          rm -f .github/repairs/apply-admin-financial-input-autocomplete.py
          rm -f .github/workflows/admin-financial-input-autocomplete-fix.yml

      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'daynight-financial-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(admin): isolate financial fields from history autocomplete'
          git push origin HEAD:fix/admin-financial-input-autocomplete-20260805
