plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("DAYNIGHT_ANDROID_KEYSTORE")
def roleWebBaseUrl = (System.getenv("DAYNIGHT_ROLE_WEB_BASE_URL") ?: "https://www.daynightae.com").replaceAll('/+$', '')
def roleVisualQuery = System.getenv("DAYNIGHT_ROLE_VISUAL_QUERY") ?: ""
def roleRuntimeVersion = "1.2.0"
def kotlinStdlibVersion = "1.8.22"

def roleStartUrl = { String role ->
    def visualSuffix = roleVisualQuery ? "&${roleVisualQuery}" : ""
    return "${roleWebBaseUrl}/${role}?nativeShell=${role}&nosplash=1&__dn_live=role-v${roleRuntimeVersion}${visualSuffix}"
}

android {
    namespace "com.daynightae.shell"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("DAYNIGHT_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("DAYNIGHT_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("DAYNIGHT_ANDROID_KEY_PASSWORD")
            }
        }
    }

    flavorDimensions += "role"
    productFlavors {
        driver {
            dimension "role"
            applicationId "com.daynightae.driver"
            buildConfigField "String", "ROLE", '"driver"'
            buildConfigField "String", "START_URL", "\"${roleStartUrl('driver')}\""
            buildConfigField "String", "BIOMETRIC_KEY_ALIAS", '"daynight_driver_biometric_session_v1"'
            buildConfigField "long", "BIOMETRIC_MAX_AGE_SECONDS", "86400L"
        }
        merchant {
            dimension "role"
            applicationId "com.daynightae.merchant"
            buildConfigField "String", "ROLE", '"merchant"'
            buildConfigField "String", "START_URL", "\"${roleStartUrl('merchant')}\""
            buildConfigField "String", "BIOMETRIC_KEY_ALIAS", '"daynight_merchant_biometric_session_v1"'
            buildConfigField "long", "BIOMETRIC_MAX_AGE_SECONDS", "43200L"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        visual {
            initWith debug
            debuggable true
            matchingFallbacks = ["debug"]
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable "GestureBackNavigation"
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" && details.requested.name.startsWith("kotlin-stdlib")) {
            details.useVersion(kotlinStdlibVersion)
            details.because("Align AndroidX test and biometric transitive Kotlin runtime to avoid duplicate JDK7/JDK8 classes")
        }
    }
}

dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.fragment:fragment:1.8.5"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
}
